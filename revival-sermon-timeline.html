"use strict";
const EVENTS=[{"id":"stewarton","year":1625,"date":"1625–1630년","century":17,"title":"스튜어턴 부흥","person":"데이비드 딕슨","place":"스코틀랜드 어바인·스튜어턴","topic":"말씀과 회심","tags":["장로교","설교","회심"],"end":1630,"story":["17세기 초 스코틀랜드 교회는 종교개혁 이후의 신앙을 지키는 가운데 예배와 교회 운영을 둘러싼 정치적·종교적 압력을 받고 있었습니다. 글래스고대학에서 공부하고 철학을 가르쳤던 데이비드 딕슨(David Dickson)은 1618년 어바인(Irvine)의 목회자로 부임했습니다. 그는 이 일대에서 성경을 해설하고 회개와 회심을 촉구하는 설교를 지속했으며, 어바인과 스튜어턴을 포함한 에어셔 지역의 여러 사람이 그의 설교를 들었습니다.","1625년 무렵부터 스튜어턴과 인근 마을에서는 죄와 구원에 대한 깊은 관심이 나타났습니다. 이전까지 관습적으로 교회에 다니던 이들이 자기 삶을 돌아보고 목회자에게 영적인 문제를 상담했습니다. 당시 사람들이 괴로움과 죄책감을 호소하는 현상을 두고 ‘스튜어턴의 병(Stewarton Sickness)’이라는 별칭도 생겼습니다. 이는 의학적 질병이 집단으로 발생했다는 뜻이 아니라, 죄를 의식하고 괴로워하는 사람들의 모습을 가리킨 역사적 표현입니다.","그러한 움직임은 1630년 무렵까지 여러 해에 걸쳐 계속된 것으로 기록됩니다. 당시 보고에 나오는 회심의 수와 개인의 내면 변화는 정확하게 계량하기 어렵지만, 한 차례의 대형집회보다 지방 교회에서 이어진 설교와 돌봄 속에서 변화가 일어났다는 점이 두드러집니다. 같은 시대의 쇼츠 부흥과 더불어 후대 스코틀랜드 교회사에서 자주 언급되는 초기 부흥 사례입니다."]},{"id":"shotts","year":1630,"date":"1630년 6월 21일","century":17,"title":"쇼츠 부흥","person":"존 리빙스턴","place":"스코틀랜드 쇼츠","topic":"중생과 성령","tags":["장로교","설교","중생"],"story":["1630년 6월 스코틀랜드 라나크셔의 쇼츠(Kirk o’ Shotts) 교회에는 성찬예배를 위해 여러 지역의 성도들이 모였습니다. 성찬식 뒤에도 감사와 기도를 계속하기 원했던 참석자들은 다음 날 월요일에 한 차례 더 설교를 듣기로 했습니다. 설교를 맡은 존 리빙스턴(John Livingstone)은 당시 아직 정식 목사로 안수받기 전이었던 젊은 설교자였습니다.","6월 20일 밤 그는 신자들과 함께 기도하고 신앙 문제를 대화했습니다. 그러나 이튿날 아침에는 참석자들의 기대와 자신의 부족함을 생각하며 설교를 포기하고 떠날 생각까지 했습니다. 실제로 교회에서 떨어진 곳까지 걸어갔으나 마음을 돌려 돌아왔습니다. 그는 6월 21일 교회 마당에 모인 회중 앞에서 에스겔 36장 25–26절, 곧 씻음과 새 마음에 관한 약속을 본문으로 설교했습니다.","리빙스턴은 훗날 이 설교를 자신의 생애에서 특별히 기억에 남는 날로 회고했습니다. 전승 자료에서는 설교를 계기로 약 500명에게 뚜렷한 신앙의 변화가 나타났다고 전하지만, 이는 당시 신앙 증언에 따른 수치이지 현대적 방식으로 검증한 통계는 아닙니다. 성찬과 밤샘 기도, 설교자의 주저함, 한 차례의 성경 설교라는 장면이 비교적 선명하게 남아 있는 사건입니다."]},{"id":"raritan","year":1720,"date":"1720년대","century":18,"title":"뉴저지 개혁교회 부흥","person":"테오도루스 프릴링하이젠","place":"미국 뉴저지 래리턴","topic":"형식주의와 참된 믿음","tags":["개혁교회","칭의","회심"],"story":["18세기 초 미국 뉴저지의 래리턴(Raritan) 계곡에는 네덜란드계 이민자들이 세운 개혁교회들이 있었습니다. 교회가 형성되고 교인 수가 늘었지만, 일부 지역에서는 예배와 성찬 참여가 관례가 되고 도박이나 음주 등으로 갈등을 겪는 모습도 나타났습니다. 독일 출신의 테오도루스 야코부스 프릴링하이젠(Theodorus Jacobus Frelinghuysen)은 네덜란드 개혁교회에서 교육과 안수를 받은 뒤 1720년 이들 교회의 목회자로 부임했습니다.","그는 1720년 1월 31일 첫 설교부터 형식적인 교회 소속과 실제 믿음의 문제를 구별하며 회개와 회심을 촉구했습니다. 여러 마을에 흩어진 네 교회를 방문하며 설교와 교육을 지속했고, 성찬에 참여하려는 사람들에게 자기 신앙을 진지하게 살피도록 요구했습니다. 이러한 목회 방식은 일부 교인과 인근 목회자들의 강한 반발을 불러왔으며, 반대자들은 교회 재판 절차와 공개 문서를 통해 문제를 제기했습니다.","논쟁은 여러 해 계속되었지만 그의 설교와 목양에 감화되었다는 교인들의 기록도 남아 있습니다. 1733년에는 네덜란드 교회 당국의 중재를 통한 화해가 추진되었습니다. 래리턴 지역에서 진행된 이러한 각성운동은 이후 윌리엄과 길버트 테넌트 등의 사역, 1730–1740년대 북미 대각성운동과 연결되는 초기 흐름으로 평가됩니다. 다만 성찬과 치리를 둘러싼 갈등은 참된 회심의 필요성을 강조하는 일과 개별 신자의 신앙을 신중하고 공정하게 판단하는 일이 함께 이루어져야 함을 보여 줍니다."]},{"id":"northampton","year":1734,"date":"1734–1736년","century":18,"title":"노샘프턴 부흥","person":"조나단 에드워즈","place":"미국 매사추세츠 노샘프턴","topic":"참된 부흥의 열매","tags":["회심","분별","성화"],"end":1736,"story":["18세기 초 매사추세츠 노샘프턴은 청교도 전통을 지닌 뉴잉글랜드의 마을이었습니다. 조나단 에드워즈(Jonathan Edwards)는 1720년대 후반부터 이곳 교회에서 목회하며 죄, 구원, 그리스도의 은혜를 설교했습니다. 1734년 무렵 젊은 사람들의 갑작스러운 죽음과 신앙에 관한 논의가 주민들에게 삶과 죽음의 문제를 새롭게 생각하게 만드는 계기가 되었습니다.","그해 말부터 이듬해에 걸쳐 여러 사람이 에드워즈를 찾아와 자신의 구원 문제를 상담했습니다. 사람들은 가정과 모임에서 이전보다 자주 신앙을 이야기했고, 예배와 성경 읽기에도 더 큰 관심을 보였습니다. 에드워즈는 젊은이들이 여가를 보내는 방식과 이웃들이 나누는 대화 주제가 변했다고 기록했으며, 개인들의 회심 경험을 세밀하게 관찰해 정리했습니다.","이 움직임은 노샘프턴만이 아니라 코네티컷강 계곡의 인근 지역으로도 알려졌습니다. 에드워즈는 그 경험을 『놀라운 회심 이야기』(A Faithful Narrative of the Surprising Work of God)에 서술했습니다. 그는 모든 사람이 동일한 방식으로 회심하는 것은 아니라고 보았으며, 눈에 띄는 감정적 반응과 지속적인 신앙의 변화를 구별하려 했습니다. 훗날 『신앙감정론』에서 밝힌 것처럼, 감정이 강렬하거나 몸에 특별한 반응이 나타났다는 사실만으로 은혜의 진위를 판단할 수 없고 그리스도를 향한 사랑과 지속적인 거룩한 실천이 중요하다는 것입니다. 이 때문에 노샘프턴 부흥은 사건에 대한 당시 목회자의 상세한 관찰 기록이 남은 대표적 사례입니다."]},{"id":"awakening","year":1740,"date":"1740–1742년","century":18,"title":"제1차 대각성운동의 확산","person":"조지 휫필드·조나단 에드워즈","place":"북미 여러 지역","topic":"주권적 은혜와 전도","tags":["전도","설교","주권"],"end":1742,"story":["1730년대에 북미 여러 지역에서 독립적으로 시작된 영적 각성은 1740년 무렵 더 넓은 연결망을 이루었습니다. 영국에서 활동하던 조지 휫필드(George Whitefield)는 대서양을 건너 조지아, 필라델피아, 뉴욕, 보스턴과 뉴잉글랜드 여러 곳을 순회하며 설교했습니다. 그의 이동과 설교 소식은 신문, 일기, 편지, 설교 인쇄물을 통해 광범위하게 전해졌습니다.","1740년 10월 휫필드는 조나단 에드워즈가 목회하던 노샘프턴에 들러 며칠 동안 설교했습니다. 휫필드는 에드워즈의 가정에 머물며 회중을 만났고, 설교 중 사람들이 크게 감동했다는 사실을 자신의 일기에 남겼습니다. 같은 시기 길버트 테넌트 등 다른 설교자들의 순회사역도 여러 교회에 영향을 미쳤습니다. 지역 교회의 기존 목회와 이동 설교자의 활동이 때로 협력했고, 때로는 교회의 질서와 회심을 판별하는 방식을 둘러싼 논쟁도 낳았습니다.","1740–1742년의 움직임은 오늘날 흔히 북미 제1차 대각성운동의 확산기로 불립니다. 그러나 단일한 집회나 한 지도자의 사역으로 이루어진 사건은 아니었습니다. 서로 다른 교회와 지역에서 나타난 변화가 설교, 출판, 여행을 통해 연결되었습니다. 일부 지역에서는 회심과 교회 성장의 보고가 이어졌으나, 다른 곳에서는 과열된 감정적 반응과 교회 분열, 설교자의 자격을 둘러싼 갈등도 나타났습니다. 에드워즈를 비롯한 당시 목회자들은 이 과정에서 진정한 회심과 일시적인 흥분을 어떻게 구별할 것인지 논의했습니다. 광범한 종교적 열정이 곧 참된 회심을 뜻하지는 않기에 신앙고백 이후의 삶과 교회 공동체의 열매도 살펴야 한다는 과제를 남겼습니다."]},{"id":"cambuslang","year":1742,"date":"1742년 2월","century":18,"title":"캠버슬랭 부흥","person":"윌리엄 맥컬록","place":"스코틀랜드 캠버슬랭","topic":"그리스도의 의","tags":["칭의","설교","성례"],"story":["18세기 스코틀랜드 글래스고 남동쪽의 캠버슬랭(Cambuslang)은 장로교회가 지역 주민의 신앙생활에 중심 역할을 하던 교구였습니다. 목사 윌리엄 맥컬록(William McCulloch)은 여러 해 동안 주민들에게 성경을 가르쳤고, 교회 안에서는 기도모임이 이어졌습니다. 그는 신앙적 관심이 생긴 사람들의 말을 직접 듣고 기록했으며, 당시 남긴 상담·관찰 원고 일부가 오늘날까지 전해집니다.","1742년 2월 18일 맥컬록은 예레미야 23장 6절을 본문으로 설교했습니다. 집회가 끝난 뒤 자신의 죄와 구원 문제로 마음이 무거운 사람들이 목회자의 도움을 구했고, 그날 밤 목사관에는 약 50명이 찾아왔다는 증언이 남아 있습니다. 이후 성경 설교와 상담, 기도모임이 잇따랐고, 다른 지역의 목회자들이 지원하러 왔습니다.","그해 여름에는 대규모 설교집회와 성찬 모임이 진행되었습니다. 7월 휫필드도 이 지역을 방문했고, 8월에는 인근 지역의 참석자와 여러 목회자가 함께하는 성찬 모임이 열렸습니다. 신앙적 각성을 경험했다고 말하는 사람들의 수에 대해서는 서로 다른 보고가 있지만, 사건의 중요한 특징은 목회자가 개별 참석자를 면담하고 그 뒤의 변화를 계속 살피려 했다는 점입니다. 당시 상담 기록과 후대 연구는 집회에서 있었던 강한 반응에 그치지 않고 그 후의 신앙생활과 목양을 어떻게 이어 갔는지 보여 줍니다."]},{"id":"kilsyth1742","year":1742,"date":"1742년 5월","century":18,"title":"킬싯 부흥 (1742)","person":"제임스 로브","place":"스코틀랜드 킬싯","topic":"성령의 새 창조","tags":["중생","성례","설교"],"story":["1742년 스코틀랜드 킬싯(Kilsyth)의 목사 제임스 로브(James Robe)는 마을 교회에서 죄와 중생, 그리스도의 구원에 관한 설교를 계속하고 있었습니다. 비슷한 시기 인근 캠버슬랭에서 신앙적 각성이 일어났다는 소식이 전해졌고, 킬싯에서도 말씀을 듣는 사람들의 반응과 상담 요청이 달라지기 시작했습니다.","1742년 5월 로브는 설교 후 양심의 괴로움과 구원 문제를 호소하는 사람들이 늘어났다고 적었습니다. 그는 그달 28일 자신이 파악한 사례를 정리하여 보고했고, 교구 안팎의 참석자들을 면담했습니다. 신앙 상담과 정규 예배가 이어지는 가운데 사람들의 관심은 기도와 성경 공부, 성찬을 중심으로 모였습니다.","6월에는 휫필드가 킬싯을 방문해 많은 군중에게 설교했습니다. 그해 가을에는 여러 목회자가 함께 성찬을 준비하고 말씀을 전하는 집회가 진행되었고, 이러한 움직임은 인근 교구로도 알려졌습니다. 로브는 사건을 문서로 남겨 다른 교회에 알렸습니다. 킬싯에서는 약 한 세기 뒤인 1839년에도 또 다른 부흥이 있었으므로 두 사건은 연도와 담당 목회자가 서로 다른 역사로 구분해야 합니다."]},{"id":"yale","year":1802,"date":"1802년","century":19,"title":"예일대학 부흥","person":"티모시 드와이트","place":"미국 코네티컷 예일대학","topic":"성경의 권위와 회심","tags":["청년","성경","회심"],"story":["18세기 말 예일대학에서는 계몽주의와 프랑스 혁명 이후 확산된 사상의 영향 아래 학생들의 신앙과 대학 예배를 둘러싼 논쟁이 많았습니다. 조나단 에드워즈의 외손자인 티모시 드와이트(Timothy Dwight)는 1795년 총장에 취임해 교육과 예배를 함께 지도했습니다. 그는 일부 학생들이 성경의 권위에 회의적이라는 사실을 알고, 채플에서 성경이 하나님의 말씀인가를 논증하는 설교를 여러 달에 걸쳐 전했습니다.","드와이트의 설교와 학생들의 토론, 신앙 모임은 수년 동안 계속되었습니다. 1802년 봄에는 졸업을 앞둔 두 학생이 공개적으로 그리스도인임을 고백한 뒤 다른 학생들에게도 신앙적 관심이 확산되었습니다. 당시 대학의 인원과 회심자에 관한 수치는 학교 기록과 후대 교회사에 남아 있으며, 박용규는 약 63명의 학생이 회심을 경험했다고 기술합니다.","1802년의 각성운동은 갑작스러운 한 번의 집회만으로 설명되지 않습니다. 몇 년에 걸친 성경 설교, 학생들의 지적 질문, 신앙고백과 상담이 함께 작용했습니다. 이후에도 예일에서는 시기마다 각성운동이 반복되었고, 일부 학생들은 목회와 선교의 길로 나아갔습니다. 당시 학생들의 일기와 대학의 문서들은 캠퍼스 안에서 이러한 변화가 어떻게 받아들여졌는지 살피는 데 도움을 줍니다."]},{"id":"dundee","year":1839,"date":"1839년 7–8월","century":19,"title":"킬싯·던디 부흥 (1839)","person":"윌리엄 찰머스 번즈·로버트 머리 맥체인","place":"스코틀랜드 킬싯·던디","topic":"말씀과 설교자의 도구성","tags":["장로교","목회","설교"],"story":["1830년대 스코틀랜드 던디의 성베드로교회는 젊은 목사 로버트 머리 맥체인(Robert Murray M’Cheyne)의 목회 아래 성장하고 있었습니다. 맥체인은 성경 설교, 성도들의 신앙 상담, 지역 주민에 대한 전도에 힘썼습니다. 1839년 그는 선교 상황을 조사하기 위한 팔레스타인 방문길에 올랐고, 그동안 젊은 설교자 윌리엄 찰머스 번즈(William Chalmers Burns)가 던디의 강단을 맡았습니다.","번즈는 1839년 7월 고향인 킬싯에 머물며 아버지의 교회 사역을 도왔습니다. 7월 23일 설교를 계기로 신앙적 각성이 일어났다는 소식이 퍼졌습니다. 8월 8일 번즈가 던디로 돌아왔을 때 사람들은 킬싯에서 있었던 일을 듣기 원했습니다. 그는 예배 뒤 관심 있는 이들에게 남으라고 했고, 약 100명이 자리를 지켰습니다. 그 모임에서도 기도와 죄의 자각, 신앙 상담이 시작되었다고 기록됩니다.","이후 수 주 동안 던디에서는 저녁집회와 개인 상담이 계속되었고, 다른 교회 목회자들도 참여했습니다. 맥체인이 11월 돌아왔을 때 그는 자신이 직접 이끌지 않은 기간에 교회와 지역에 나타난 변화를 목격했습니다. 번즈는 뒤에 다른 스코틀랜드 지역과 중국에서도 사역했습니다. 1742년 제임스 로브가 관련된 킬싯 부흥과 1839년 번즈가 관련된 킬싯 부흥은 반드시 구분해서 보아야 합니다."]},{"id":"fulton","year":1857,"date":"1857년 9월 23일","century":19,"title":"뉴욕 정오기도 부흥","person":"제레마이아 란피어","place":"미국 뉴욕 풀턴가","topic":"지속적인 기도","tags":["기도","평신도","회심"],"story":["1850년대 뉴욕은 금융업과 상업 활동이 빠르게 성장하던 도시였습니다. 북화란개혁교회에서 평신도 선교사역을 맡았던 제레마이아 란피어(Jeremiah Lanphier)는 분주한 상인과 직장인들이 일터 근처에서 잠시라도 기도할 시간을 마련하고자 했습니다. 그는 점심시간인 정오부터 한 시간 동안 기도회를 열겠다는 전단을 만들어 거리와 사무실에 배포했습니다. 시간이 부족한 사람은 5분이나 10분만 참여해도 된다고 안내했습니다.","1857년 9월 23일 수요일 정오, 란피어는 풀턴가의 교회 건물 3층 강의실 문을 열고 참석자를 기다렸습니다. 처음에는 혼자 기도하다가 모임이 끝나기 전 여섯 사람이 합류했습니다. 다음 주에는 약 20명, 세 번째 모임에는 30–40명, 네 번째 모임에는 약 100명이 모였다고 전해집니다. 참석자가 늘어나자 주간 기도회는 매일 기도하는 모임으로 바뀌었습니다.","뉴욕의 금융 불안과 경기 침체가 겹친 시기에 여러 계층의 사람들이 기도회에 참여했습니다. 정오기도회는 뉴욕의 다른 장소로 퍼져 나갔고, 곧 필라델피아와 보스턴을 비롯한 여러 도시에서도 유사한 모임이 생겨났습니다. 교회 지도자뿐 아니라 일상적인 직업을 가진 평신도들이 시간을 쪼개 참여했다는 점이 기록에 두드러집니다. 당시 발표된 광범위한 회심 통계는 추정치로 구별해서 읽어야 합니다. 이 운동은 기도의 중요성을 생생하게 보여 주지만, 작은 기도회 하나가 정해진 순서대로 대규모 부흥을 일으킨다는 공식으로 해석할 수는 없습니다. 경제적 위기와 기존 교회들의 사역이 함께 있었고, 기도에 대한 응답의 시기와 방식은 인간이 결정할 수 없기 때문입니다."]},{"id":"ulster","year":1859,"date":"1857년 시작 · 1859년 확산","century":19,"title":"얼스터 부흥","person":"제임스 맥퀼킨 외 세 청년","place":"아일랜드 얼스터","topic":"기도와 교회의 갱신","tags":["기도","교회","장로교"],"story":["1850년대 아일랜드 북부 얼스터에서는 산업화와 사회적 긴장 속에 교회들의 신앙생활을 새롭게 하려는 관심이 커지고 있었습니다. 제임스 맥퀼킨(James McQuilkin)은 콜빌 부인의 전도적 대화를 들은 뒤 자기 신앙을 진지하게 돌아보게 되었다고 기록됩니다. 1857년 9월 그는 존 월리스, 로버트 칼라일, 제러마이아 미닐리 등 세 청년과 함께 앤트림주 켈스의 작은 학교에서 정기 기도회를 시작했습니다.","처음 네 명으로 시작한 모임에는 점차 다른 사람들이 합류했습니다. 기도모임은 코너와 인근 마을로 확산되어 1858년 말에는 약 100개 모임이 있었다는 보고가 전해집니다. 미국의 정오기도회 소식도 아일랜드에 전달되었고, 장로교 지도자들이 현지를 방문하고 돌아와 그 경험을 전했습니다. 국내에서 이어진 기도와 해외 소식이 서로 영향을 주고받았습니다.","1859년 봄에는 아호힐과 밸리메나 등 여러 지역에서 대규모 집회와 죄의 고백, 회심의 경험이 보고되었습니다. 학교와 교회는 물론 야외에서도 기도모임이 이어졌고, 당시 목회자 윌리엄 깁슨은 그 경험을 『은혜의 해』(The Year of Grace)에 정리했습니다. 기록에는 강한 감정적 반응과 신체적 현상도 포함되지만, 그것이 모든 회심자에게 나타나야 하는 표지는 아닙니다. 여러 지역의 교회가 기도와 말씀 교육, 방문과 상담을 통해 참여한 역사적 흐름과 이후의 신앙생활을 함께 살펴야 합니다."]},{"id":"korea","year":1903,"date":"1903–1907년","century":20,"title":"원산–평양 대부흥","person":"메리 화이트·루이스 맥컬리·로버트 하디·길선주 등","place":"한국 원산 → 평양","topic":"기도·사경회·회개","tags":["한국","기도","회개"],"end":1907,"story":["19세기 말 조선의 개신교회는 선교사들의 성경 번역과 교육, 한국인 신자들의 전도를 통해 성장하고 있었습니다. 지역 교회에서는 여러 날 동안 성경을 배우는 사경회가 중요한 교육 방식으로 자리 잡았습니다. 1903년 원산에서는 메리 컬러 화이트와 루이스 호어드 맥컬리 등 여성 선교사들의 기도모임에 다른 선교사들이 합류했고, 기도에 관한 강의를 맡게 된 의료선교사 로버트 하디는 강의를 준비하면서 자신의 교만과 한국인을 향한 편견을 깊이 돌아보게 되었습니다.","1903년 8월 24–30일 원산 선교사 기도회에서 하디는 동료들 앞에 자신의 잘못을 고백했습니다. 이어 한국인 회중에게도 자신의 교만과 편견을 인정했습니다. 여러 한국인 신자와 선교사들의 회개가 보고되었고, 이 움직임은 지역 사경회와 기도모임을 통해 이어졌습니다. 1904–1906년 동안 교회들은 부흥을 위한 기도를 지속하고 성경을 함께 배우면서 다른 지역에서 일어난 신앙적 변화의 소식을 나누었습니다.","1907년 1월 평양 장대현교회에서는 평안남도 사경회가 열렸습니다. 13일 저녁의 냉랭한 분위기 뒤 선교사들과 신자들은 기도했고, 14–15일 모임에서 강한 회개의 움직임이 나타났습니다. 길선주 장로는 친구의 재산을 정리하는 과정에서 돈을 부당하게 취한 죄를 회중 앞에 고백했습니다. 이후 여러 사람이 죄를 고백하고 기도했다는 사실을 참석 선교사들이 서신과 보고서에 남겼습니다. 평양의 다른 교회와 학교에서도 비슷한 집회가 이어졌으며, 원산에서 시작된 기도와 회개의 움직임은 이처럼 수년에 걸친 한국교회의 부흥 이야기로 연결됩니다."]},{"id":"wales","year":1904,"date":"1904–1905년","century":20,"title":"웨일스 부흥","person":"이반 로버츠 및 지역 교회 성도들","place":"영국 웨일스","topic":"기도와 삶의 변화","tags":["청년","회개","기도"],"end":1905,"story":["1904년 웨일스는 탄광과 산업도시를 중심으로 큰 사회 변화를 겪고 있었습니다. 교회에서는 오래전부터 기도회와 성경 공부가 진행되었고, 일부 지역에서 신앙적 각성이 시작되었다는 소식이 오갔습니다. 젊은이 이반 로버츠(Evan Roberts)는 이러한 분위기 속에 기도와 회개를 강조하며 지역 교회 모임에 참여했습니다.","1904년 10월 31일 월요일 저녁 러퍼(Loughor)의 모리아 예배당에서 정규 기도회가 끝나자 로버츠는 남아 있던 청년들을 대상으로 모임을 이어 갔습니다. 후대 기록은 당시 어린이 한 명을 포함한 17명이 남았다고 전합니다. 그는 그리스도에 대한 믿음과 기도, 자신의 신앙을 드러내는 고백을 권면했습니다. 이후 노래와 기도가 이어지는 집회 소식은 주변 교회로 빠르게 퍼졌습니다.","1904년 말부터 1905년에 이르기까지 웨일스 여러 지역 교회에서 집회가 이어졌고, 회심과 삶의 변화에 관한 증언이 교회 간행물과 신문을 통해 확산되었습니다. 이 운동은 다른 나라의 교회에도 알려져 기도운동과 영적 각성에 대한 관심을 높였습니다. 그러나 개별 인물이나 극적인 집회 장면만으로 전체 부흥을 설명하기는 어렵습니다. 이안 머리는 당시의 실제 회심과 교회 갱신을 인정하면서도, 이반 로버츠의 역할을 지나치게 부각하거나 개인의 충동에 집회 진행을 맡겨 말씀 설교와 질서 있는 목회적 지도력이 약해진 현상을 비판했습니다. 그에게는 부흥의 열매와 부흥 과정의 무분별한 행동을 구별하는 일이 중요했습니다."]},{"id":"mukti","year":1905,"date":"1905–1906년","century":20,"title":"인도 묵티 부흥","person":"판디타 라마바이","place":"인도 케드가온 묵티 공동체","topic":"성경교육과 전도","tags":["성경","기도","선교"],"end":1906,"story":["19세기 말 인도에서는 여성과 어린이, 어린 나이에 과부가 된 이들의 교육과 생계를 돕는 일이 중요한 사회적 과제였습니다. 판디타 라마바이(Pandita Ramabai)는 마하라슈트라주 케드가온(Kedgaon)에 묵티(Mukti) 공동체를 세워 소녀와 여성들에게 숙식, 교육, 직업훈련과 성경 교육을 제공했습니다. 대규모 기근을 겪은 뒤 보호가 필요한 여성들이 모였고, 공동체의 규모도 커졌습니다.","라마바이는 해외 부흥 소식을 접한 뒤 공동체 안에 정기 기도모임을 장려했습니다. 1905년에는 여성들과 소녀들이 공동체를 위해 기도하고, 주변 마을에 성경의 내용을 전하는 활동에 참여했습니다. 6월 30일 라마바이가 요한복음 8장을 가르치던 자리에서 여러 사람이 자신의 죄를 고백하고 오랜 시간 기도했다는 보고가 남아 있습니다. 관련 문헌에는 당시의 특별한 체험에 관한 다양한 증언도 있으나, 그 성격과 해석은 자료마다 차이가 있습니다.","이후 공동체 안에서는 기도와 신앙 상담이 이어졌고, 일부 여성들은 다른 지역으로 나가 전도와 봉사에 참여했습니다. 묵티의 이야기는 하나의 집회뿐 아니라 여성 교육, 보호 시설 운영, 성경교육과 지역사회 봉사가 함께 있었던 역사로 이해할 필요가 있습니다. 당시 기록은 대부분 참여자와 후원단체의 증언이므로 집회의 규모와 특별한 현상에 대한 숫자·평가는 그 기록의 성격을 감안해 읽어야 합니다. 특히 일부 증언에 등장하는 방언과 환상은 확인 가능한 교육·구호·전도 사역의 역사와 구별해야 하며, 그런 경험을 참된 신앙의 필수 조건으로 일반화할 근거는 없습니다."]},{"id":"asbury","year":1970,"date":"1970년 2월 3일","century":20,"title":"애즈베리 대학 부흥","person":"커스터 레이놀즈와 학생들","place":"미국 켄터키 애즈베리대학","topic":"회개와 간증","tags":["청년","회개","공동체"],"story":["미국 켄터키주 윌모어의 애즈베리대학은 20세기 동안 여러 차례 학생들의 기도와 신앙 갱신 운동을 경험한 학교였습니다. 1970년 2월 3일 화요일 오전 10시 정규 채플에서는 예정된 설교 대신 신앙에 관한 증언을 나누는 시간이 마련되었습니다. 당시 학교 책임자가 출장 중이어서 학감 커스터 레이놀즈(Custer Reynolds)가 예배를 인도했습니다.","레이놀즈는 학생들에게 자신의 신앙 경험을 이야기할 기회를 주었습니다. 처음 한 학생이 앞에 나왔고, 이어 다른 학생들도 죄를 인정하거나 기도 제목과 삶의 변화를 이야기했습니다. 채플이 정해진 시간에 끝나지 않자 학생들과 교수 일부가 계속 남아 찬송하고 기도했습니다. 학교는 정규 수업을 한동안 중단했고, 강당에는 학생들의 증언과 기도모임이 밤낮으로 이어졌습니다.","애즈베리대학의 공식 역사 기록은 그해 연속적으로 이어진 집회를 144시간으로 정리합니다. 모임이 이어지는 동안 참석자와 졸업생들은 다른 교회와 대학에 그 소식을 전했고, 학생들로 구성된 방문 팀이 여러 학교를 찾았습니다. 당시 참가자들의 회고에는 죄 고백, 용서, 화해와 진로에 대한 새 결심이 반복해서 등장합니다. 집회 시간에 관해서는 기록 간 차이가 있으므로 구체적인 숫자보다 전개 과정과 현장 증언을 중심으로 살펴볼 수 있습니다. 며칠 동안 예배가 이어졌다는 사실 자체보다, 그 경험이 이후의 회개와 화해, 신앙생활에 어떤 지속적인 영향을 남겼는지가 부흥을 평가할 때 더 중요합니다."]},{"id":"wheaton","year":1995,"date":"1995년 3월 19일","century":20,"title":"휘튼대학 부흥","person":"브랜디 맥과이어·제임스 한 및 학생들","place":"미국 일리노이 휘튼대학","topic":"회개와 화해","tags":["청년","화해","회개"],"story":["1995년 초 미국 텍사스의 하워드 페인 대학과 주변 교회에서는 학생들의 기도와 회개 모임이 이어졌습니다. 그 소식은 여러 대학에 알려졌고, 일리노이주 휘튼대학의 학생들도 관심을 갖게 되었습니다. 3월 19일 주일 저녁 휘튼대학 피어스 채플에서 열린 세계기독학생교제(World Christian Fellowship) 모임에는 하워드 페인 대학 학생 브랜디 맥과이어(Brandi Maguire)와 제임스 한(James Hahn)이 초청되었습니다.","두 학생은 자신들의 학교에서 경험한 일을 전했습니다. 간증이 끝나고 잠시 조용한 시간이 흐른 뒤 휘튼대학의 한 졸업반 학생이 앞에 나와 자신의 교만을 고백하고 동료들에게 용서를 구했습니다. 이어 다른 학생들도 오랫동안 숨겨 왔던 잘못을 이야기하며 기도를 요청했습니다. 친구들이 그 곁에 모여 기도하고 위로하는 장면이 반복되었고, 모임은 밤늦게까지 계속되었습니다.","휘튼대학에서는 3월 19일부터 며칠 동안 저녁 모임이 이어졌으며, 집회 장소를 옮겨 더 많은 인원을 수용하기도 했습니다. 학교 관계자들은 당시 학생들의 자발적인 참여와 공개적인 화해의 시도를 기록했습니다. 참가자들의 증언과 대학 문서, 이후 진행된 구술사 인터뷰가 남아 있어 1995년 사건은 현장의 변화와 그에 대한 다양한 평가를 함께 살필 수 있습니다. 공개적인 죄 고백이 화해의 계기가 될 수는 있지만, 모든 사적인 죄를 회중 앞에 말해야 한다는 뜻은 아닙니다. 죄의 성격과 피해 관계를 살피고 당사자의 존엄과 사생활을 보호하는 목회적 분별 또한 필요합니다."]}];
const stage=document.getElementById('timelineStage');
const viewport=document.getElementById('timelineViewport');
const detail=document.getElementById('detail');
const AXIS_Y=75,CARD_W=144,CARD_H=58;
let selectedId=EVENTS[0].id;
const search=document.getElementById('search');
const allNodes=[];
const positions=[];
let x=92;
for(let i=0;i<EVENTS.length;i++){
  if(i>0){const gap=EVENTS[i].year-EVENTS[i-1].year;
    // Event-dense periods receive space; vacant historical periods are compressed.
    x+=Math.max(65,Math.min(145,53+17*Math.log2(gap+1)));
  }
  positions.push(x);
}
const W=Math.ceil(positions[positions.length-1]+98);
stage.style.width=W+'px';
// One compact upper lane and two staggered lower lanes.
// Avoid overlap using each card's actual left/right edge, including wide single-line cards.
const lanes=[{top:4,side:-1},{top:112,side:1},{top:178,side:1}];
let usedRight=lanes.map(()=>-10000);
const ticks=[1650,1700,1750,1800,1850,1900,1950];
const atYear=(y)=>{
  if(y<=EVENTS[0].year)return positions[0];
  if(y>=EVENTS[EVENTS.length-1].year)return positions[positions.length-1];
  for(let i=0;i<EVENTS.length-1;i++)if(EVENTS[i].year<=y&&y<=EVENTS[i+1].year){
    const a=EVENTS[i].year,b=EVENTS[i+1].year;
    return positions[i]+(positions[i+1]-positions[i])*((y-a)/(b-a||1));
  }
  return positions[0];
};
ticks.forEach(t=>{const el=document.createElement('div');el.className='tick';el.style.left=atYear(t)+'px';el.innerHTML='<span>'+t+'</span>';stage.appendChild(el)});
EVENTS.forEach((e,i)=>{
  const isInline=e.id==='kilsyth1742'||e.id==='mukti';
  const cardW=e.id==='mukti'?204:(e.id==='kilsyth1742'?158:CARD_W);
  const cardH=isInline?40:CARD_H;
  const left=positions[i]-cardW/2;
  const preference=isInline?[1,2,0]:(i%2===0?[0,2,1]:[2,0,1]);
  const choice=preference.find(n=>left-usedRight[n]>=8)??preference.reduce((best,n)=>usedRight[n]<usedRight[best]?n:best,preference[0]);
  const lane=lanes[choice];usedRight[choice]=left+cardW;
  const cardTop=lane.top+(isInline?(CARD_H-cardH)/2:0);
  const stem=document.createElement('span');stem.className='stem';stem.setAttribute('aria-hidden','true');stem.style.left=(positions[i]-.75)+'px';stem.style.top=(lane.side<0?cardTop+cardH:AXIS_Y)+'px';stem.style.height=(lane.side<0?AXIS_Y-(cardTop+cardH):cardTop-AXIS_Y)+'px';stage.appendChild(stem);
  const dot=document.createElement('span');dot.className='dot';dot.style.left=positions[i]+'px';dot.setAttribute('aria-hidden','true');stage.appendChild(dot);
  const node=document.createElement('button');node.type='button';node.className='event-node'+(isInline?' event-node-inline':'');node.style.width=cardW+'px';node.style.height=cardH+'px';node.style.left=left+'px';node.style.top=cardTop+'px';node.dataset.id=e.id;node.dataset.century=e.century;
  node.setAttribute('aria-label',e.date+' '+e.title+' 상세 보기');node.setAttribute('aria-pressed','false');
  const year=document.createElement('span');year.className='date';year.textContent=e.date;
  const name=document.createElement('span');name.className='name';name.textContent=e.title;
  node.title=e.topic;
  node.append(year,name);
  node.addEventListener('click',()=>selectEvent(e.id,true));stage.appendChild(node);
  allNodes.push({e,node,dot,stem});
});
function updateStatus(){
 const available=allNodes.filter(x=>!x.node.classList.contains('muted')).length;
 document.getElementById('trackStatus').textContent=available+'개 사건';
 document.getElementById('scrollProgress').style.width=(100*viewport.scrollLeft/(viewport.scrollWidth-viewport.clientWidth||1))+'%';
}
function selectEvent(id,bringDetail){
 const index=EVENTS.findIndex(e=>e.id===id); if(index<0)return;
 selectedId=id;const e=EVENTS[index];
 allNodes.forEach(a=>{const b=a.e.id===id;a.node.classList.toggle('active',b);a.node.setAttribute('aria-pressed',String(b));a.dot.classList.toggle('active',b)});
 document.getElementById('detailCount').textContent=(index+1)+' / '+EVENTS.length;
 document.getElementById('detailTitle').textContent=e.date+' · '+e.title;
 const body=document.getElementById('story');
 body.replaceChildren();
 for(const paragraph of e.story){const p=document.createElement('p');p.textContent=paragraph;body.appendChild(p);}
 if(e.id==='wales'){
   const a=document.createElement('a');
   a.className='story-crosslink';
   a.href='./iain-murray-full-summary.html#chapter-6-section-4-u1';
   a.target='_blank';a.rel='noopener noreferrer';
   a.textContent='이안 머리 『성경적 부흥관 바로 세우기』 — 6.4 웨일즈 부흥 비평 읽기 ↗';
   a.setAttribute('aria-label','이안 머리의 웨일즈 부흥 비평 항목 새 창에서 열기');
   body.appendChild(a);
 }
 document.getElementById('prevBtn').disabled=index===0;
 document.getElementById('nextBtn').disabled=index===EVENTS.length-1;
 const target=positions[index]-viewport.clientWidth/2;
 viewport.scrollTo({left:Math.max(0,target),behavior:'instant'});
 if(bringDetail){
  if(document.documentElement.classList.contains('atlas-home-embedded')){
    window.parent.postMessage({type:'revival-atlas:focus',offset:detail.getBoundingClientRect().top+window.scrollY},window.location.origin);
  }else detail.scrollIntoView({behavior:'smooth',block:'start'});
 }
 updateStatus();
}
document.getElementById('prevBtn').addEventListener('click',()=>{let i=EVENTS.findIndex(e=>e.id===selectedId);if(i>0)selectEvent(EVENTS[i-1].id,false)});
document.getElementById('nextBtn').addEventListener('click',()=>{let i=EVENTS.findIndex(e=>e.id===selectedId);if(i<EVENTS.length-1)selectEvent(EVENTS[i+1].id,false)});
viewport.addEventListener('scroll',updateStatus,{passive:true});
viewport.addEventListener('keydown',e=>{const index=EVENTS.findIndex(v=>v.id===selectedId);if(e.key==='ArrowRight'&&index<EVENTS.length-1){e.preventDefault();selectEvent(EVENTS[index+1].id,false)}if(e.key==='ArrowLeft'&&index>0){e.preventDefault();selectEvent(EVENTS[index-1].id,false)}});
document.querySelectorAll('.tab[data-century]').forEach(tab=>tab.addEventListener('click',()=>{
 const value=tab.dataset.century;
 document.querySelectorAll('.tab[data-century]').forEach(n=>{let a=n===tab;n.classList.toggle('active',a);n.setAttribute('aria-pressed',String(a))});
 search.value='';allNodes.forEach(a=>{a.node.classList.remove('muted');a.dot.classList.remove('muted')});
 const match=EVENTS.find(e=>value==='all'||String(e.century)===value);
 if(match)selectEvent(match.id,false);
 updateStatus();
}));
search.addEventListener('input',()=>{
 const q=search.value.trim().toLocaleLowerCase();let first=null;
 allNodes.forEach(a=>{const s=[a.e.title,a.e.person,a.e.place,a.e.topic,a.e.date,...a.e.tags].join(' ').toLocaleLowerCase();const valid=!q||s.includes(q);a.node.classList.toggle('muted',!valid);a.dot.classList.toggle('muted',!valid);if(valid&&!first)first=a.e});
 if(q&&first)selectEvent(first.id,false);
 updateStatus();
});
selectEvent(EVENTS[0].id,false);
</script>
<script>
/* Parent homepage adjusts the expanded frame height; no nested vertical scrollbars. */
(function(){
 if(!document.documentElement.classList.contains('atlas-home-embedded'))return;
 let previousHeight=0;
 const report=function(){
   const main=document.querySelector('main');
   if(!main)return;
   // The iframe viewport may be taller than its content. Measuring body.scrollHeight
   // would include that viewport and prevent the frame from shrinking afterward.
   const h=Math.ceil(main.getBoundingClientRect().bottom + window.scrollY + 2);
   if(Math.abs(h-previousHeight)>1){
     previousHeight=h;
     window.parent.postMessage({type:'revival-atlas:height',height:h},window.location.origin);
   }
 };
 if('ResizeObserver' in window)new ResizeObserver(report).observe(document.querySelector('main'));
 window.addEventListener('load',report);
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(report);
 report();
})();
</script>
