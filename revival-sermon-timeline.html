<script type="application/json" id="revivalSynopsisData">{"stewarton":["데이비드 딕슨 목사는 예배와 교회 통치 문제로 추방되었다가 어바인 강단에 돌아온 뒤, 장이 서는 월요일에 이웃 마을 주민들에게 성경을 설교했습니다. 스튜어턴의 윌리엄 캐슬로 목사는 교인들이 그 말씀을 들으러 가도록 권했고, 설교는 가정과 교구의 신앙 상담으로 이어졌습니다.","이 각성의 중심에는 극적인 신체 현상보다 죄와 구원에 대한 질문, 그리스도의 은혜에 관한 설교, 지속적인 목회적 분별이 있었습니다. 스코틀랜드 초기 장로교 부흥의 성격을 보여 주는 사례입니다."],"raritan":["네덜란드 개혁교회 목사 테오도루스 야코부스 프릴링하이젠은 세례와 교회 출석만으로 참된 신앙을 판단해서는 안 된다고 설교했습니다. 그는 중생과 그리스도의 은혜를 강조하며 교리문답과 평신도 신앙 모임을 장려했고, 이 과정에서 성찬 참여와 교회 권징을 둘러싼 갈등도 발생했습니다.","그의 사역은 북미 대각성에 앞서 개혁교회 안에서 일어난 각성의 중요한 사례입니다. 회심의 열매와 교회 질서를 함께 살펴야 하며, 목회자의 노예 소유라는 역사적 모순도 외면할 수 없습니다."],"northampton":["조나단 에드워즈는 교회생활에 익숙한 주민들에게도 중생과 믿음으로 말미암는 칭의가 필요하다고 설교했습니다. 청년들의 생활 변화와 죽음을 계기로 깊어진 신앙적 질문은 가정의 기도와 개인 상담, 회심에 관한 증언으로 퍼져 나갔습니다.","에드워즈는 이 사건을 기록하여 널리 알렸지만, 종교적 감정과 진정한 회심을 동일시하지 않았습니다. 부흥의 열매와 함께 목회 과정의 비극, 당시 사회의 노예제 문제까지 살펴볼 필요가 있습니다."],"welsh1735":["하웰 해리스는 자신의 신앙과 성찬 참여를 돌아보는 과정에서 그리스도의 은혜를 새롭게 붙들고 가정과 마을에서 성경을 읽고 권면하기 시작했습니다. 대니얼 롤런드의 복음 설교와 여러 지역의 신앙 모임이 연결되면서 평신도 참여와 순회 사역이 확대되었습니다.","이 운동은 웨일스 칼빈주의 감리교의 토대를 형성했지만 지도자들의 갈등과 분열도 겪었습니다. 은혜의 복음이 공동체적 양육과 교회 질서 안에서 어떻게 이어지는지를 함께 보여 줍니다."],"awakening":["조지 휘필드는 식민지 여러 도시를 순회하며 교회에 속해 있다는 사실과 참된 중생을 구별하고, 그리스도의 의와 하나님의 은혜를 설교했습니다. 야외 설교와 지역 교회의 협력, 벤저민 프랭클린 등이 인쇄한 설교와 신문 보도가 서로 다른 식민지의 신앙적 관심을 연결했습니다.","그의 사역은 제1차 대각성의 확산에 크게 기여했지만, 많은 청중이나 격렬한 반응을 모두 회심으로 계산할 수는 없습니다. 그의 노예제 관련 행적도 역사적 평가에서 중요한 문제로 남습니다."],"cambuslang":["캠버슬랭에서 평일 설교를 요청한 주민들과 목사 윌리엄 맥컬록의 말씀 사역은 기도와 신앙 상담으로 이어졌습니다. 인근 킬싯의 제임스 로브를 비롯한 목회자들이 참여하면서 설교와 성찬집회, 개인적인 회심의 질문이 여러 교구로 확산되었습니다.","당시 목회자들이 남긴 상담 기록은 사람들의 죄책감과 구원의 소망을 구체적으로 보여 줍니다. 집회 인원이나 감정적 반응보다 지속적인 믿음과 삶의 열매를 분별하려는 태도가 핵심입니다."],"brainerd1745":["데이비드 브레이너드는 흩어져 살던 원주민 공동체에서 통역을 통해 복음을 전했고, 원주민 여성과 가족들이 서로를 초청하면서 말씀을 듣는 모임이 커졌습니다. 레나페 출신 통역자 모세스 틴다 타타미 등 현지인들의 역할과 교리교육은 단순한 외부 선교사의 활동을 넘어 공동체 예배로 이어졌습니다.","브레이너드의 일지는 회심과 삶의 변화를 자세히 남겼고, 조나단 에드워즈가 이를 출판하여 후대 선교에 영향을 주었습니다. 동시에 이 기록이 선교사의 관점에서 쓰였다는 점과 식민지 상황을 함께 고려해야 합니다."],"moulin1798":["알렉산더 스튜어트 목사는 자신이 오랫동안 도덕적 권면에 머물렀음을 돌아보고, 중생과 그리스도를 통한 칭의를 더 분명히 설교하기 시작했습니다. 교인들의 신앙 상담과 가정 기도모임, 성찬에 대한 점검은 교구의 신앙생활을 변화시키는 중요한 통로가 되었습니다.","스튜어트는 처음의 변화뿐 아니라 후속 목회 보고를 남겨 운동이 어떻게 이어졌는지 살필 수 있게 했습니다. 외적인 예배 참여와 실제 믿음을 구별하되, 회심자의 수는 목회자의 추산이라는 점을 기억해야 합니다."],"cane1801":["바턴 W. 스톤이 목회하던 장로교회의 성찬 준비집회는 여러 지역의 사람들이 모이는 야외 설교와 기도의 자리로 확대되었습니다. 죄의 고백과 찬송뿐 아니라 쓰러짐 등 격렬한 신체 반응도 나타났고, 이러한 집회 방식은 미국 서부의 캠프미팅 확산에 영향을 주었습니다.","그러나 신체 현상만으로 중생을 판단할 수는 없습니다. 스톤의 신학적 변화와 이후 교단 재편 역시 당시의 회심 증언과 구분해 살펴야 하는 중요한 문제입니다."],"yale":["티머시 드와이트가 이끌던 예일 칼리지에서는 학생들의 기도와 성경 설교, 개인 상담이 이어지면서 교회 가입과 신앙고백이 늘어났습니다. 교내에 나타난 변화는 일부 학생들이 훗날 목회와 선교에 헌신하는 계기가 되었습니다.","대학의 공식 기록은 이 각성의 역사적 윤곽을 보여 주지만, 교회 명부에 이름을 올렸다는 사실만으로 각 사람의 중생을 확정할 수는 없습니다. 당시 대학과 사회가 얽혀 있던 노예제의 역사 또한 평가 대상입니다."],"dundee":["윌리엄 찰머스 번스의 복음 설교와 기도모임은 킬싯에서 시작해 던디로 이어졌습니다. 야외와 교회 안에서 사람들이 죄와 구원을 묻고 상담을 구했으며, 로버트 머리 맥체인의 목회적 돌봄과 후속 점검도 중요한 역할을 했습니다.","이 각성은 노동자와 가정의 신앙생활에 영향을 미쳤습니다. 다만 상담을 받은 사람의 수와 실제 회심을 구별하고, 일시적인 열심보다 지속적인 삶의 변화를 살펴야 합니다."],"spurgeon1855":["젊은 찰스 스펄전의 설교를 듣기 위해 런던의 회중이 늘어나면서 예배 장소는 더 넓은 곳으로 옮겨 갔습니다. 스펄전은 하나님의 주권적 은혜와 그리스도 안의 구원을 설교했고, 기도와 개인 상담, 신자 침례와 목회자 양성을 통해 교회의 사역을 확장했습니다.","그의 설교 출판과 전도·교육 사업은 런던을 넘어 영향을 미쳤습니다. 그러나 예배 참석자와 침례자, 교인 증가를 모두 같은 의미의 회심 통계로 취급해서는 안 됩니다."],"fulton":["제러마이아 랜피어가 직장인들에게 제안한 정오 기도모임은 소수의 평신도가 함께 기도하는 자리에서 출발했습니다. 기도 요청을 나누는 모임은 주간 모임에서 평일 매일 모임으로 확대되었고, 다른 도시의 교회와 신자들에게도 전해졌습니다.","이 운동은 특별한 유명 설교자보다 일상에서 기도한 평신도들의 참여가 두드러집니다. 기도와 말씀 사역의 연결을 중시하면서도, 기도회 참석 인원과 실제 회심자를 구분해야 합니다."],"ulster":["코너 지역 청년들의 기도모임에서 시작된 신앙적 관심은 장로교회와 주변 교단의 집회, 개인 상담, 죄의 고백으로 확산되었습니다. 일부 집회에서는 강한 신체 반응이 논쟁을 일으켰지만, 목회자들은 말씀과 회개, 이후의 신앙생활을 통해 그 의미를 판단하려 했습니다.","이 사건은 지역 교회의 갱신에 영향을 주었으며 얼스터 개신교의 집단적 정체성과도 연결되었습니다. 회심의 열매와 함께 당시 사회의 종교적 경계도 비판적으로 살펴야 합니다."],"southafrica1860":["앤드류 머리가 목회하던 교회와 청년 기도모임을 중심으로 기도와 죄의 고백이 확대되었고, 여러 지역에서 예배와 교육, 전도 활동이 활발해졌습니다. 네덜란드 개혁교회의 신앙 전통과 복음주의 기도운동이 이 사건의 중요한 배경이었습니다.","교회와 선교교육에 남긴 영향은 주목할 만하지만, 그리스도인의 신앙고백과 당시 사회에 존재하던 인종 분리의 모순을 따로 떼어 평가할 수는 없습니다."],"madagascar1895":["말라가시 지도자 라이니소알람보의 신앙 변화와 공동체 결성을 계기로 성경 읽기, 문해교육, 농업과 생활 개선, 지역 전도가 함께 이루어졌습니다. 현지인들이 이끈 피포하자나 운동은 개신교 선교의 영향을 받으면서도 독자적인 공동체 갱신의 모습을 발전시켰습니다.","회개가 일상생활의 변화로 이어졌다는 점은 중요합니다. 다만 당시 전해진 치유와 축귀의 증언은 복음의 열매에 관한 역사적 평가와 구별해 검토해야 합니다."],"korea":["로버트 하디 선교사는 원산의 선교사 기도·사경회에서 자신의 교만과 믿음의 부족을 고백했습니다. 말씀과 기도의 모임은 한국인 교회로도 이어졌고, 평양에서는 길선주를 비롯한 신자들의 공개적인 회개와 관계 회복, 성경공부가 중요한 장면으로 남았습니다.","이 운동은 한국 교회의 사경회·전도·교육과 공동체 성장에 영향을 주었습니다. 그러나 집회의 감정적 분위기보다 실제 회개와 배상, 이후 신앙의 지속성을 살피고 당시의 정치·사회적 조건도 함께 고려해야 합니다."],"wales":["지역 청년들의 기도와 조지프 젠킨스의 목회, 이반 로버츠의 참여가 연결되면서 찬송과 공동기도, 죄의 고백이 여러 교회로 퍼져 나갔습니다. 여성 동역자들과 지역 신자들도 모임을 이끌고 복음을 전하는 데 중요한 역할을 했습니다.","이 각성은 국제적으로 널리 알려졌지만, 당대 언론이 전한 수치나 집단적 감정을 곧바로 검증된 회심으로 해석해서는 안 됩니다. 그리스도 중심의 회개와 성경적 질서, 지속적인 삶의 변화가 판단의 기준입니다."],"mukti":["판디타 라마바이가 세운 여성 교육·보호 공동체에서 소녀들과 여성들이 함께 기도하고 죄를 고백하면서 모임이 확대되었습니다. 미니 에이브럼스 등 동역자들의 기록에도 집회와 여성들의 마을 전도가 남아 있지만, 실제 사역의 주체는 인도인 학생과 지도자들이었습니다.","이 사건은 여성들의 신앙과 교육·전도 참여를 드러냅니다. 특별한 성령 체험의 해석은 검토하되, 회심 이후의 삶과 인도인 신자들의 예배 자율성을 함께 살펴야 합니다."],"khasi1905":["카시 지역에서는 어린이와 현지 신자들이 주도한 기도와 전도가 교회와 마을로 퍼졌습니다. 웨일스 장로교 선교의 영향을 받은 교회들이 이미 형성되어 있었으며, 라이 바주르 같은 카시 전도자들의 참여와 미조 지역으로의 소식 전달이 각성을 더 넓은 지역에 연결했습니다.","현지인들의 신앙과 찬송·전도 활동이 활발해졌다는 점이 중요합니다. 꿈이나 떨림 등으로 기록된 체험은 말씀의 내용과 공동체의 지속적인 열매에 비추어 구별해야 합니다."],"azusa1906":["흑인 설교자 윌리엄 J. 시모어를 중심으로 서로 다른 인종의 사람들이 함께 예배하고 기도하는 모임이 이어졌습니다. 방언과 치유에 관한 증언, 성령세례에 관한 새로운 주장, 참가자들의 선교 활동은 초기 오순절운동의 형성에 깊은 영향을 미쳤습니다.","인종의 장벽을 넘으려 했던 공동예배의 의미는 중요하지만, 방언을 성령세례의 필수 증거로 보는 주장이나 외국어 방언 선교에 관한 증언은 성경적·역사적으로 별도 검토해야 합니다."],"manchuria1908":["한국 교회의 회개와 기도 소식이 중국인 장로교회에 전해진 뒤, 조너선 고포스의 특별집회와 현지 목회자·전도자들의 사역이 이어졌습니다. 신자들은 죄를 고백하고 이웃과 화해하려 했으며, 이러한 변화는 교회의 신앙교육과 평신도 활동으로 연결되었습니다.","회개와 실제 배상의 의미를 살피되, 공개적인 죄 고백이 압박이나 강요로 이루어지지는 않았는지 검토해야 합니다. 당시 만주 교회의 중국인 지도자들과 기존 공동체의 역할도 중요합니다."],"chile1909":["감리교 선교사 윌리스 콜린스 후버가 목회하던 교회와 칠레인 평신도들의 기도운동에서 새로운 각성이 나타났습니다. 여성 신자들의 참여와 회개 증언, 인도 묵티 공동체 소식의 영향이 이어지는 가운데 기존 감리교회와의 권징 갈등과 분립도 발생했습니다.","그 결과 칠레의 오순절교회가 형성되고 현지 지도자들의 활동이 확대되었습니다. 영적 경험의 진정성을 평가할 때에는 신앙고백과 공동체의 열매뿐 아니라 교회 질서와 신체 현상의 문제도 살펴야 합니다."],"shandong1930":["산둥의 침례교회들을 중심으로 죄와 회개를 강조하는 설교와 공개적인 신앙고백, 성경 집회가 확산되었습니다. 황현의 집회에 참여한 선교사 I. V. 라슨 등의 기록에는 기도와 회개의 장면이 남아 있으며, 중국인 신자들의 전도 참여도 두드러졌습니다.","한편 방언·치유·환상에 관한 증언과 교리 논쟁도 함께 나타났습니다. 그런 보고가 있었다는 역사적 사실과 그 체험의 신학적 해석을 구별하고, 말씀과 생활의 변화를 중심으로 평가해야 합니다."],"eastafrica1930":["시메오니 은시밤비와 의료 선교사 조 처치의 만남은 동아프리카 신앙 갱신의 중요한 출발점으로 기억됩니다. 이후 아프리카인 교사와 의료 직원, 평신도들이 죄의 고백과 배상, 성경공부와 순회 전도를 이끌면서 발로콜레 공동체가 여러 지역으로 퍼졌습니다.","그리스도의 십자가를 의지하는 믿음과 정직한 삶, 화해를 강조한 운동이지만, 공개 고백의 강압이나 공동체의 파벌화 가능성도 비판적으로 살펴야 합니다."],"lewis1949":["지역 신자들의 기도와 덩컨 캠벨의 복음 설교가 이어지면서 루이스섬 여러 마을에서 개인의 회심과 가정 기도모임에 관한 증언이 나타났습니다. 메리 모리슨을 비롯한 참가자들의 기록은 오래 알고 있던 성경 말씀을 새롭게 이해하고 그리스도를 믿게 된 과정을 보여 줍니다.","이 운동은 장로교적 교회생활의 갱신과 연결되었지만, 캠벨 개인의 성령 체험 해석을 지역 교회 전체의 신학과 동일시해서는 안 됩니다. 설교와 신앙의 열매를 중심으로 살펴야 합니다."],"asbury":["커스터 B. 레이놀즈가 맡은 정기 채플에서 학생들의 간증과 기도가 예정된 시간을 넘어 이어졌고, 교직원과 교수들은 찬송과 상담, 공개적인 잘못의 고백과 화해를 돕는 역할을 했습니다. 이 경험을 나누려는 학생들이 다른 대학을 방문하면서 캠퍼스 사역에도 영향을 주었습니다.","웨슬리안 성결운동의 신앙적 배경을 지닌 이 사례는 용서와 실제 관계 회복, 이후 신앙생활의 지속성을 통해 평가해야 합니다. 집회가 지속된 시간이나 참가 인원과 확인된 회심을 혼동해서는 안 됩니다."],"wheaton":["학생들의 기도가 이어지던 가운데 텍사스 하워드페인대학에서 온 학생들이 자신의 학교에서 있었던 회개와 기도에 대해 증언했습니다. 맷 야링턴을 비롯한 휘튼대학 학생들도 교만과 잘못을 고백하고 서로 용서를 구했으며, 교수와 교직원들은 상담과 후속 면담을 통해 이들을 돌봤습니다.","초교파 복음주의 대학에서 일어난 이 사건은 공개적 고백의 자발성과 실제 배상, 회복된 관계와 장기적인 삶의 변화를 중심으로 판단해야 합니다. 대학 기록과 참가자들의 구술 증언이 그 과정을 살피는 주요 자료입니다."]}</script>

<section class="hero"><div class="kicker">REVIVAL HISTORY / 1625–2023</div><h1>역사속의 부흥 사례 살펴 보기</h1><p>세계 여러 지역에서 일어난 부흥운동과 역사적 종교 각성을 실제 연대 간격으로 배치했습니다. 카드를 선택하면 같은 화면 아래에서 본문과 학술주석을 읽을 수 있습니다.</p><p class="selection"><strong>30편</strong> · 역사 사건 28편 · 특별 연구 2편</p></section>
<section class="panel" aria-label="부흥 역사 연대표"><div class="timeline-overlay-host"><div class="timeline-scroll-hint" id="timelineScrollHint" role="status" aria-live="polite">스크롤하거나 클릭해주세요</div><div class="timeline-viewport" id="timelineViewport" tabindex="0" aria-label="수평 스크롤 가능한 부흥 사건 연대표"><div class="timeline-stage" id="timelineStage"><div class="axis" aria-hidden="true"></div></div></div></div>
</section>
<section class="panel detail" id="detail" aria-label="선택한 부흥 사건의 상세 내용" hidden><div class="detail-head"><div><div class="label">SELECTED EVENT <span id="detailCount"></span></div><div class="detail-title-row"><h2 id="detailTitle" tabindex="-1"></h2><button type="button" id="eventCopyButton" class="event-copy-button">링크 복사</button></div><div id="detailMeta" class="detail-meta"></div></div><div class="detail-nav"><button type="button" class="nav-btn" id="prevBtn" aria-label="이전 사건">← 이전</button><button type="button" class="nav-btn" id="nextBtn" aria-label="다음 사건">다음 →</button></div></div><div class="detail-body" id="story"></div></section>
<p class="footer">부흥 프로젝트 · 역사 속 부흥 사례</p>
</main>
<script>
/* Embedded layout + styling together: prevent stale cached positioning code. */
document.addEventListener('DOMContentLoaded', function(){
/* Unified 30-episode proportional revival timeline. All original text is loaded from a local, immutable data file. */
(function(){
'use strict';
const EVENTS=window.REVIVAL_ATLAS_30;
if(!Array.isArray(EVENTS)||EVENTS.length!==30){document.getElementById('story').textContent='연대표 자료를 불러오지 못했습니다.';return;}
const byId=new Map(EVENTS.map(e=>[e.id,e]));
const stage=document.getElementById('timelineStage'),viewport=document.getElementById('timelineViewport');
const detail=document.getElementById('detail'),title=document.getElementById('detailTitle'),story=document.getElementById('story');
const SYNOPSES=JSON.parse(document.getElementById('revivalSynopsisData').textContent);
let selectedId=null;
// Time-point positions stay strictly proportional to historical start years.
// Cards may be offset horizontally (via subtle connector lines) to avoid crowding.
const SCALE=28,BASE_YEAR=1625,LEFT=170,CARD_H=40,CARD_GAP=14;
const AXIS_Y=117,HEIGHT=245,LANE_Y=[10,56,146,192];
// A segmented time axis: retain true start years, but compress long empty periods.
// A visible break symbol identifies every non-proportional segment.
const GAP_TRIGGER_YEARS=14;
const COMPRESSED_GAP_PX=245;
const axisIntervals=[];
const yearBreaks=[];
let runningAxisX=LEFT;
for(let i=1;i<EVENTS.length;i++){
  const fromYear=EVENTS[i-1].year,toYear=EVENTS[i].year;
  const gapYears=toYear-fromYear;
  const compressed=gapYears>GAP_TRIGGER_YEARS;
  const width=compressed?COMPRESSED_GAP_PX:gapYears*SCALE;
  const x0=runningAxisX,x1=runningAxisX+width;
  axisIntervals.push({fromYear,toYear,x0,x1,compressed});
  if(compressed)yearBreaks.push({fromYear,toYear,skippedYears:gapYears-1,midX:(x0+x1)/2});
  runningAxisX=x1;
}
function xOfYear(year){
  if(year<=BASE_YEAR)return LEFT+(year-BASE_YEAR)*SCALE;
  for(const gap of axisIntervals){
    if(year<=gap.toYear){
      if(gap.toYear===gap.fromYear)return gap.x1;
      return gap.x0+(year-gap.fromYear)*(gap.x1-gap.x0)/(gap.toYear-gap.fromYear);
    }
  }
  return runningAxisX+(year-EVENTS[EVENTS.length-1].year)*SCALE;
}
function create(tag,className,text){const n=document.createElement(tag);if(className)n.className=className;if(text!==undefined)n.textContent=text;return n;}
const positions=EVENTS.map(e=>({...e,x:xOfYear(e.year)}));
// Let each card's text and font determine its intrinsic width before assigning lanes.
// No abbreviation, clipping, or change to the historical labels is needed.
for(const p of positions){
  const card=create('button','event-node');card.type='button';card.dataset.eventId=p.id;
  card.style.left='0px';card.style.top='0px';card.style.visibility='hidden';
  card.title=p.date+' · '+p.title;
  card.setAttribute('aria-label',p.date+' '+p.title+' 상세 내용 읽기');
  card.setAttribute('aria-pressed','false');
  card.append(create('span','date',p.date),create('span','separator','·'),create('span','name',p.title));
  card.addEventListener('click',()=>selectEvent(p.id,false,true));
  stage.appendChild(card);
  p.width=Math.ceil(card.getBoundingClientRect().width);
  card.style.width=p.width+'px';p.card=card;
}
const maxWidth=Math.max(...positions.map(p=>p.width));
const clusters=[];
for(const p of positions){
  const cluster=clusters[clusters.length-1];
  if(!cluster||p.x-cluster[cluster.length-1].x>maxWidth+CARD_GAP)clusters.push([p]);
  else cluster.push(p);
}
const lanePatterns=[[0,2,1,3],[2,0,3,1],[0,3,2,1],[2,1,0,3],[1,2,3,0],[3,1,2,0],[1,3,0,2],[3,0,1,2]];
// Variable-width isotonic packing: neighboring cards keep a minimum 14px clearance.
// The weighted center shifts are minimized instead of squeezing long titles.
function packLane(seq){
  if(!seq.length)return [];
  const offsets=[0];
  for(let i=1;i<seq.length;i++)offsets.push(offsets[i-1]+(seq[i-1].width+seq[i].width)/2+CARD_GAP);
  const blocks=[];
  seq.forEach((p,i)=>{
    blocks.push({begin:i,end:i,average:p.x-offsets[i],count:1});
    while(blocks.length>1&&blocks[blocks.length-2].average>blocks[blocks.length-1].average){
      const right=blocks.pop(),left=blocks.pop();
      blocks.push({begin:left.begin,end:right.end,average:(left.average*left.count+right.average*right.count)/(left.count+right.count),count:left.count+right.count});
    }
  });
  const packed=[];
  for(const b of blocks)for(let i=b.begin;i<=b.end;i++)packed[i]=b.average+offsets[i];
  return packed;
}
for(const cluster of clusters){
  let chosen=null;
  for(const pattern of lanePatterns){
    const bins=[[],[],[],[]];
    cluster.forEach((p,i)=>bins[pattern[i%4]].push(p));
    const placements=[];let cost=0;
    for(let lane=0;lane<4;lane++){
      const seq=bins[lane],centers=packLane(seq);
      seq.forEach((p,j)=>{
        const center=centers[j],drift=center-p.x;
        cost+=drift*drift+(Math.abs(drift)>145?3*Math.pow(Math.abs(drift)-145,2):0);
        cost+=(lane===0?0:lane===2?8:lane===1?16:24);
        placements.push({p,lane,center});
      });
    }
    if(!chosen||cost<chosen.cost)chosen={placements,cost};
  }
  for(const entry of chosen.placements)entry.p.lane=entry.lane;
}
// Pack globally too, preventing cross-cluster overlaps after offsets are applied.
for(let lane=0;lane<4;lane++){
  const seq=positions.filter(p=>p.lane===lane),centers=packLane(seq);
  seq.forEach((p,j)=>p.cardX=centers[j]);
}
const STAGE_W=Math.ceil(Math.max(xOfYear(EVENTS[EVENTS.length-1].year)+maxWidth/2+22,...positions.map(p=>p.cardX+p.width/2+22)));
stage.style.width=STAGE_W+'px';stage.style.height=HEIGHT+'px';stage.dataset.layout='variable-width-245-v4';
stage.querySelector('.axis').style.top=AXIS_Y+'px';
// Show sparse calendar ticks only on intervals that retain their normal scale.
function xOf(y){return xOfYear(y);}
let priorTickX=-1e6;
for(let year=1625;year<=2023;year+=25){
  if(yearBreaks.some(g=>year>g.fromYear&&year<g.toYear))continue;
  const x=xOfYear(year);
  if(x-priorTickX<105)continue;
  let tick=create('div','tick'),span=create('span','',year+'');
  tick.style.left=x+'px';tick.style.top=(AXIS_Y-13)+'px';tick.setAttribute('aria-hidden','true');
  tick.appendChild(span);stage.appendChild(tick);priorTickX=x;
}
// Wave marks interrupt the axis and state the number of omitted calendar years.
for(const gap of yearBreaks){
  const mark=create('div','axis-break');
  mark.style.left=gap.midX+'px';mark.style.top=(AXIS_Y-14)+'px';
  mark.setAttribute('role','img');
  mark.setAttribute('aria-label',gap.fromYear+'년에서 '+gap.toYear+'년 사이의 '+gap.skippedYears+'년을 축약해 표시');
  mark.title=(gap.fromYear+1)+'–'+(gap.toYear-1)+'년: '+gap.skippedYears+'년 생략';
  mark.append(create('span','axis-break-wave','〰'),create('span','axis-break-years',gap.skippedYears+'년 생략'));
  stage.appendChild(mark);
}
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
svg.setAttribute('viewBox','0 0 '+STAGE_W+' '+HEIGHT);svg.setAttribute('width',STAGE_W);svg.setAttribute('height',HEIGHT);svg.classList.add('timeline-connectors');svg.setAttribute('aria-hidden','true');stage.appendChild(svg);
const nodes=[];
for(const p of positions){
  const top=LANE_Y[p.lane],fromTop=p.lane<2,edgeY=fromTop?top+CARD_H:top;
  const line=document.createElementNS('http://www.w3.org/2000/svg','path');line.setAttribute('class','connector-path');
  const bend=fromTop?AXIS_Y-13:AXIS_Y+13;
  line.setAttribute('d',`M ${p.x} ${AXIS_Y} L ${p.x} ${bend} L ${p.cardX} ${edgeY}`);svg.appendChild(line);
  const dot=create('button','dot');dot.type='button';dot.style.left=p.x+'px';dot.style.top=(AXIS_Y+1)+'px';dot.setAttribute('aria-label',p.date+' '+p.title+' 선택');dot.title=p.date+' · '+p.title;dot.addEventListener('click',()=>selectEvent(p.id,false,true));stage.appendChild(dot);
  p.card.style.left=(p.cardX-p.width/2)+'px';p.card.style.top=top+'px';p.card.style.visibility='';
  stage.appendChild(p.card);
  nodes.push({p,card:p.card,dot,top});
}
window.__revivalAtlasGeometry={scale:SCALE,baseYear:BASE_YEAR,axisMode:"segmented-with-breaks",breaks:yearBreaks,axisY:AXIS_Y,width:STAGE_W,height:HEIGHT,nodes:nodes.map(({p,top})=>({id:p.id,year:p.year,x:p.x,cardX:p.cardX,top,width:p.width,height:CARD_H,lane:p.lane})),lanes:4};
function safeURL(href){try{let u=new URL(href,location.href);return u.protocol==='https:'||u.protocol==='http:'?u.href:null;}catch{return null;}}
function appendTrustedMarkup(container,markup){
    // Source HTML comes from the installed manuscript package, not user-input strings.
    // No embedded scripts, inline event handlers, forms or arbitrary frame elements are allowed.
    const template=document.createElement('template');template.innerHTML=markup;
    for(const unsafe of template.content.querySelectorAll('script,iframe,object,embed,form,svg'))unsafe.remove();
    for(const el of template.content.querySelectorAll('*')){
        for(const a of Array.from(el.attributes)){
            if(/^on/i.test(a.name)||a.name==='srcdoc'||(a.name==='href'&&/^(?:javascript|data):/i.test(a.value)))el.removeAttribute(a.name);
        }
        if(el.tagName==='A'){
            const href=el.getAttribute('href');if(href&&/^https?:/i.test(href)&&safeURL(href)){el.target='_blank';el.rel='noopener noreferrer';}
        }
    }
    container.appendChild(template.content);
}
function renderAnnotationRow(e){
    const row=create('div','annotation-row');
    const a=create('details','annotation-gate'),b=create('details','annotation-gate');
    const as=create('summary','', '문단별 주석 및 편집자주 보기');
    const bs=create('summary','', '출처 보기');
    const contentA=create('div','annotation-content');appendTrustedMarkup(contentA,e.annotations);
    const contentB=create('div','annotation-content');appendTrustedMarkup(contentB,e.sources);
    a.append(as,contentA);b.append(bs,contentB);
    contentA.addEventListener('click',ev=>{
        const link=ev.target.closest('a[href^="#"]');if(!link)return;
        const id=decodeURIComponent(link.getAttribute('href').slice(1));
        const target=Array.from(contentB.querySelectorAll('[id]')).find(el=>el.id===id);
        if(target){b.open=true;ev.preventDefault();requestAnimationFrame(()=>target.scrollIntoView({behavior:'smooth',block:'center'}));}
    });row.append(a,b);return row;
}
function renderStory(e){
  story.replaceChildren();
  const main=create('div','history-story');
  if(e.kind==='video'){
    const intro=create('div','synopsis');
    for(const paragraph of SYNOPSES[e.id]||[]){intro.appendChild(create('p','',paragraph));}
    main.appendChild(intro);
    if(e.videoId&&e.videoUrl){
      const film=create('section','atlas-film');
      const frame=create('iframe','atlas-player');frame.loading='lazy';frame.title=e.title+' 기존 역사 영상';frame.setAttribute('allow','accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');frame.setAttribute('referrerpolicy','strict-origin-when-cross-origin');frame.setAttribute('allowfullscreen','');frame.src='https://www.youtube-nocookie.com/embed/'+e.videoId;
      film.appendChild(frame);
      main.appendChild(film);
    }
    const details=create('details','atlas-expand atlas-story-details');
    details.dataset.storyDetails='true';
    const storySummary=create('summary','','상세 이야기 읽기');
    storySummary.addEventListener('click',()=>{
      if(document.documentElement.classList.contains('atlas-home-embedded')){
        window.parent.postMessage({type:'revival-atlas:freeze-scroll'},location.origin);
      }
    });
    details.appendChild(storySummary);
    const body=create('article','long-body');appendTrustedMarkup(body,e.body);details.appendChild(body);
    details.appendChild(renderAnnotationRow(e));main.appendChild(details);
  }else{
    const research=create('article','long-body research-text');appendTrustedMarkup(research,e.body);main.appendChild(research);
    main.appendChild(renderAnnotationRow(e));
    main.querySelectorAll('a.fnref[href^="#fn"]').forEach(link=>{
      link.addEventListener('click',()=>{
        const gate=main.querySelector('.annotation-gate');
        if(gate)gate.open=true;
      });
    });
  }
  const closeButton=create('button','revival-close-detail','다시 접기 ↑');
  closeButton.type='button';
  closeButton.setAttribute('aria-label','상세 내용 접고 연대표로 돌아가기');
  closeButton.addEventListener('click',()=>{
    detail.hidden=true;story.replaceChildren();selectedId=null;activateVisualSelection(null);
    const panel=viewport.closest('.panel');
    if(document.documentElement.classList.contains('atlas-home-embedded')){
      window.parent.postMessage({type:'revival-atlas:focus',offset:panel.getBoundingClientRect().top+window.scrollY},location.origin);
    }else panel.scrollIntoView({block:'start',behavior:'auto'});
  });
  main.appendChild(closeButton);
  story.appendChild(main);
}
function requestFocus(){
  if(document.documentElement.classList.contains('atlas-home-embedded')){
    window.parent.postMessage({type:'revival-atlas:focus',offset:detail.getBoundingClientRect().top+window.scrollY},location.origin);
  }else detail.scrollIntoView({block:'start',behavior:'auto'});
}
function currentShareURL(id){const u=new URL('revival-atlas-share.html',location.href);u.search='?event='+encodeURIComponent(id);u.hash='';return u.href;}
function fallbackCopy(value){let input=document.createElement('textarea');input.value=value;input.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.appendChild(input);input.select();let ok=false;try{ok=document.execCommand('copy');}catch{}input.remove();if(!ok)window.prompt('아래 주소를 복사하세요.',value);return ok;}
const copyBtn=document.getElementById('eventCopyButton');
copyBtn.addEventListener('click',async()=>{
  if(!selectedId)return;let u=currentShareURL(selectedId),ok=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(u);ok=true;}}catch{}
  if(!ok)ok=fallbackCopy(u);
  if(ok){copyBtn.textContent='복사됨 ✓';window.setTimeout(()=>copyBtn.textContent='링크 복사',2000);}
});
function activateVisualSelection(id){
  for(const {p,card,dot} of nodes){let on=p.id===id;card.classList.toggle('active',on);dot.classList.toggle('active',on);card.setAttribute('aria-pressed',String(on));}
}
function scrollCardIntoView(id){const n=nodes.find(x=>x.p.id===id);if(!n)return;const desired=n.p.cardX-viewport.clientWidth/2;viewport.scrollTo({left:Math.max(0,desired),behavior:'auto'});}
function selectEvent(id,bringDetail,writeHistory){
  // Keep an already-open story expanded while navigating. Shared links and
  // parent-frame selection messages also request the full story by default.
  const wasExpanded=story.querySelector('details.atlas-story-details')?.open===true;
  if(id==='shotts')id='stewarton';if(id==='kilsyth1742')id='cambuslang';
  const e=byId.get(id);if(!e)return;
  selectedId=id;detail.hidden=false;activateVisualSelection(id);
  let index=EVENTS.indexOf(e);
  document.getElementById('detailCount').textContent=(index+1)+' / 30';
  title.textContent=e.title;
  const fullRegion=e.kind==='video'?(e.intro['지역']||e.region):(e.id==='rochester1830'?'미국 뉴욕주 로체스터':'미국 켄터키주 윌모어 애즈베리대학교');
  document.getElementById('detailMeta').textContent=e.date+' · '+(e.id==='raritan'?'미국(당시 영국령 북아메리카) 뉴저지 래리턴 계곡':fullRegion);
  document.getElementById('prevBtn').disabled=index===0;document.getElementById('nextBtn').disabled=index===29;
  renderStory(e);
  const longStory=story.querySelector('details.atlas-story-details');
  if(longStory && (!writeHistory || wasExpanded))longStory.open=true;
  scrollCardIntoView(id);
  if(writeHistory){let u=new URL(location.href);u.searchParams.set('event',id);if(document.documentElement.classList.contains('atlas-home-embedded'))history.replaceState({revivalEvent:id},'',u);else history.pushState({revivalEvent:id},'',u);}
  if(bringDetail)requestFocus();
}
document.getElementById('prevBtn').addEventListener('click',()=>{let i=EVENTS.findIndex(e=>e.id===selectedId);if(i>0)selectEvent(EVENTS[i-1].id,false,true);});
document.getElementById('nextBtn').addEventListener('click',()=>{let i=EVENTS.findIndex(e=>e.id===selectedId);if(i<29)selectEvent(EVENTS[i+1].id,false,true);});
function initialID(){let q=new URLSearchParams(location.search).get('event');if(q)return q;let m=location.hash.match(/^#revival-event-([a-z0-9_-]+)$/);return m?m[1]:null;}
window.addEventListener('message',(evt)=>{if(evt.origin!==location.origin||evt.source!==window.parent)return;let v=evt.data;if(v&&v.type==='revival-atlas:select'&&typeof v.id==='string')selectEvent(v.id,true,false);});
window.addEventListener('popstate',()=>{let id=initialID();if(id)selectEvent(id,true,false);});
window.addEventListener('hashchange',()=>{let id=initialID();if(id)selectEvent(id,true,false);});
// Keep current homepage iframe protocol and avoid nested vertical scrollbars.
if(document.documentElement.classList.contains('atlas-home-embedded')){
 let previous=-1;
 function report(){let main=document.getElementById('main');if(!main)return;let h=Math.ceil(main.getBoundingClientRect().bottom+window.scrollY+2);if(Math.abs(h-previous)>1){previous=h;window.parent.postMessage({type:'revival-atlas:height',height:h},location.origin);}}
 if('ResizeObserver' in window)new ResizeObserver(report).observe(document.getElementById('main'));
 window.addEventListener('load',report);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(report);report();
}
const linkedId=initialID();
if(linkedId){selectEvent(linkedId,true,false);}
else{
  const centerYear=1738;
  viewport.scrollLeft=Math.max(0,xOfYear(centerYear)-viewport.clientWidth*0.50);
}
const scrollHint=document.getElementById('timelineScrollHint');
if(scrollHint){
  const hideHint=()=>{scrollHint.hidden=true;};
  if(linkedId)hideHint();
  let readyForScroll=false;
  window.setTimeout(()=>{readyForScroll=true;},350);
  viewport.addEventListener('scroll',()=>{if(readyForScroll)hideHint();},{passive:true});
  window.addEventListener('wheel',hideHint,{once:true,passive:true});
  window.addEventListener('touchstart',hideHint,{once:true,passive:true});
  document.addEventListener('pointerdown',hideHint,{once:true,passive:true});
  document.addEventListener('keydown',hideHint,{once:true});
  window.addEventListener('message',evt=>{if(evt.origin===location.origin&&evt.source===window.parent&&evt.data&&evt.data.type==='revival-atlas:hint-hide')hideHint();});
}
})();

});
</script>
<script id="revival-photos-inline">
/* 부흥프로젝트 역사사진 29장 — 아주사 2 / 카시·미조 2 / 웨일스 2 / 묵티 2 / 원산·평양 2 */

wight-portrait","event":"yale","marker":"7년 전인 1795년, 티머시 드와이트가","src":"https://commons.wikimedia.org/wiki/Special:FilePath/Timothy_Dwight_IV_by_John_Trumbull.jpg","source":"https://commons.wikimedia.org/wiki/File:Timothy_Dwight_IV_by_John_Trumbull.jpg","alt":"예일 총장 티머시 드와이트의 초상화. 1802년 부흥집회 그림은 아님. Wikimedia Commons.","caption":"예일 총장 티머시 드와이트의 초상화. 1802년 부흥집회 그림은 아님. Wikimedia Commons.","maxWidth":410},{"id":"burns-portrait","event":"dundee","marker":"그해 봄, 킬싯 목사의 아들 윌리엄 찰머스 번스는","src":"https://commons.wikimedia.org/wiki/Special:FilePath/William_C_Burns.jpg","source":"https://commons.wikimedia.org/wiki/File:William_C_Burns.jpg","alt":"윌리엄 찰머스 번스의 역사 인물 이미지. 1839년 실제 집회 모습은 아님. Wikimedia Commons.","caption":"윌리엄 찰머스 번스의 역사 인물 이미지. 1839년 실제 집회 모습은 아님. Wikimedia Commons.","maxWidth":450},{"id":"surrey-music-hall","event":"spurgeon1855","marker":"1856년, 회중을 수용하기 위해 교회는 서리 가든스 음악당을","src":"https://upload.wikimedia.org/wikipedia/commons/f/f3/Surrey_Music_Hall.jpg","source":"https://commons.wikimedia.org/wiki/File:Surrey_Music_Hall.jpg","alt":"스펄전의 설교 장소 서리 가든스 음악당 역사 삽화. 1855년 특정 설교 현장을 그대로 촬영한 사진은 아님. Wikimedia Commons.","caption":"스펄전의 설교 장소 서리 가든스 음악당 역사 삽화. 1855년 특정 설교 현장을 그대로 촬영한 사진은 아님. Wikimedia Commons.","maxWidth":670},{"id":"fulton-1871-engraving","event":"fulton","marker":"사람들이 늘어나면서 교회는 방을 더 사용했고","src":"https://i0.wp.com/nycreligion.info/wp-content/uploads/2022/09/TheFultonStreetPrayerMeeting1871.jpg","source":"https://www.loc.gov/exhibits/religion/rel07.html","alt":"1871년경 뉴욕 기도회 운동을 묘사한 역사 삽화. 1857년 최초 모임 사진이 아니며 제작·소장 기록은 추가 대조 필요.","caption":"1871년경 뉴욕 기도회 운동을 묘사한 역사 삽화. 1857년 최초 모임 사진이 아니며 제작·소장 기록은 추가 대조 필요.","maxWidth":630}];
const styles = `
.long-body figure.revival-history-photo{margin:26px auto 30px;max-width:var(--archive-max,640px);padding:0;text-align:center}
.long-body .revival-history-photo img{display:block;width:100%;height:auto;max-height:510px;object-fit:contain;border:1px solid #dae3dd;border-radius:8px;background:#f6f8f6}
.long-body .revival-history-photo figcaption{margin:9px 5px 0;font-size:12px;font-weight:400;color:#60766f;line-height:1.7;text-align:center;word-break:keep-all}
.long-body .revival-history-photo figcaption a{font-size:12px;color:#246d65;text-decoration:underline;text-underline-offset:2px}
.long-body .revival-history-photo .archive-photo-fallback{display:none;font-size:13px;margin-top:6px}
.long-body .revival-history-photo.photo-load-error img{display:none}
.long-body .revival-history-photo.photo-load-error .archive-photo-fallback{display:inline}
@media(max-width:600px){.long-body .revival-history-photo{margin:20px auto 25px}.long-body .revival-history-photo figcaption{font-size:11.5px}}
`;
function makeFigure(meta){
  const fig=document.createElement('figure');fig.className='revival-history-photo';
  fig.dataset.historicalPhoto=meta.id;
  fig.style.setProperty('--archive-max',meta.maxWidth+'px');
  const img=document.createElement('img');
  img.loading='lazy';img.decoding='async';img.alt=meta.alt;img.src=meta.src;
  img.addEventListener('error',()=>fig.classList.add('photo-load-error'),{once:true});
  const cap=document.createElement('figcaption');cap.append(document.createTextNode(meta.caption+' '));
  const a=document.createElement('a');a.href=meta.source;a.target='_blank';a.rel='noopener noreferrer';a.textContent='사진 출처 보기 ↗';cap.append(a);
  const fallback=document.createElement('a');fallback.className='archive-photo-fallback';
  fallback.href=meta.source;fallback.target='_blank';fallback.rel='noopener noreferrer';
  fallback.textContent='이미지를 표시할 수 없습니다. 원본 사이트에서 보기 ↗';
  fig.append(img,cap,fallback);return fig;
}
function insert(){
  const story=document.getElementById('story');if(!story)return;
  const article=story.querySelector('article.long-body');if(!article)return;
  const ps=Array.from(article.querySelectorAll('p'));
  for(const meta of photos){
    if(article.querySelector('[data-historical-photo="'+meta.id+'"]'))continue;
    const target=ps.find(p=>p.textContent.includes(meta.marker));
    if(target)target.insertAdjacentElement('afterend',makeFigure(meta));
  }
}
function begin(){
  if(!document.getElementById('revival-history-photo-css')){
    const style=document.createElement('style');style.id='revival-history-photo-css';style.textContent=styles;document.head.append(style);
  }
  const story=document.getElementById('story');if(!story)return;
  insert();new MutationObserver(insert).observe(story,{childList:true,subtree:false});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',begin,{once:true});
else begin();
})();

</script>
