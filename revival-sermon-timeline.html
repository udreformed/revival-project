// 주소가 없으면 영상이 있는 것처럼 표시하지 않고, 정직한 준비 안내만 보여 줍니다.
const STEWARTON_VIDEO_URL = 'https://youtu.be/tO_GuWzkkz0';
const STEWARTON_FULL_STORY = ["1618년, 스코틀랜드 서부의 어바인에 데이비드 딕슨이라는 목사가 부임했습니다. 글래스고대학교에서 철학을 가르치던 그는 이제 작은 도시의 교회에서 성경을 전했습니다. 어바인에서 멀지 않은 곳에는 스튜어턴이라는 마을이 있었습니다. 훗날 그 마을의 이름은 딕슨의 설교와 함께 오래 기억되게 됩니다.","당시 스코틀랜드 교회에는 갈등이 깊어지고 있었습니다. 국왕 제임스 6세는 감독들의 권한을 강화했고, 1618년 퍼스에서는 성찬 때 무릎을 꿇는 일과 교회 절기를 지키는 일 등을 요구하는 조항들이 채택되었습니다. 딕슨은 그 조항들을 검토한 끝에, 교회 예배에 그런 규정을 강제로 부과하는 데 반대했습니다.","1622년 초, 그는 에든버러의 고등교회위원회에 소환되었습니다. 감독들의 권위를 거스르고 항의 문서를 제출했다는 이유였습니다. 문서를 철회하라는 요구가 이어졌지만 딕슨은 물러서지 않았습니다. 결국 그는 어바인에서 설교할 권리를 잃고 북동부의 터리프로 가라는 명령을 받았습니다. 교회를 떠나야 한다는 판결이었습니다.","어바인의 에글린턴 백작이 그를 도왔습니다. 딕슨은 잠시 백작의 영지에서 설교할 수 있었고, 교회에서 그를 듣지 못하게 된 사람들이 그곳으로 찾아왔습니다. 그러나 얼마 지나지 않아 거기에도 머물 수 없게 되었습니다. 그는 터리프로 떠났고, 그곳의 목회자 토머스 미첼의 도움으로 다시 말씀을 전했습니다.","어바인 교인들은 목사의 귀환을 청원했습니다. 항의 문서를 거둔다면 돌아올 수 있다는 제안도 있었지만, 딕슨은 자신의 입장을 철회하지 않았습니다. 마침내 1623년 7월 무렵, 그는 문서를 철회하지 않은 채 어바인으로 돌아왔습니다. 한동안 비어 있던 강단에서 그의 설교가 다시 시작되었습니다.","어바인에서는 월요일마다 장이 열렸습니다. 주변 마을 사람들은 물건을 팔기 위해 이 도시로 왔습니다. 딕슨은 그들이 모이는 날을 놓치지 않았습니다. 장이 시작되기 전에 설교를 들을 수 있도록 월요일 모임을 마련했습니다. 사람들은 물건을 거래하기 전에 하나님의 말씀을 듣고 집으로 돌아갔습니다.","그 가운데 스튜어턴 주민들이 있었습니다. 그곳의 목사 윌리엄 캐슬로는 자기 교인들에게 어바인에 가서 설교를 들으라고 권했습니다. 장터에 팔 물건을 챙겨 나온 사람들은 이제 말씀을 듣는 일도 중요하게 여겼습니다. 어바인에서 들은 설교는 스튜어턴의 집과 교회로 이어졌습니다.","월요일 예배당은 점점 붐볐습니다. 어떤 기록에는 그날의 회중이 주일만큼 많거나 때로는 더 많았다고 전해집니다. 딕슨의 설교를 가까이에서 들으려고 다른 지역에서 어바인으로 거처를 옮긴 사람들도 있었습니다. 처음에는 장터를 위해 어바인을 찾던 사람들이 이제 설교를 위해 먼 길을 오갔습니다.","설교가 끝나도 사람들의 질문은 끝나지 않았습니다. 주일 저녁이면 자기 영혼의 문제로 괴로워하는 사람들이 딕슨의 집으로 찾아왔습니다. 어떤 사람은 자신의 죄 때문에 두려워했고, 어떤 사람은 자신에게 구원의 소망이 있는지 알지 못했습니다. 딕슨은 그들의 이야기를 듣고 성경의 말씀으로 답하며 낙심한 사람들을 위로했습니다.","목사관의 큰 방에는 그를 기다리는 이들이 여럿 모이곤 했습니다. 후대에 전해진 회고에는 수십 명이 함께 기다렸다는 이야기도 있습니다. 예배당에서 많은 사람을 향해 전했던 복음은 그 자리에서 한 사람 한 사람의 구체적인 질문으로 이어졌습니다. 딕슨은 그들이 단지 두려움에 머물지 않고 그리스도의 은혜를 바라보도록 도왔습니다.","1625년 무렵부터 스튜어턴과 그 주변에서 특이한 변화가 알려지기 시작했습니다. 오랫동안 교회에 다녔어도 신앙을 대수롭지 않게 여기던 사람들이 자신의 죄를 진지하게 돌아보았습니다. 이전의 생활을 후회하며 도움을 구하는 사람도 있었고, 용서와 구원에 관해 묻기 시작한 사람도 있었습니다. 한 사람의 이야기가 이웃에게 전해졌고, 그 변화는 여러 가정에 번져 갔습니다.","이 움직임을 낯설게 바라보던 사람들은 비웃는 이름을 붙였습니다. ‘스튜어턴의 병’이라는 말이었습니다. 마치 병이 퍼지듯 여러 사람이 죄와 구원의 문제로 괴로워한다는 뜻이었습니다. 실제 전염병이 아니라, 당시 사람들이 그 영적 각성을 조롱하며 부르던 이름이었습니다.","스튜어턴을 흐르는 물길을 따라 마을들이 이어져 있었습니다. 그 지역의 집과 이웃들 사이에서도 비슷한 일이 일어났습니다. 어떤 이들은 설교를 듣고 오래전부터 익숙하게 여겼던 자신의 행동을 새롭게 돌아보았습니다. 종교를 가볍게 여기던 사람들 가운데 생활이 달라졌다는 증언도 나왔습니다. 부흥의 중심은 한 차례의 큰 집회가 아니라, 여러 해 이어진 말씀 사역과 사람들의 변화였습니다.","때로는 죄에 대한 두려움이 몸으로 드러날 만큼 격렬한 반응도 나타났습니다. 일부가 설교를 듣다가 쓰러졌다는 이야기가 전해집니다. 그러나 모든 사람에게 그런 일이 일어난 것은 아닙니다. 겉으로는 조용해 보여도 자신의 죄를 진지하게 생각하며 신앙을 새롭게 한 사람들도 있었습니다. 격한 반응 자체가 참된 회심을 증명하는 것은 아니었습니다.","딕슨과 이웃 교회의 목회자들은 고통받는 사람들을 만나 상담하고 말씀을 가르쳤습니다. 지나친 행동으로 예배와 가정을 어지럽히는 일은 바로잡으려 했습니다. 위로가 필요한 사람에게는 위로를, 잘못된 확신에 빠진 사람에게는 신중한 권면을 주었습니다. 부흥의 열기가 거세질수록 사람들의 이후 생활을 살피는 일도 중요했습니다.","어바인의 성찬예배에도 다른 지역의 신자들이 찾아왔습니다. 딕슨의 설교를 들으러 먼 곳에서 온 사람들은 그곳 교인들과 함께 예배했습니다. 이 소식은 서부 스코틀랜드 여러 교구로 전해졌습니다. 하지만 모든 사람의 변화가 한순간에 시작되거나 같은 방식으로 진행된 것은 아니었습니다. 그들은 저마다의 자리에서 말씀을 듣고 신앙을 돌아보았습니다.","스튜어턴에서는 목사 캐슬로가 자기 회중을 계속 돌보고 있었습니다. 어바인의 딕슨이 널리 알려진 설교자였지만, 스튜어턴 교회와 그 주민들의 일상은 한 사람의 이름만으로 설명되지 않았습니다. 첫 회심자가 누구였는지, 어떤 날부터 부흥이 시작되었는지는 분명히 전해지지 않습니다. 다만 여러 마을에서 사람들이 예배와 신앙생활을 새롭게 여기기 시작했다는 증언들이 남았습니다.","시간이 흐르자 변화의 깊이도 서로 달랐습니다. 어떤 사람들은 이전의 삶에서 돌아서서 신앙을 오래도록 지켰습니다. 반면 한동안 열심을 보이다가 다시 예전 생활로 돌아간 사람들도 있었습니다. 당시를 기억한 이들의 이러한 증언 때문에, 스튜어턴에서 일어난 모든 감동을 똑같은 회심으로 셀 수는 없습니다. 사람들에게 남은 삶의 열매는 달랐습니다.","1630년, 스코틀랜드의 다른 지역인 쇼츠에서는 젊은 설교자 존 리빙스턴이 성찬모임 뒤에 설교했습니다. 그곳에서도 많은 사람의 신앙이 변화되었다는 증언이 전해집니다. 리빙스턴은 얼마 뒤 어바인에서 낙심했을 때 딕슨의 권면을 받고 다시 설교했습니다. 쇼츠의 사건은 스튜어턴 부흥과는 구별되는 별도의 이야기였습니다.","스튜어턴의 부흥에는 시작을 알리는 단 한 번의 유명한 설교도, 이름이 확인된 첫 회심자의 이야기도 남아 있지 않습니다. 대신 장날마다 이어진 설교, 죄와 구원의 문제를 묻던 사람들, 그들을 돌보던 목회자들, 그리고 달라진 생활을 오래 이어 간 이들의 흔적이 남았습니다. 박해로 한때 강단을 떠나야 했던 딕슨의 사역을 통해, 신앙의 변화가 어바인에서 스튜어턴과 주변 마을로 이어졌습니다."];
const STEWARTON_SOURCES = [["John Howie","Biographia Scoticana (Scots Worthies), “The Life of Mr. David Dickson”","https://biblehub.com/library/howie/biographia_scoticana_scots_worthies/the_life_of_mr_david_3.htm"],["Robert Fleming","The Fulfilling of the Scripture (1669) — 이안 머리 The Puritan Hope 수록·인용","https://revival-library.org/histories/1600-revival-the-puritan-hope/"],["Robert Chambers","Domestic Annals of Scotland, vol. II — 워드로가 수집한 전승 포함","https://www.gutenberg.org/cache/epub/73695/pg73695-images.html"],["T. F. Henderson","Dictionary of National Biography (1888), “Dickson, David”","https://en.wikisource.org/wiki/Dictionary_of_National_Biography,_1885-1900/Dickson,_David_(1583%3F-1663)"],["John Livingstone","A Brief Historical Relation / Select Biographies, vol. 1, pp. 138–139 — 쇼츠 설교 및 어바인에서 딕슨의 권면","https://www.iment.com/maida/familytree/henry/bios/jl/jl-lifeofjohnlivingstone-p138-139.htm"]];
function addStewartonVideoAndStory(body){
  const videoBox=document.createElement('div');
  videoBox.className='stewarton-film';
  const raw=STEWARTON_VIDEO_URL.trim();
  if(raw){
    try{
      const u=new URL(raw,window.location.href);
      let youtubeId='';
      const host=u.hostname.toLowerCase();
      if(host==='youtu.be')youtubeId=u.pathname.split('/')[1]||'';
      if(host==='youtube.com'||host==='www.youtube.com'||host==='m.youtube.com'||host==='www.youtube-nocookie.com'){
        youtubeId=u.searchParams.get('v')||(u.pathname.match(/^\/(?:embed|shorts|live)\/([a-zA-Z0-9_-]{11})/)||[])[1]||'';
      }
      if(/^[a-zA-Z0-9_-]{11}$/.test(youtubeId)){
        const iframe=document.createElement('iframe');
        iframe.className='stewarton-player';
        iframe.src='https://www.youtube-nocookie.com/embed/'+youtubeId;
        iframe.title='스튜어턴·어바인 부흥 이야기 영상';
        iframe.loading='lazy'; iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share'; iframe.allowFullscreen=true;
        videoBox.appendChild(iframe);
      }else if(/\.(mp4|webm)(?:$|[?#])/i.test(u.href)){
        const v=document.createElement('video');
        v.className='stewarton-player';v.src=u.href;v.controls=true;v.playsInline=true;v.preload='metadata';
        v.setAttribute('aria-label','스튜어턴·어바인 부흥 이야기 영상');videoBox.appendChild(v);
      }else{
        const a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';
        a.textContent='스튜어턴·어바인 부흥 영상 보기 ↗';videoBox.appendChild(a);
      }
    }catch(_){
      const p=document.createElement('div');p.className='stewarton-video-pending';
      p.textContent='영상 연결 주소를 확인해 주세요.';videoBox.appendChild(p);
    }
  }else{
    const p=document.createElement('div');p.className='stewarton-video-pending';
    p.textContent='이야기 영상은 링크를 등록하면 이곳에서 바로 재생됩니다.';videoBox.appendChild(p);
  }
  body.appendChild(videoBox);
  const details=document.createElement('details');details.className='revival-story-expand';details.setAttribute('data-story-details','stewarton');
  const summary=document.createElement('summary');summary.textContent='이야기 자세히 읽기';
  details.appendChild(summary);
  const full=document.createElement('div');full.className='revival-story-fulltext';
  for(const line of STEWARTON_FULL_STORY){const p=document.createElement('p');p.textContent=line;full.appendChild(p);}
  const sources=document.createElement('section');sources.className='revival-story-sources';
  const h=document.createElement('h4');h.textContent='주요 출처';sources.appendChild(h);
  const ul=document.createElement('ul');
  for(const [author,work,link] of STEWARTON_SOURCES){
    const li=document.createElement('li');li.append(document.createTextNode(author+', '));
    const a=document.createElement('a');a.href=link;a.target='_blank';a.rel='noopener noreferrer';a.textContent=work;
    li.appendChild(a);ul.appendChild(li);
  }
  sources.appendChild(ul);
  const note=document.createElement('p');
  note.textContent='스튜어턴의 일부 발언과 쇼츠 부흥의 회심자 수에는 후대 기록과 전승이 포함됩니다. 1630년 쇼츠는 스튜어턴과 동일한 사건이 아니라 연관된 별도 성찬모임으로, 기존 스튜어턴 영상에는 쇼츠 장면이 포함되어 있지 않습니다.';
  sources.appendChild(note);
  full.appendChild(sources);addStoryCloseButton(full,details,summary);details.appendChild(full);body.appendChild(details);
}

const KOREA_FULL_STORY = ["1903년 여름, 조선 동해안의 항구도시 원산에는 서로 다른 선교회에 속한 여성 선교사들이 있었습니다. 캐나다 장로교의 루이스 매컬리와 남감리교의 메리 화이트도 그 가운데 있었습니다. 두 사람은 함께 사역하는 선교사들이 하나님을 더욱 의지하며 일하게 해 달라고 모여 기도해 왔습니다. 두 사람으로 시작된 기도는 다른 여성 선교사들에게 이어졌습니다. 같은 교단 출신만 모인 기도회가 아니었습니다. 원산의 여러 선교회에서 일하던 사람들이 함께 성경을 읽고 기도할 자리를 마련했습니다.","그들이 한 주 동안 연합으로 모이기로 한 날짜는 1903년 8월 24일부터 30일까지였습니다. 기도회를 준비하면서 여성 선교사들은 원산에서 의료 선교와 복음 전도에 힘쓰던 로버트 하디에게 기도에 관해 세 차례 말씀을 전해 달라고 부탁했습니다. 하디는 그 부탁을 받아 성경을 살피기 시작했습니다. 그는 조선에 온 지 십 년이 넘은 의사이자 선교사였습니다. 환자를 돌보고 여러 지역을 다니며 복음을 전했지만, 그의 사역에는 오래도록 마음을 무겁게 하는 문제가 있었습니다.","원산에서 강원도 통천 일대로 이어진 선교 활동은 그가 기대한 결실을 거두지 못하고 있었습니다. 그는 누구보다 열심히 일했다고 생각했지만, 몇 해가 지나도 뚜렷한 변화를 보지 못했습니다. 훗날 작성한 보고서에서 하디는 강원도 지경대에서 삼 년 동안 힘써 일했으며, 그곳에서 겪은 실패가 자신에게 깊은 절망을 안겨 주었다고 털어놓았습니다. 처음에는 그가 실패의 이유를 똑바로 이해하지 못했습니다. 그러나 기도에 관한 강의를 준비하면서 그의 시선은 다른 곳으로 옮겨 갔습니다.","그가 읽은 말씀 가운데 누가복음 11장 13절이 있었습니다. 하나님 아버지께서 구하는 자에게 성령을 주신다는 말씀이었습니다. 하디는 선교사로서 가진 지식과 훈련, 자신의 능력을 의지하는 동안 하나님을 충분히 신뢰하지 않았다는 사실을 돌아보게 되었습니다. 조선 사람들을 대할 때 품었던 교만과 그들의 형편을 낮게 보았던 태도도 외면할 수 없었습니다. 그는 자신의 사역을 막고 있던 문제가 단순히 외부 환경에만 있는 것이 아니라고 고백하게 되었습니다.","8월 마지막 주, 원산의 연합 기도회가 시작되었습니다. 하디는 그리스도를 믿는 믿음과 그리스도 안에 거하는 삶, 성령의 역사를 주제로 말씀을 전했습니다. 그리고 오랫동안 함께 사역한 동료 선교사들 앞에서 자기의 실패와 그 원인이 된 잘못을 인정했습니다. 이후 하디는 그 시간을 돌이켜보며 자신에게 가장 먼저 요구된 일이 동료들 앞에 실패와 그 원인을 시인하는 것이었으며, 그것은 고통스럽고 굴욕적인 경험이었다고 썼습니다. 사람들에게 회개를 말해 왔던 선교사가 이제 자신이 무엇을 회개해야 하는지 사람들 앞에서 드러낸 것입니다.","그 고백은 선교사들 사이에서만 끝나지 않았습니다. 하디는 이어진 주일 오전예배에서 원산의 한국인 회중 앞에 섰습니다. 자신을 바라보는 사람들 앞에서 그는 선교사라는 지위 뒤에 숨지 않았습니다. 교만과 마음의 완고함, 믿음의 부족을 고백했습니다. 훗날 그는 자신이 부끄럽고 당황한 얼굴로 그 죄들을 인정했을 때, 회중이 죄를 깨닫고 회개한다는 것이 무엇인지 새롭게 이해하기 시작했다고 회고했습니다. 이제 회중은 선교사의 강단에서 남을 꾸짖는 말만 듣는 것이 아니라, 설교자 자신이 자신의 죄를 인정하는 모습을 보았습니다.","원산에서는 다른 사람들의 고백도 뒤따랐습니다. 한글을 가르치던 진천수는 주일 예배가 끝난 뒤 사람들 앞에 나서서 감추었던 죄를 눈물로 고백했습니다. 지역 교회 안에서는 신앙을 돌아보고 잘못된 일을 바로잡으려는 움직임이 이어졌습니다. 하디는 전과 같이 복음을 전했지만, 이전과 같은 사람으로 머물지는 않았다고 가까이 지낸 동료들이 기록했습니다. 그 뒤로 원산의 여러 교회에서 일어난 변화의 소식이 다른 지역으로 전해지기 시작했습니다.","1904년과 1905년에도 교회마다 성경을 배우는 사경회와 기도모임이 이어졌습니다. 원산에서 일어난 일을 들은 선교사들이 다른 도시를 방문했고, 신자들은 집회에서 들은 말씀과 회개의 경험을 이웃에게 전했습니다. 모든 지역에서 같은 일이 한꺼번에 일어난 것은 아니었습니다. 그러나 원산에서 시작된 움직임은 더 이상 한 도시의 일로만 남아 있지 않았습니다.","1906년 8월, 하디는 평양을 찾았습니다. 그곳에는 이미 수많은 한국인 신자들이 예배하던 장대현교회가 있었고, 성경을 가르치는 학교와 선교사들의 사역도 이어지고 있었습니다. 하디는 평양의 선교사들을 위한 사경회에서 말씀을 전했습니다. 원산에서 자신의 실패와 교만을 공개적으로 고백했던 그 선교사의 이야기를 평양의 선교사들이 직접 듣게 되었습니다. 그들 가운데에는 장대현교회를 돌보던 그레함 리 선교사도 있었습니다.","같은 해 가을, 평양에서는 다른 방문 설교자의 이야기도 들려왔습니다. 하워드 존스턴은 웨일스와 인도에서 일어난 부흥의 소식을 전했습니다. 10월 장대현교회에서 열린 집회에서 그가 성령의 충만을 사모하는 사람이 누구인지 묻자, 당시 장로였던 길선주가 손을 들고 일어섰다는 기록이 남아 있습니다. 그 이후 평양의 선교사들과 한국인 신자들은 함께 기도하는 일을 더욱 중요하게 여기게 되었습니다. 일부는 매일 한 시간씩 기도하기로 약속했습니다. 장대현교회와 평양의 여러 교회에서 사경회와 기도가 계속되었습니다.","1907년 1월 2일, 평양에서는 겨울 남자 사경회가 시작되었습니다. 여러 교회의 신자들이 성경을 배우기 위해 장대현교회로 모였습니다. 6일부터는 저녁마다 별도의 집회도 열렸습니다. 낮에는 말씀을 배우고, 저녁에는 선교사들과 한국인 지도자들의 설교를 들었습니다. 그레함 리, 윌리엄 헌트, 윌리엄 블레어와 길선주 등이 집회를 맡았습니다. 저녁 모임에는 사경회에 등록한 사람들만이 아니라 평양의 다른 신자들도 모였습니다. 기록에 따라 참석 인원은 다르게 전해지지만, 예배당을 가득 채울 만큼 많은 사람이 모였다는 점은 여러 증언에 공통으로 나타납니다.","1월 6일과 7일 저녁에도 기도가 이어졌습니다. 7일 저녁, 헌트가 설교한 뒤 그레함 리가 말했습니다. “우리 다 같이 기도합시다.” 곧 회중 곳곳에서 소리를 내어 기도하기 시작했습니다. 서로 다른 사람들이 한자리에서 자기 말로 하나님께 기도했습니다. 그 자리에 있었던 조지 매큔은 훗날 그 광경을 편지에 기록했습니다. 사람들 가운데는 자기의 죄를 구체적으로 고백하는 이들이 있었고, 성령의 도우심을 구하는 이들도 있었습니다. 집회는 하루로 끝나지 않았습니다.","1월 12일 토요일 저녁, 윌리엄 블레어는 고린도전서 12장의 말씀을 전했습니다. 교회는 그리스도의 몸이며 신자들은 그 몸에 속한 지체라는 말씀이었습니다. 블레어에게는 청중 앞에 보여 줄 자신의 상처가 있었습니다. 과거 사냥 중 총에 맞아 손가락 끝을 다친 일이 있었던 것입니다. 그는 손가락 하나가 상했을 때 머리와 온몸이 함께 고통스러웠던 일을 들려주었습니다. 교회 안에서 한 사람이 다른 사람을 미워하면 그 미움은 그 두 사람에게만 머무르지 않는다고 전했습니다. 그날 말씀을 들은 사람들 가운데는 다른 신자들과 선교사들에게 품었던 나쁜 감정을 인정하는 이들이 있었습니다.","그러나 그다음 날인 1월 13일 주일 저녁에는 분위기가 달랐습니다. 장대현교회에는 다시 많은 사람이 모였습니다. 길선주가 설교했고 기도의 시간도 있었습니다. 하지만 전날과 같은 변화는 나타나지 않았습니다. 사람들은 기도하기를 주저했고, 간증은 형식적으로 이어졌습니다. 길선주는 회중이 마치 죽어 있는 것처럼 반응한다고 답답해할 정도였습니다. 그날 밤을 기억한 블레어는 집회가 생명 없는 형식처럼 느껴졌다고 남겼습니다. 기대를 품고 모였던 사람들은 무거운 마음으로 돌아갔습니다.","월요일인 1월 14일 정오, 선교사들은 다시 모여 기도했습니다. 그날 저녁에는 사경회의 끝이 가까워지고 있었습니다. 장대현교회 안에는 사람들이 모여들었습니다. 짧은 설교가 끝난 뒤 그레함 리가 회중에게 함께 기도하자고 요청했습니다. 사람들은 각자의 목소리로 기도했습니다. 한동안 기도가 이어진 뒤에는 집으로 돌아갈 사람은 돌아가도 좋다는 안내가 있었습니다. 많은 사람이 예배당을 떠났지만, 약 오백 명에서 육백 명이 남아 더 기도했습니다.","남은 사람들 사이에서 자신의 죄를 고백하는 이들이 하나씩 일어났습니다. 오랫동안 숨겨 온 잘못을 말하는 사람도 있었고, 다른 사람을 미워했던 일을 인정하는 사람도 있었습니다. 그레함 리는 자신이 고용했던 요리사가 바닥에 쓰러져 자신을 향해 외쳤다고 기록했습니다. “목사님, 나에게도 희망이 있는지요?” 그 사람은 눈물을 흘리며 자신의 죄를 괴로워했습니다. 사람들의 고백과 기도는 늦은 밤까지 이어졌습니다. 그 현장에 있던 선교사들은 그 밤의 집회가 이튿날 새벽까지 계속되었다고 보고했습니다.","그날 밤 교회에서 일하던 강유문도 사람들 앞에 나왔습니다. 그는 장대현교회 김 장로를 마음속으로 미워해 왔다는 사실을 인정하고 용서를 구했습니다. 그러나 김 장로는 그날 끝내 입을 열지 않았습니다. 다른 사람들이 죄를 고백하고 밤이 깊어 가는 동안에도 그는 자신의 잘못을 공개적으로 털어놓지 않았습니다. 그를 아는 선교사들은 그와 강유문 사이에 오래된 미움이 있다는 사실을 알고 있었습니다.","1월 15일 화요일 아침, 전날의 소식은 평양의 선교사들 사이로 전해졌습니다. 여러 선교사가 다시 모여 기도했습니다. 그날 밤은 남자 사경회의 마지막 저녁 집회였습니다. 길선주 장로가 강단에 서서 설교했습니다. 그의 설교가 끝난 뒤에는 전날처럼 집으로 돌아갈 사람들을 먼저 보냈습니다. 약 육백 명이 예배당에 남았습니다. 전날 밤의 일을 겪었던 이들 가운데는 다시 자신의 죄를 고백하는 사람들이 있었습니다.","김 장로는 그때까지도 강단 뒤쪽에 앉아 있었습니다. 방위량이라고도 불리던 윌리엄 블레어 선교사는 그를 알고 있었습니다. 김 장로는 교회에서 책임을 맡은 사람이었고, 블레어가 지도하던 청년 단체에서도 활동했습니다. 그러나 두 사람 사이에도 마음의 상처가 있었습니다. 블레어가 운동장 사용 문제로 김 장로를 재촉했던 일이 그의 마음에 오래 남아 있었습니다. 블레어는 김 장로가 자신을 미워하고 있다는 사실을 알지 못했습니다.","그날 김 장로가 강단 앞으로 나왔습니다. 그는 강단을 붙잡고 자신의 잘못을 고백했습니다. “나는 하나님을 거슬러 싸운 죄인입니다.” 그는 교회의 장로인 자신이 강유문뿐 아니라 방 목사까지 미워해 왔다고 인정했습니다. 그의 말을 듣고서야 블레어는 김 장로가 자신을 향해 품었던 미움을 알았습니다. 선교사는 고개를 숙이고 그 곁에서 울며 기도했습니다. 자신이 함께 일해 온 교회 지도자가 그토록 큰 미움을 품고 있었다는 사실이 그에게도 깊은 충격이었습니다.","김 장로가 고백을 마친 뒤 강유문이 그에게 다가갔습니다. 전날 자신도 김 장로를 미워했다고 고백했던 바로 그 사람이었습니다. 두 사람은 서로 팔을 벌려 끌어안고 함께 울었습니다. 그렇게 한동안 서로를 미워하던 교회 지도자들이 사람들 앞에서 화해했습니다. 김 장로는 다시 블레어 선교사를 향했습니다. “나를 용서할 수 있습니까?” 그리고 자신을 위해 기도해 달라고 부탁했습니다. 블레어는 곧바로 긴 대답을 하지 못했습니다. 그가 거듭 부른 말은 “아버지, 아버지……”였습니다.","예배당 안에서는 다른 사람들의 고백도 이어졌습니다. 교회의 지도자들이 숨겨 왔던 미움과 잘못을 인정했고, 그들을 보던 사람들도 자신의 죄를 돌아보았습니다. 그날의 집회에 참석했던 선교사들은 나중에 이틀 동안 있었던 일을 편지와 보고서에 남겼습니다. 그들이 기억한 것은 수많은 사람이 동시에 기도하던 소리만이 아니었습니다. 서로를 미워하던 사람들이 그 자리에서 잘못을 인정하고 용서를 구하던 모습도 남아 있었습니다.","장대현교회의 집회가 끝났다고 평양의 모임이 모두 끝난 것은 아니었습니다. 1월 16일 수요일에도 같은 교회에서 기도회가 열렸습니다. 그날에는 또 다른 교회 지도자가 자신이 감추어 온 심각한 잘못을 고백했습니다. 17일에는 여학교에서도 기도와 죄의 고백이 이어졌습니다. 남자 사경회 때 장대현교회에 함께 모일 수 없었던 여성 신자들을 위한 집회도 17일부터 열렸습니다. 19일 토요일 저녁에는 그들 가운데서도 깊은 회개의 움직임이 나타났다는 기록이 남아 있습니다.","평양에서 일어난 변화는 예배당 문을 나서는 순간 끝나지 않았습니다. 당시 집회를 지켜본 윌리엄 블레어는 사람들이 전에 훔친 물건과 돈을 돌려주고, 잘못을 저지른 이웃을 찾아가 용서를 구했다고 기록했습니다. 교인이 아닌 사람들에게도 마찬가지였습니다. 한 중국인 상인은 한 신자가 찾아와 여러 해 전 부당하게 얻은 돈을 갚자 크게 놀랐습니다. 교회에서는 술을 끊고 축첩 같은 관습을 버리라는 가르침도 강조되었습니다. 성경을 배우는 사경회와 교회학교도 성장하면서 여성과 아이들이 공부하고 한글을 익힐 기회가 넓어졌습니다. 1908년 장로교와 감리교 계열 학교에 다니던 학생은 전국적으로 만 칠천 명이 넘었습니다. 물론 이런 교육의 변화가 모두 1907년 평양의 집회에서 새로 시작된 것은 아니었습니다. 그러나 자신의 죄를 고백하던 사람들이 이제 이웃에게 진 빚을 갚고 가정과 일터에서의 삶을 바로잡으려 했다는 것은 분명했습니다. 원산에서 시작해 평양으로 이어진 부흥은 그렇게 예배당 밖의 사람들과 사회에도 영향을 남겼습니다."];
const KOREA_SOURCES = [["박용규","『평양대부흥운동』, 하디·원산 부흥과 1907년 장대현교회 사경회 관련 부분"],["R. A. Hardie","남감리교 한국선교회 연례 보고(1903·1904) 및 회고 ‘God’s Touch in the Great Revival’ (1914) — 박용규 인용"],["Graham Lee","‘How the Spirit Came to Pyeng Yang’, The Korea Mission Field (1907년 3월) — 박용규 인용"],["W. L. Swallen","1907년 1월 18일 미국 선교부에 보낸 서신 — 박용규 인용"],["William N. Blair","Gold in Korea (1946), 당시의 기도회와 화해에 관한 회고 — 박용규 인용"],["George S. McCune","1907년 1월 15일 선교부 서신 — 박용규 인용"]];
function addStoryCloseButton(full,details,summary){
  const btn=document.createElement('button');
  btn.type='button';btn.className='revival-close-button';btn.textContent='↑ 다시 접기';
  btn.addEventListener('click',function(){
    details.open=false;
    summary.focus({preventScroll:true});
    // Return to the actual chronology, so the visitor can select another event.
    const track=document.getElementById('timelineViewport');
    const target=track.closest('.panel')||track;
    // Wait for <details> to finish closing and the layout to settle.
    window.requestAnimationFrame(function(){
      if(document.documentElement.classList.contains('atlas-home-embedded')){
        const offset=target.getBoundingClientRect().top+window.scrollY;
        window.parent.postMessage({type:'revival-atlas:focus',offset:offset},window.location.origin);
      }else{
        target.scrollIntoView({block:'start',behavior:'smooth'});
      }
    });
  });
  full.appendChild(btn);
}
function addKoreaFullStory(body){
  // 1903–1907년 원산–평양 부흥: 영상은 상세 대본 바로 위에 표시.
  const film=document.createElement('div');
  film.className='korea-film';
  const player=document.createElement('iframe');
  player.className='korea-player';
  player.src='https://www.youtube-nocookie.com/embed/Ydt79Pe0iz4';
  player.title='원산–평양 대부흥 이야기 영상';
  player.loading='lazy';
  player.referrerPolicy='strict-origin-when-cross-origin';
  player.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  player.allowFullscreen=true;
  film.appendChild(player);
  const link=document.createElement('a');
  link.className='korea-watch-link';
  link.href='https://youtu.be/Ydt79Pe0iz4';
  link.target='_blank';link.rel='noopener noreferrer';
  link.textContent='YouTube에서 영상 보기 ↗';
  film.appendChild(link);
  body.appendChild(film);
  const details=document.createElement('details');
  details.className='revival-story-expand';
  details.setAttribute('data-story-details','korea');
  const summary=document.createElement('summary');
  summary.textContent='이야기 자세히 읽기';
  details.appendChild(summary);
  const full=document.createElement('div');
  full.className='revival-story-fulltext';
  for(const text of KOREA_FULL_STORY){
    const p=document.createElement('p');p.textContent=text;full.appendChild(p);
  }
  const sources=document.createElement('section');
  sources.className='revival-story-sources';
  const h=document.createElement('h4');h.textContent='주요 출처';sources.appendChild(h);
  const ul=document.createElement('ul');
  for(const [author,work] of KOREA_SOURCES){
    const li=document.createElement('li');li.textContent=author+', '+work;ul.appendChild(li);
  }
  sources.appendChild(ul);
  const note=document.createElement('p');
  note.textContent='대본 속 대화는 당시 기록에 전하는 발언을 한국어로 옮긴 것입니다. 정확한 발화 그대로의 녹취록은 아니며, 서신·회고의 시점도 서로 다를 수 있습니다.';
  sources.appendChild(note);
  full.appendChild(sources);
  addStoryCloseButton(full,details,summary);
  details.appendChild(full);body.appendChild(details);
}


const RARITAN_FULL_STORY = ["1720년, 북아메리카 뉴저지의 래리턴 계곡에 네덜란드 개혁교회 목사 테오도루스 야코부스 프릴링하이젠이 부임했습니다. 래리턴강을 따라 농장과 마을이 흩어져 있었고, 그는 여러 회중을 오가며 설교해야 했습니다. 주민들은 오래전부터 교회에 다니고 자녀들에게 교리문답을 가르쳤지만, 프릴링하이젠은 그런 익숙한 신앙생활만으로 충분하다고 생각하지 않았습니다.","1월 31일, 그의 첫 설교는 고린도후서 5장 20절, 하나님과 화목하라는 말씀이었습니다. 교회의 이름을 알고 예배에 참석하는 것과 자신의 죄를 깨닫고 그리스도를 믿는 것은 같지 않았습니다. 그는 하나님의 은혜를 의지하는 믿음과 거기서 나오는 삶의 변화를 거듭 강조했습니다. 회중에게는 오랫동안 익숙했던 신앙을 다시 살펴보라는 도전이었습니다.","이듬해 인쇄된 설교에서도 그는 이사야 66장 2절을 전했습니다. 하나님께서 돌아보시는 사람은 자기 의로움을 자랑하는 사람이 아니라 말씀 앞에 떠는 사람이라는 내용이었습니다. 죄인이 용서받는 근거는 자신의 선행이 아니라 그리스도께 있다는 것이었습니다. 말씀을 들은 사람들 가운데는 자신의 신앙을 새롭게 돌아보고, 죄와 구원에 관해 진지하게 묻는 이들이 생겨났습니다.","갈등도 일어났습니다. 프릴링하이젠은 교회에 이름을 올렸다는 이유만으로 아무런 성찰 없이 성찬에 참여해서는 안 된다고 경고했습니다. 이 권면을 받아들인 사람들도 있었지만, 다른 사람들은 목사가 자기 믿음을 함부로 판단하고 교회 질서를 흔든다고 여겼습니다. 신앙을 새롭게 하려는 설교가 같은 교회 안에서 서로 다른 반응을 불러일으켰습니다.","1723년에는 교인 세 사람이 이웃 지역 목사에게 찾아가 프릴링하이젠의 설교와 교회 운영을 문제 삼았습니다. 교회가 일부 신자를 징계하자 반발은 더욱 깊어졌고, 1725년에는 고발문과 반박문까지 인쇄되었습니다. 다툼은 바다 건너 네덜란드의 교회 당국에도 전달되었습니다. 부흥의 소식과 교회 안의 상처가 같은 시기에 이어지고 있었습니다.","그러나 새롭게 신앙을 고백하는 사람들도 나타났습니다. 훗날 당시 교회 장부를 조사한 자료에 따르면 1726년 프릴링하이젠이 돌보던 여러 교회에 서른여덟 명이 신앙고백을 통해 가입했습니다. 이 숫자가 그해 실제로 회심한 모든 사람의 수는 아닙니다. 그렇지만 설교를 듣고 교회 공동체에 참여한 사람들이 있었다는 구체적인 흔적입니다.","같은 해 뉴브런즈윅에는 젊은 장로교 목사 길버트 테넌트가 부임했습니다. 그는 프릴링하이젠의 설교를 듣고 변화되었다는 사람들을 만나 보았습니다. 그들은 자신이 무엇을 믿는지 설명할 뿐 아니라, 그 믿음이 일상생활에 어떤 변화를 가져왔는지도 이야기했습니다. 테넌트는 그들과의 대화를 통해 자신의 설교와 목회를 돌아보게 되었습니다.","두 목회자는 사용하는 언어와 교단이 달랐지만 서로 교제했습니다. 프릴링하이젠은 사람들의 형편에 맞게 하나님의 말씀을 전하라고 테넌트에게 권했습니다. 두 회중이 함께 예배했다는 이야기는 당시 반대자들의 항의 문서에도 남아 있습니다. 목회자들의 교류를 통해 래리턴의 신앙적 각성은 이웃 지역으로 알려졌습니다.","그 무렵 이 지역에는 신앙의 변화를 자신의 말로 남긴 아프리카 출신 청년이 있었습니다. 우카우사우 그론니오소였습니다. 그는 여러 사람에게 팔려 노예가 되었고, 어느 때엔가 프릴링하이젠의 집으로 들어왔습니다. 목사가 그를 사들인 정확한 해는 분명하지 않습니다. 그론니오소에게 복음을 전한 목회자가 동시에 그의 자유를 소유한 주인이었다는 사실도 이 역사에 남아 있습니다.","프릴링하이젠의 집에서 그론니오소는 아침저녁으로 드리는 기도를 접했습니다. 목사의 아내는 그가 글을 배우도록 학교에 보냈습니다. 그는 점차 책을 읽을 수 있게 되었고, 이제 다른 사람이 읽어 주는 성경을 듣는 데서 그치지 않고 스스로 말씀을 살필 수 있었습니다. 그러나 글을 배워도 그가 놓인 노예의 신분은 달라지지 않았습니다.","어느 주일, 그론니오소는 그리스도께서 다시 오신다는 요한계시록 1장 7절의 설교를 들었습니다. 그 말씀은 그에게 큰 두려움을 안겨 주었습니다. 이어 거룩함이 없이는 아무도 주님을 보지 못한다는 히브리서 12장 14절의 설교를 듣고 자신이 죄인이라는 생각에 더욱 괴로워했습니다. 주변의 모든 사람이 똑같은 경험을 한 것은 아니었습니다. 그 자신이 훗날 그렇게 회상한 것입니다.","그는 오랫동안 그 괴로움을 홀로 견뎠습니다. 그러던 중 하나님의 어린양을 보라는 성경 말씀이 마음에 떠올랐습니다. 그리스도께서 죄인을 구원하신다는 말씀은 그에게 새로운 위로가 되었습니다. 그는 학교에서 자신을 가르쳤던 교사를 찾아가 마음속 일을 털어놓았고, 교사는 그와 함께 기도했습니다.","그론니오소에게는 숲속의 큰 참나무도 기도의 장소가 되었습니다. 나무를 베는 일을 하러 가던 길에 그는 그 아래서 혼자 기도했고, 책을 읽으며 자신의 죄와 하나님의 은혜를 생각했습니다. 두려움으로 시작된 그의 신앙적 고민은 그리스도를 의지하는 소망으로 이어졌습니다. 그가 겪은 일은 수십 년 후 구술한 회고를 통해 알려졌습니다.","1731년, 교회 분쟁에 관해 네덜란드 암스테르담의 교회 당국이 결정을 내렸습니다. 반대자들에게 내려졌던 출교 처분은 무효가 되었습니다. 프릴링하이젠의 설교에 감동받은 사람들이 있었다는 사실과 그의 모든 징계가 정당했다는 주장은 별개의 문제였습니다. 1733년에는 화해 조항이 마련되었고 이듬해 교회에서 읽혔지만, 모든 갈등이 곧바로 사라지지는 않았습니다.","한편 래리턴의 교회들에서는 설교를 듣는 데서 한 걸음 더 나아가 함께 기도하고 성경을 배우는 모임이 이어졌습니다. 프릴링하이젠은 평신도들도 다른 사람을 가르치고 돌보는 일에 참여하도록 도왔습니다. 새로운 신앙고백자들이 해를 거듭해 교회에 들어왔고, 믿음에 관한 대화가 예배당 밖의 생활로 이어졌습니다.","1739년 11월, 영국에서 온 순회설교자 조지 휘필드가 뉴브런즈윅에서 설교했습니다. 그는 그곳에서 프릴링하이젠을 만나고, 이미 이 지역에서 복음을 전하며 수고한 목회자로 높이 평가했습니다. 휘필드가 오기 전부터 래리턴과 뉴브런즈윅에서는 신앙적 각성이 일어나고 있었던 것입니다. 그 소식은 여러 교회의 말씀 사역을 통해 더 멀리 퍼져 갔습니다.","교회 기록을 훗날 조사한 연구에서는 래리턴 회중에 1741년까지 신앙고백을 통해 들어온 사람이 백스무 명가량이었다고 정리합니다. 그것은 모든 회심자의 수를 확정한 통계가 아니라 남아 있는 교회 가입 기록을 바탕으로 한 수치였습니다. 그래도 여러 해에 걸쳐 사람들이 신앙을 새롭게 고백하고 교회 생활에 참여했다는 사실은 확인할 수 있습니다.","1744년, 길버트 테넌트는 보스턴의 토머스 프린스에게 편지를 보냈습니다. 여러 해 전 프릴링하이젠의 설교를 들은 사람들과 대화했을 때, 그들에게서 복음에 대한 이해와 개인적인 신앙 경험, 경건한 생활이 함께 나타났다는 내용이었습니다. 그 사람들은 자신들이 겪은 변화를 프릴링하이젠의 말씀 사역과 연결했습니다. 이처럼 래리턴의 부흥은 회중이 무엇을 믿고 어떻게 살아갔는가에 관한 구체적인 증언을 남겼습니다."];

const RARITAN_SOURCES = [["Theodorus Jacobus Frelinghuysen","Sermons Translated from the Dutch (1856, W. Demarest 역) — 회심·중생·칭의 설교","https://library.logcollegepress.com/Frelinghuysen%2C%2BTheodorus%2BSermons%2BTranslated%2Bfrom%2BDutch.pdf"],["Ukawsaw Gronniosaw","A Narrative of the Most Remarkable Particulars in the Life of James Albert Ukawsaw Gronniosaw (1772) — 당사자의 구술 회고","https://www.gutenberg.org/files/15042/15042-h/15042-h.htm"],["Gilbert Tennent","1744년 8월 24일 Thomas Prince에게 보낸 편지 — 변화된 신자들에 대한 회고 (후대 재수록)","https://www.sermonindex.net/books/writings-of-archibald-alexander/106/"],["Hugh Hastings (ed.)","Ecclesiastical Records of the State of New York, vol. IV — 1723년 교회 갈등과 당대 서신","https://ldsgenealogy.com/NY/books/Ecclesiastical-records-state-of-New-York-Volume-IV-part-7.htm"],["Abraham Messler","Forty Years at Raritan (1873) — 교회 회원 기록에 대한 후대 정리","https://www.seekingmyroots.com/members/files/H005525.pdf"],["Joel R. Beeke · Maarten Kuivenhoven","Experiences of Revival in the Dutch Nadere Reformatie Tradition (2024) — 부흥의 확산과 교회 기록에 관한 현대 연구","https://cf.sbts.edu/equip/uploads/2025/06/SBJT-28.3-Revival-in-the-Dutch-Trad-Beeke-Kuivenhoven.pdf"],["Rutgers University Special Collections","Updates about Ukawsaw Gronniosaw: Frelinghuysen’s Convert (2023) — 노예 소유와 신앙 증언의 역사적 맥락","https://sinclairnj.libraries.rutgers.edu/2023/09/updates-about-ukawsaw-gronniosaw-part-2-frelinghuysens-convert/"],["Christian History Institute","A Dawning in the New World — 길버트 테넌트·조지 휘필드와의 연결에 관한 후대 연구","https://christianhistoryinstitute.org/magazine/article/dawning-in-new-world"]];
function addRaritanFullStory(body){
  // Show the video immediately above the expandable full narrative and sources.
  const film=document.createElement('div');
  film.className='raritan-film';
  const player=document.createElement('iframe');
  player.className='raritan-player';
  player.src='https://www.youtube-nocookie.com/embed/'+new URL(RARITAN_VIDEO_URL).pathname.slice(1);
  player.title='뉴저지 래리턴 부흥 이야기 영상';
  player.loading='lazy';
  player.referrerPolicy='strict-origin-when-cross-origin';
  player.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  player.allowFullscreen=true;
  film.appendChild(player);
  body.appendChild(film);
  const details=document.createElement('details');details.className='revival-story-expand';
  details.setAttribute('data-story-details','raritan');
  const summary=document.createElement('summary');summary.textContent='이야기 자세히 읽기';details.appendChild(summary);
  const full=document.createElement('div');full.className='revival-story-fulltext';
  for(const paragraph of RARITAN_FULL_STORY){const p=document.createElement('p');p.textContent=paragraph;full.appendChild(p);}
  const sources=document.createElement('section');sources.className='revival-story-sources';
  const heading=document.createElement('h4');heading.textContent='주요 출처';sources.appendChild(heading);
  const ul=document.createElement('ul');
  for(const [author,work,link] of RARITAN_SOURCES){
    const li=document.createElement('li');li.append(document.createTextNode(author+', '));
    const a=document.createElement('a');a.href=link;a.textContent=work;a.target='_blank';a.rel='noopener noreferrer';li.appendChild(a);ul.appendChild(li);
  }
  sources.appendChild(ul);
  const note=document.createElement('p');note.textContent='그론니오소의 신앙 경험은 1772년 구술·편집된 회고를 바탕으로 합니다. 교회 장부에 기록된 가입자 수는 회심자 전체를 집계한 통계가 아닙니다. 교회 징계와 노예 소유의 역사적 문제도 별도로 살펴야 합니다.';
  sources.appendChild(note);full.appendChild(sources);
  addStoryCloseButton(full,details,summary);details.appendChild(full);body.appendChild(details);
}

const NORTHAMPTON_FULL_STORY = ["1729년, 북아메리카 매사추세츠의 노샘프턴에서 오랫동안 마을 교회를 이끌어 온 솔로몬 스토다드 목사가 세상을 떠났습니다. 그의 손자 조나단 에드워즈는 할아버지와 함께 사역하다가 이제 교회를 맡게 되었습니다. 코네티컷강을 따라 농장과 집들이 이어진 이 마을에는 약 이백 가구가 살고 있었습니다. 사람들은 예배와 성경에 익숙했지만, 익숙한 신앙이 언제나 삶의 변화로 이어지는 것은 아니었습니다.","마을에는 오랜 갈등이 남아 있었습니다. 청년들 가운데는 밤늦게까지 어울려 놀거나 술집에 드나드는 사람이 많았고, 예배와 가정생활에서도 무질서가 나타났습니다. 그러나 이들의 생활은 서서히 달라지기 시작했습니다. 1733년 무렵 설교와 어른들의 권면을 들은 청년들이 밤늦은 유흥을 삼가겠다고 스스로 동의하면서, 여러 해 이어지던 풍습이 눈에 띄게 줄었습니다.","이 변화가 곧 부흥의 절정은 아니었습니다. 노샘프턴에서 조금 떨어진 파스코머크에서는 자신의 죄와 구원을 진지하게 생각하는 사람들이 나타났습니다. 그러던 1734년 4월, 노샘프턴의 한 젊은 남자가 갑자기 병에 걸려 이틀가량 만에 죽었습니다. 그의 죽음은 또래 청년들에게 큰 충격을 주었고, 뒤이어 전해진 설교는 사람들이 자신의 삶을 돌아보게 했습니다.","얼마 뒤에는 젊은 기혼 여성도 병으로 세상을 떠났습니다. 그는 죽기 전 자신의 구원 문제로 깊이 괴로워했지만, 마지막에는 하나님의 자비에서 위로를 얻었다고 말했습니다. 그리고 곁에 있는 사람들에게 자신의 영혼을 돌아보라고 권했습니다. 두 사람의 죽음 이후, 마을의 대화에는 이전과 다른 질문이 등장했습니다. 하나님 앞에서 자신의 죄를 어떻게 해야 하는가 하는 문제였습니다.","1734년 가을에는 청년들이 설교를 듣고 함께 모여 신앙을 이야기하고 기도하기 시작했습니다. 모임은 여러 집으로 퍼졌고, 나이 든 주민들도 비슷한 모임을 열었습니다. 예배당에서 들은 말씀이 가정과 이웃의 대화로 이어지는 동안, 마을 주변에서는 죄인이 하나님 앞에서 어떻게 의롭다 하심을 받는지를 둘러싼 교리 논쟁이 일어났습니다.","그 논쟁 가운데 에드워즈는 로마서 4장 5절을 본문으로 설교했습니다. 죄인이 하나님께 받아들여지는 근거는 자신의 선행이나 공로가 아니라 예수 그리스도의 의이며, 그 의를 믿음으로 받는다는 내용이었습니다. 바른 생활을 통해 구원의 자격을 얻으려던 사람들에게 그것은 자신의 의지할 곳을 다시 묻게 하는 말씀이었습니다.","설교를 둘러싸고 논란도 있었습니다. 인근에서는 젊은 목회자가 논쟁적인 교리를 강단에 올렸다고 비판했지만, 노샘프턴에서는 자신을 의롭게 만들기 위해 애쓰던 사람들이 하나님의 은혜를 새롭게 생각하기 시작했습니다. 무엇을 얼마나 해야 하나님께 인정받을 수 있는가 하는 고민이, 죄인을 의롭다 하시는 그리스도의 은혜에 관한 질문으로 바뀌고 있었습니다.","1734년 12월 하순, 몇 사람의 회심 소식이 잇따라 전해졌습니다. 그중에는 평소 친구들과 어울리며 유흥을 즐기던 한 젊은 여성도 있었습니다. 그는 자신의 마음이 달라졌다고 에드워즈를 찾아와 이야기했습니다. 이후에도 그 변화가 이어지는 것을 본 목회자는 처음에는 놀랐고, 이 소식이 비웃음거리가 되지 않을까 염려했습니다.","그러나 뜻밖의 일이 일어났습니다. 소문을 들은 청년들이 그 여성을 찾아와 무엇이 달라졌는지 물었습니다. 신앙에 무관심하던 사람들도 이야기를 듣기 시작했습니다. 한 사람의 변화에 관한 소식은 다른 사람을 움직였고, 죄와 구원을 둘러싼 관심은 마을 전체로 빠르게 퍼졌습니다.","그 소식에 마음이 움직인 사람 가운데 아비가일 허친슨이 있었습니다. 몸이 약하고 조용한 젊은 여성이었던 그는 처음에 다른 사람이 먼저 은혜를 경험했다는 말을 듣고 시기심을 느꼈습니다. 그러다가 성경을 읽기 시작했고, 겉으로는 성실하게 살았어도 마음속에는 죄가 깊이 남아 있다고 생각하게 되었습니다. 기도와 성경 읽기마저 하나님께 구원을 얻기 위한 자기 공로가 될 수 없다는 고민도 찾아왔습니다.","어느 월요일 이른 아침, 아비가일은 전과 다른 평안을 느꼈다고 가족에게 말했습니다. 그리스도의 피가 죄를 깨끗하게 한다는 성경 말씀이 마음에 떠올랐고, 자신의 부족함보다 그리스도의 은혜가 충분하다는 사실이 위로가 되었다는 것입니다. 이후 그는 하나님의 선하심과 그리스도의 사랑을 이야기했고, 다른 이들의 구원에도 관심을 기울였습니다. 그의 몸은 여전히 약했지만 가족들은 고통 가운데 나타난 겸손과 이웃을 향한 마음을 기억했습니다.","1735년 겨울과 봄에는 신앙 문제를 상담하려는 사람들이 에드워즈를 찾아왔습니다. 집집마다 성경을 읽고 기도하는 모임이 이어졌고, 오래된 다툼과 험담도 줄어들었습니다. 사람들은 평소 하던 생업을 계속하면서 예배와 말씀을 더 중요하게 여겼습니다. 모두가 일손을 놓고 종교적인 일에만 매달렸다는 외지의 소문은 사실과 달랐습니다.","예배당에서는 자기 죄를 생각하며 우는 사람도, 그리스도의 용서를 생각하며 기뻐하는 사람도 있었습니다. 함께 부르던 시편 찬송이 이전과 다르게 들렸습니다. 그러나 눈물과 기쁨만이 변화의 전부는 아니었습니다. 서로 갈라져 있던 사람들이 적대적인 말을 삼가고, 부모와 자녀, 남편과 아내가 신앙에 관한 이야기를 나누기 시작했습니다.","1735년 3월과 4월, 부흥은 절정에 이르렀습니다. 한 차례 성찬을 앞두고 약 백 명이 새롭게 교회의 성찬 교제에 받아들여졌고, 다음 성찬 전에도 약 예순 명이 받아들여졌습니다. 에드워즈는 약 반 년 동안 삼백 명 이상이 구원의 은혜를 경험했으리라고 추산했습니다. 다만 이것은 모든 사람의 내면을 확인해 집계한 숫자는 아니었습니다. 교회에 들어온 사람의 수와 참된 회심자의 수는 같은 것이 아니었습니다.","변화는 청년들에게만 머물지 않았습니다. 노인들도 자기 신앙을 새롭게 이야기했고, 어린이들 사이에도 기도와 성경에 대한 관심이 나타났습니다. 흑인 주민 가운데서도 신앙의 변화가 보고되었습니다. 이름이 자세히 전해지지 않은 사람들까지 이 움직임에 참여했지만, 그들의 모든 경험을 오늘날까지 알 수 있는 것은 아닙니다.","노샘프턴의 소식은 코네티컷강 계곡을 따라 퍼졌습니다. 직접 찾아와 주민들을 만난 방문객이 돌아가 이야기를 전했고, 다른 지역의 목회자들도 서로 편지를 주고받았습니다. 사우스해들리에서는 1735년 3월부터, 해트필드에서는 4월 둘째 주 무렵부터 마을 전반에 신앙적 관심이 커졌다는 소식이 왔습니다. 서필드와 선덜랜드, 디어필드와 다른 지역에서도 비슷한 변화가 전해졌습니다.","그렇다고 모든 지역의 각성이 노샘프턴에서 시작되어 차례로 옮겨 간 것은 아니었습니다. 어떤 마을에서는 그 소식을 듣기 전부터 비슷한 움직임이 일어나고 있었습니다. 프레스턴의 목회자들은 직접 노샘프턴을 방문해 주민들의 이야기를 듣고, 돌아가 자기 회중에게 전했습니다. 먼 지역의 사람들도 설교와 편지, 방문을 통해 서로의 소식을 알게 되었습니다.","이처럼 신앙에 대한 관심이 높아졌지만, 모든 사람의 경험이 같지는 않았습니다. 어떤 이는 오랫동안 죄책감과 두려움으로 괴로워하다가 위로를 얻었고, 다른 이는 비교적 빠르게 평안을 찾았다고 말했습니다. 어떤 사람에게는 확신이 쉽게 찾아오지 않았습니다. 격렬한 감정이나 특별한 경험이 나타났다는 사실만으로 그 사람의 믿음을 판단할 수는 없었습니다.","1735년 5월 말부터 부흥의 열기는 차츰 약해졌습니다. 6월 1일에는 극심한 우울과 절망으로 고통받던 한 남성이 스스로 목숨을 끊는 비극이 일어났습니다. 후대 자료에서 조지프 홀리로 확인되는 인물입니다. 그는 오랫동안 자신의 신앙 상태를 걱정하고 잠을 이루지 못할 만큼 괴로워했습니다. 이 사건은 마을에 큰 충격을 주었습니다.","그 뒤에도 심한 불안에 시달리거나 자신의 생각을 하나님의 특별한 지시로 오해하는 사람들에 관한 소식이 전해졌습니다. 기쁨과 위로를 이야기하던 공동체 안에 깊은 고통과 혼란도 있었습니다. 부흥이 일어났다는 사실이 그곳의 모든 문제를 사라지게 한 것은 아니었습니다.","6월 27일, 아비가일 허친슨도 오랜 병 끝에 세상을 떠났습니다. 가족과 가까운 사람들은 그가 고통 속에서도 하나님을 의지하고 다른 사람들을 염려했다고 전했습니다. 그의 이야기는 극적인 회심 순간만이 아니라 병이 계속되는 동안의 삶과 마지막 날들까지 남게 되었습니다.","그해 여름 이후에는 스프링필드 교회의 새 목회자 청빙과 안수를 둘러싼 갈등이 지역 교회들 사이로 번졌습니다. 서로를 비판하는 목소리가 커졌고, 이미 약해지고 있던 부흥의 분위기에도 영향을 주었습니다. 예배와 기도는 계속되었지만 처음의 뜨거운 관심은 점차 일상적인 교회생활로 돌아가고 있었습니다.","1736년, 에드워즈는 노샘프턴과 주변 마을에서 일어난 일을 보스턴의 벤저민 콜먼 목사에게 긴 편지로 써 보냈습니다. 그는 사람들의 생활이 어떻게 바뀌었는지, 어떤 회심의 소식이 전해졌는지뿐 아니라 부흥 가운데 일어난 고통과 혼란도 담았습니다. 편지는 그해 11월 6일에 마무리되었습니다.","이 기록은 대서양을 건너 런던의 아이작 와츠와 존 가이즈에게도 전해졌습니다. 1737년에는 『하나님의 놀라운 역사에 관한 신실한 이야기』라는 제목의 책으로 출판되었습니다. 코네티컷강 곁의 작은 마을에서 시작된 이야기가 영국의 교회들에도 알려진 것입니다.","1743년, 처음의 강렬했던 열기가 가라앉은 뒤에도 노샘프턴에는 변화의 흔적이 남아 있었습니다. 젊은이들의 밤늦은 방탕한 모임과 술집 출입이 줄었고, 가난한 이웃을 돌아보려는 마음도 전보다 커졌습니다. 그러나 모든 사람이 끝까지 신실했던 것은 아니며, 마을의 삶이 완전해진 것도 아니었습니다.","노샘프턴 부흥의 가장 오래 남은 증언은 한때 얼마나 많은 사람이 모였는가에 있지 않았습니다. 자기 의를 의지하던 사람들이 그리스도의 은혜를 찾기 시작했고, 그 믿음이 예배당 밖의 말과 행동을 바꾸었습니다. 뜨거웠던 시기는 지나갔지만, 회개와 사랑의 열매가 그 마을에 남았습니다."];

  note.textContent='회심자 수는 에드워즈의 당시 추산입니다. 아비가일 허친슨의 일부 경험은 가족과 주변인들의 증언을 토대로 하며, 조지프 홀리의 이름과 1735년 6월 1일 사망일은 다른 역사 자료로 대조했습니다. 1743년의 평가는 부흥 이후의 회고입니다.';
  sources.appendChild(note);full.appendChild(sources);
  addStoryCloseButton(full,details,summary);
  details.appendChild(full);body.appendChild(details);
}

const EVENTS=[{"id":"stewarton","year":1625,"date":"1625–1630년","century":17,"title":"스튜어턴 부흥","person":"데이비드 딕슨","place":"스코틀랜드 어바인·스튜어턴","topic":"말씀과 회심","tags":["장로교","설교","회심","성찬","기도"],"end":1630,"story":["1618년 어바인에 부임한 데이비드 딕슨은 교회 예배 문제로 추방되었다가 1623년 돌아왔습니다. 그는 장이 서는 월요일마다 주변 마을 사람들에게 설교했고, 주일 저녁에는 죄와 구원의 문제로 고민하는 이들을 돌봤습니다.","스튜어턴 주민들은 목사 윌리엄 캐슬로의 권유로 그 설교를 들으러 왔습니다. 1625년 무렵부터 여러 가정과 교구에서 회개와 신앙생활의 변화가 이어졌습니다. 1630년 쇼츠에서 존 리빙스턴이 설교한 부흥은 이 시기와 연결되지만 별개의 사건입니다."]},{"id":"raritan","year":1720,"date":"1720년대","century":18,"title":"뉴저지 개혁교회 부흥","person":"테오도루스 프릴링하이젠","place":"미국 뉴저지 래리턴","topic":"형식주의와 참된 믿음","tags":["개혁교회","칭의","회심"],"story":["1720년 뉴저지 래리턴 계곡의 네덜란드 개혁교회에 부임한 프릴링하이젠은 형식적인 신앙생활에 머물지 말고 죄를 회개하며 그리스도의 은혜를 의지하라고 설교했습니다. 신앙을 새롭게 고백하는 사람들이 나타났고, 성찬과 교회 징계를 둘러싼 갈등도 깊어졌습니다.","그의 집에서 노예로 살았던 우카우사우 그론니오소의 회고와 길버트 테넌트의 증언, 교회 가입 기록에는 개인의 신앙과 공동체의 변화가 남아 있습니다. 이 운동은 더 넓은 부흥운동과 연결되었지만, 교회의 징계 논란과 목회자의 노예 소유라는 모순도 함께 기억해야 합니다."]},{"id":"northampton","year":1734,"date":"1734–1735년","century":18,"title":"노샘프턴 부흥","person":"조나단 에드워즈","place":"미국 매사추세츠 노샘프턴","topic":"참된 부흥의 열매","tags":["회심","분별","성화"],"end":1735,"story":["1734년 매사추세츠 노샘프턴에서는 청년들의 생활이 달라지기 시작했고, 두 사람의 갑작스러운 죽음으로 죄와 구원의 문제가 새롭게 주목받았습니다. 조나단 에드워즈가 믿음으로 말미암는 칭의를 설교한 뒤, 그해 12월부터 개인의 회심 이야기가 마을에 퍼져 나갔습니다.","1735년 봄에는 예배와 가정 기도 모임이 활발해지고, 그 소식이 코네티컷강 계곡의 여러 마을로 전해졌습니다. 에드워즈가 회심자로 추산한 사람은 300명 이상이었지만 확정 통계는 아니었습니다. 아비가일 허친슨의 회심과 삶, 부흥을 흔든 비극과 갈등까지 당대 기록에 남아 있습니다."]},{"id":"awakening","year":1740,"date":"1740–1742년","century":18,"title":"제1차 대각성운동의 확산","person":"조지 휫필드·조나단 에드워즈","place":"북미 여러 지역","topic":"주권적 은혜와 전도","tags":["전도","설교","주권"],"end":1742,"story":["1730년대에 북미 여러 지역에서 독립적으로 시작된 영적 각성은 1740년 무렵 더 넓은 연결망을 이루었습니다. 영국에서 활동하던 조지 휫필드(George Whitefield)는 대서양을 건너 조지아, 필라델피아, 뉴욕, 보스턴과 뉴잉글랜드 여러 곳을 순회하며 설교했습니다. 그의 이동과 설교 소식은 신문, 일기, 편지, 설교 인쇄물을 통해 광범위하게 전해졌습니다.","1740년 10월 휫필드는 조나단 에드워즈가 목회하던 노샘프턴에 들러 며칠 동안 설교했습니다. 휫필드는 에드워즈의 가정에 머물며 회중을 만났고, 설교 중 사람들이 크게 감동했다는 사실을 자신의 일기에 남겼습니다. 같은 시기 길버트 테넌트 등 다른 설교자들의 순회사역도 여러 교회에 영향을 미쳤습니다. 지역 교회의 기존 목회와 이동 설교자의 활동이 때로 협력했고, 때로는 교회의 질서와 회심을 판별하는 방식을 둘러싼 논쟁도 낳았습니다.","1740–1742년의 움직임은 오늘날 흔히 북미 제1차 대각성운동의 확산기로 불립니다. 그러나 단일한 집회나 한 지도자의 사역으로 이루어진 사건은 아니었습니다. 서로 다른 교회와 지역에서 나타난 변화가 설교, 출판, 여행을 통해 연결되었습니다. 일부 지역에서는 회심과 교회 성장의 보고가 이어졌으나, 다른 곳에서는 과열된 감정적 반응과 교회 분열, 설교자의 자격을 둘러싼 갈등도 나타났습니다. 에드워즈를 비롯한 당시 목회자들은 이 과정에서 진정한 회심과 일시적인 흥분을 어떻게 구별할 것인지 논의했습니다. 광범한 종교적 열정이 곧 참된 회심을 뜻하지는 않기에 신앙고백 이후의 삶과 교회 공동체의 열매도 살펴야 한다는 과제를 남겼습니다."]},{"id":"cambuslang","year":1742,"date":"1742년 2월","century":18,"title":"캠버슬랭 부흥","person":"윌리엄 맥컬록","place":"스코틀랜드 캠버슬랭","topic":"그리스도의 의","tags":["칭의","설교","성례"],"story":["18세기 스코틀랜드 글래스고 남동쪽의 캠버슬랭(Cambuslang)은 장로교회가 지역 주민의 신앙생활에 중심 역할을 하던 교구였습니다. 목사 윌리엄 맥컬록(William McCulloch)은 여러 해 동안 주민들에게 성경을 가르쳤고, 교회 안에서는 기도모임이 이어졌습니다. 그는 신앙적 관심이 생긴 사람들의 말을 직접 듣고 기록했으며, 당시 남긴 상담·관찰 원고 일부가 오늘날까지 전해집니다.","1742년 2월 18일 맥컬록은 예레미야 23장 6절을 본문으로 설교했습니다. 집회가 끝난 뒤 자신의 죄와 구원 문제로 마음이 무거운 사람들이 목회자의 도움을 구했고, 그날 밤 목사관에는 약 50명이 찾아왔다는 증언이 남아 있습니다. 이후 성경 설교와 상담, 기도모임이 잇따랐고, 다른 지역의 목회자들이 지원하러 왔습니다.","그해 여름에는 대규모 설교집회와 성찬 모임이 진행되었습니다. 7월 휫필드도 이 지역을 방문했고, 8월에는 인근 지역의 참석자와 여러 목회자가 함께하는 성찬 모임이 열렸습니다. 신앙적 각성을 경험했다고 말하는 사람들의 수에 대해서는 서로 다른 보고가 있지만, 사건의 중요한 특징은 목회자가 개별 참석자를 면담하고 그 뒤의 변화를 계속 살피려 했다는 점입니다. 당시 상담 기록과 후대 연구는 집회에서 있었던 강한 반응에 그치지 않고 그 후의 신앙생활과 목양을 어떻게 이어 갔는지 보여 줍니다."]},{"id":"kilsyth1742","year":1742,"date":"1742년 5월","century":18,"title":"킬싯 부흥 (1742)","person":"제임스 로브","place":"스코틀랜드 킬싯","topic":"성령의 새 창조","tags":["중생","성례","설교"],"story":["1742년 스코틀랜드 킬싯(Kilsyth)의 목사 제임스 로브(James Robe)는 마을 교회에서 죄와 중생, 그리스도의 구원에 관한 설교를 계속하고 있었습니다. 비슷한 시기 인근 캠버슬랭에서 신앙적 각성이 일어났다는 소식이 전해졌고, 킬싯에서도 말씀을 듣는 사람들의 반응과 상담 요청이 달라지기 시작했습니다.","1742년 5월 로브는 설교 후 양심의 괴로움과 구원 문제를 호소하는 사람들이 늘어났다고 적었습니다. 그는 그달 28일 자신이 파악한 사례를 정리하여 보고했고, 교구 안팎의 참석자들을 면담했습니다. 신앙 상담과 정규 예배가 이어지는 가운데 사람들의 관심은 기도와 성경 공부, 성찬을 중심으로 모였습니다.","6월에는 휫필드가 킬싯을 방문해 많은 군중에게 설교했습니다. 그해 가을에는 여러 목회자가 함께 성찬을 준비하고 말씀을 전하는 집회가 진행되었고, 이러한 움직임은 인근 교구로도 알려졌습니다. 로브는 사건을 문서로 남겨 다른 교회에 알렸습니다. 킬싯에서는 약 한 세기 뒤인 1839년에도 또 다른 부흥이 있었으므로 두 사건은 연도와 담당 목회자가 서로 다른 역사로 구분해야 합니다."]},{"id":"yale","year":1802,"date":"1802년","century":19,"title":"예일대학 부흥","person":"티모시 드와이트","place":"미국 코네티컷 예일대학","topic":"성경의 권위와 회심","tags":["청년","성경","회심"],"story":["18세기 말 예일대학에서는 계몽주의와 프랑스 혁명 이후 확산된 사상의 영향 아래 학생들의 신앙과 대학 예배를 둘러싼 논쟁이 많았습니다. 조나단 에드워즈의 외손자인 티모시 드와이트(Timothy Dwight)는 1795년 총장에 취임해 교육과 예배를 함께 지도했습니다. 그는 일부 학생들이 성경의 권위에 회의적이라는 사실을 알고, 채플에서 성경이 하나님의 말씀인가를 논증하는 설교를 여러 달에 걸쳐 전했습니다.","드와이트의 설교와 학생들의 토론, 신앙 모임은 수년 동안 계속되었습니다. 1802년 봄에는 졸업을 앞둔 두 학생이 공개적으로 그리스도인임을 고백한 뒤 다른 학생들에게도 신앙적 관심이 확산되었습니다. 당시 대학의 인원과 회심자에 관한 수치는 학교 기록과 후대 교회사에 남아 있으며, 박용규는 약 63명의 학생이 회심을 경험했다고 기술합니다.","1802년의 각성운동은 갑작스러운 한 번의 집회만으로 설명되지 않습니다. 몇 년에 걸친 성경 설교, 학생들의 지적 질문, 신앙고백과 상담이 함께 작용했습니다. 이후에도 예일에서는 시기마다 각성운동이 반복되었고, 일부 학생들은 목회와 선교의 길로 나아갔습니다. 당시 학생들의 일기와 대학의 문서들은 캠퍼스 안에서 이러한 변화가 어떻게 받아들여졌는지 살피는 데 도움을 줍니다."]},{"id":"dundee","year":1839,"date":"1839년 7–8월","century":19,"title":"킬싯·던디 부흥 (1839)","person":"윌리엄 찰머스 번즈·로버트 머리 맥체인","place":"스코틀랜드 킬싯·던디","topic":"말씀과 설교자의 도구성","tags":["장로교","목회","설교"],"story":["1830년대 스코틀랜드 던디의 성베드로교회는 젊은 목사 로버트 머리 맥체인(Robert Murray M’Cheyne)의 목회 아래 성장하고 있었습니다. 맥체인은 성경 설교, 성도들의 신앙 상담, 지역 주민에 대한 전도에 힘썼습니다. 1839년 그는 선교 상황을 조사하기 위한 팔레스타인 방문길에 올랐고, 그동안 젊은 설교자 윌리엄 찰머스 번즈(William Chalmers Burns)가 던디의 강단을 맡았습니다.","번즈는 1839년 7월 고향인 킬싯에 머물며 아버지의 교회 사역을 도왔습니다. 7월 23일 설교를 계기로 신앙적 각성이 일어났다는 소식이 퍼졌습니다. 8월 8일 번즈가 던디로 돌아왔을 때 사람들은 킬싯에서 있었던 일을 듣기 원했습니다. 그는 예배 뒤 관심 있는 이들에게 남으라고 했고, 약 100명이 자리를 지켰습니다. 그 모임에서도 기도와 죄의 자각, 신앙 상담이 시작되었다고 기록됩니다.","이후 수 주 동안 던디에서는 저녁집회와 개인 상담이 계속되었고, 다른 교회 목회자들도 참여했습니다. 맥체인이 11월 돌아왔을 때 그는 자신이 직접 이끌지 않은 기간에 교회와 지역에 나타난 변화를 목격했습니다. 번즈는 뒤에 다른 스코틀랜드 지역과 중국에서도 사역했습니다. 1742년 제임스 로브가 관련된 킬싯 부흥과 1839년 번즈가 관련된 킬싯 부흥은 반드시 구분해서 보아야 합니다."]},{"id":"fulton","year":1857,"date":"1857년 9월 23일","century":19,"title":"뉴욕 정오기도 부흥","person":"제레마이아 란피어","place":"미국 뉴욕 풀턴가","topic":"지속적인 기도","tags":["기도","평신도","회심"],"story":["1850년대 뉴욕은 금융업과 상업 활동이 빠르게 성장하던 도시였습니다. 북화란개혁교회에서 평신도 선교사역을 맡았던 제레마이아 란피어(Jeremiah Lanphier)는 분주한 상인과 직장인들이 일터 근처에서 잠시라도 기도할 시간을 마련하고자 했습니다. 그는 점심시간인 정오부터 한 시간 동안 기도회를 열겠다는 전단을 만들어 거리와 사무실에 배포했습니다. 시간이 부족한 사람은 5분이나 10분만 참여해도 된다고 안내했습니다.","1857년 9월 23일 수요일 정오, 란피어는 풀턴가의 교회 건물 3층 강의실 문을 열고 참석자를 기다렸습니다. 처음에는 혼자 기도하다가 모임이 끝나기 전 여섯 사람이 합류했습니다. 다음 주에는 약 20명, 세 번째 모임에는 30–40명, 네 번째 모임에는 약 100명이 모였다고 전해집니다. 참석자가 늘어나자 주간 기도회는 매일 기도하는 모임으로 바뀌었습니다.","뉴욕의 금융 불안과 경기 침체가 겹친 시기에 여러 계층의 사람들이 기도회에 참여했습니다. 정오기도회는 뉴욕의 다른 장소로 퍼져 나갔고, 곧 필라델피아와 보스턴을 비롯한 여러 도시에서도 유사한 모임이 생겨났습니다. 교회 지도자뿐 아니라 일상적인 직업을 가진 평신도들이 시간을 쪼개 참여했다는 점이 기록에 두드러집니다. 당시 발표된 광범위한 회심 통계는 추정치로 구별해서 읽어야 합니다. 이 운동은 기도의 중요성을 생생하게 보여 주지만, 작은 기도회 하나가 정해진 순서대로 대규모 부흥을 일으킨다는 공식으로 해석할 수는 없습니다. 경제적 위기와 기존 교회들의 사역이 함께 있었고, 기도에 대한 응답의 시기와 방식은 인간이 결정할 수 없기 때문입니다."]},{"id":"ulster","year":1859,"date":"1857년 시작 · 1859년 확산","century":19,"title":"얼스터 부흥","person":"제임스 맥퀼킨 외 세 청년","place":"아일랜드 얼스터","topic":"기도와 교회의 갱신","tags":["기도","교회","장로교"],"story":["1850년대 아일랜드 북부 얼스터에서는 산업화와 사회적 긴장 속에 교회들의 신앙생활을 새롭게 하려는 관심이 커지고 있었습니다. 제임스 맥퀼킨(James McQuilkin)은 콜빌 부인의 전도적 대화를 들은 뒤 자기 신앙을 진지하게 돌아보게 되었다고 기록됩니다. 1857년 9월 그는 존 월리스, 로버트 칼라일, 제러마이아 미닐리 등 세 청년과 함께 앤트림주 켈스의 작은 학교에서 정기 기도회를 시작했습니다.","처음 네 명으로 시작한 모임에는 점차 다른 사람들이 합류했습니다. 기도모임은 코너와 인근 마을로 확산되어 1858년 말에는 약 100개 모임이 있었다는 보고가 전해집니다. 미국의 정오기도회 소식도 아일랜드에 전달되었고, 장로교 지도자들이 현지를 방문하고 돌아와 그 경험을 전했습니다. 국내에서 이어진 기도와 해외 소식이 서로 영향을 주고받았습니다.","1859년 봄에는 아호힐과 밸리메나 등 여러 지역에서 대규모 집회와 죄의 고백, 회심의 경험이 보고되었습니다. 학교와 교회는 물론 야외에서도 기도모임이 이어졌고, 당시 목회자 윌리엄 깁슨은 그 경험을 『은혜의 해』(The Year of Grace)에 정리했습니다. 기록에는 강한 감정적 반응과 신체적 현상도 포함되지만, 그것이 모든 회심자에게 나타나야 하는 표지는 아닙니다. 여러 지역의 교회가 기도와 말씀 교육, 방문과 상담을 통해 참여한 역사적 흐름과 이후의 신앙생활을 함께 살펴야 합니다."]},{"id":"korea","year":1903,"date":"1903–1907년","century":20,"title":"원산–평양 대부흥","person":"메리 화이트·루이스 맥컬리·로버트 하디·길선주 등","place":"한국 원산 → 평양","topic":"기도·사경회·회개","tags":["한국","기도","회개"],"end":1907,"story":["1903년 원산에서 루이스 매컬리와 메리 화이트 등이 함께 기도하던 모임이 연합 사경회로 이어졌습니다. 의료 선교사 로버트 하디는 자신의 교만과 믿음의 부족을 동료 선교사들과 한국인 회중 앞에서 고백했습니다. 이후 회개와 기도의 움직임은 여러 지역의 교회와 사경회로 이어졌습니다.","1907년 1월 평양 장대현교회의 겨울 사경회에서는 말씀과 통성기도 가운데 죄를 고백하는 사람들이 나타났습니다. 특히 서로 미워하던 교회 지도자들이 잘못을 인정하고 용서를 구하며 화해했습니다. 당시 선교사들의 편지와 보고서에는 그 밤의 장면과 이후 평양의 교회·학교로 확산된 변화가 남아 있습니다."]},{"id":"wales","year":1904,"date":"1904–1905년","century":20,"title":"웨일스 부흥","person":"이반 로버츠 및 지역 교회 성도들","place":"영국 웨일스","topic":"기도와 삶의 변화","tags":["청년","회개","기도"],"end":1905,"story":["1904년 웨일스는 탄광과 산업도시를 중심으로 큰 사회 변화를 겪고 있었습니다. 교회에서는 오래전부터 기도회와 성경 공부가 진행되었고, 일부 지역에서 신앙적 각성이 시작되었다는 소식이 오갔습니다. 젊은이 이반 로버츠(Evan Roberts)는 이러한 분위기 속에 기도와 회개를 강조하며 지역 교회 모임에 참여했습니다.","1904년 10월 31일 월요일 저녁 러퍼(Loughor)의 모리아 예배당에서 정규 기도회가 끝나자 로버츠는 남아 있던 청년들을 대상으로 모임을 이어 갔습니다. 후대 기록은 당시 어린이 한 명을 포함한 17명이 남았다고 전합니다. 그는 그리스도에 대한 믿음과 기도, 자신의 신앙을 드러내는 고백을 권면했습니다. 이후 노래와 기도가 이어지는 집회 소식은 주변 교회로 빠르게 퍼졌습니다.","1904년 말부터 1905년에 이르기까지 웨일스 여러 지역 교회에서 집회가 이어졌고, 회심과 삶의 변화에 관한 증언이 교회 간행물과 신문을 통해 확산되었습니다. 이 운동은 다른 나라의 교회에도 알려져 기도운동과 영적 각성에 대한 관심을 높였습니다. 그러나 개별 인물이나 극적인 집회 장면만으로 전체 부흥을 설명하기는 어렵습니다. 이안 머리는 당시의 실제 회심과 교회 갱신을 인정하면서도, 이반 로버츠의 역할을 지나치게 부각하거나 개인의 충동에 집회 진행을 맡겨 말씀 설교와 질서 있는 목회적 지도력이 약해진 현상을 비판했습니다. 그에게는 부흥의 열매와 부흥 과정의 무분별한 행동을 구별하는 일이 중요했습니다."]},{"id":"mukti","year":1905,"date":"1905–1906년","century":20,"title":"인도 묵티 부흥","person":"판디타 라마바이","place":"인도 케드가온 묵티 공동체","topic":"성경교육과 전도","tags":["성경","기도","선교"],"end":1906,"story":["19세기 말 인도에서는 여성과 어린이, 어린 나이에 과부가 된 이들의 교육과 생계를 돕는 일이 중요한 사회적 과제였습니다. 판디타 라마바이(Pandita Ramabai)는 마하라슈트라주 케드가온(Kedgaon)에 묵티(Mukti) 공동체를 세워 소녀와 여성들에게 숙식, 교육, 직업훈련과 성경 교육을 제공했습니다. 대규모 기근을 겪은 뒤 보호가 필요한 여성들이 모였고, 공동체의 규모도 커졌습니다.","라마바이는 해외 부흥 소식을 접한 뒤 공동체 안에 정기 기도모임을 장려했습니다. 1905년에는 여성들과 소녀들이 공동체를 위해 기도하고, 주변 마을에 성경의 내용을 전하는 활동에 참여했습니다. 6월 30일 라마바이가 요한복음 8장을 가르치던 자리에서 여러 사람이 자신의 죄를 고백하고 오랜 시간 기도했다는 보고가 남아 있습니다. 관련 문헌에는 당시의 특별한 체험에 관한 다양한 증언도 있으나, 그 성격과 해석은 자료마다 차이가 있습니다.","이후 공동체 안에서는 기도와 신앙 상담이 이어졌고, 일부 여성들은 다른 지역으로 나가 전도와 봉사에 참여했습니다. 묵티의 이야기는 하나의 집회뿐 아니라 여성 교육, 보호 시설 운영, 성경교육과 지역사회 봉사가 함께 있었던 역사로 이해할 필요가 있습니다. 당시 기록은 대부분 참여자와 후원단체의 증언이므로 집회의 규모와 특별한 현상에 대한 숫자·평가는 그 기록의 성격을 감안해 읽어야 합니다. 특히 일부 증언에 등장하는 방언과 환상은 확인 가능한 교육·구호·전도 사역의 역사와 구별해야 하며, 그런 경험을 참된 신앙의 필수 조건으로 일반화할 근거는 없습니다."]},{"id":"asbury","year":1970,"date":"1970년 2월 3일","century":20,"title":"애즈베리 대학 부흥","person":"커스터 레이놀즈와 학생들","place":"미국 켄터키 애즈베리대학","topic":"회개와 간증","tags":["청년","회개","공동체"],"story":["미국 켄터키주 윌모어의 애즈베리대학은 20세기 동안 여러 차례 학생들의 기도와 신앙 갱신 운동을 경험한 학교였습니다. 1970년 2월 3일 화요일 오전 10시 정규 채플에서는 예정된 설교 대신 신앙에 관한 증언을 나누는 시간이 마련되었습니다. 당시 학교 책임자가 출장 중이어서 학감 커스터 레이놀즈(Custer Reynolds)가 예배를 인도했습니다.","레이놀즈는 학생들에게 자신의 신앙 경험을 이야기할 기회를 주었습니다. 처음 한 학생이 앞에 나왔고, 이어 다른 학생들도 죄를 인정하거나 기도 제목과 삶의 변화를 이야기했습니다. 채플이 정해진 시간에 끝나지 않자 학생들과 교수 일부가 계속 남아 찬송하고 기도했습니다. 학교는 정규 수업을 한동안 중단했고, 강당에는 학생들의 증언과 기도모임이 밤낮으로 이어졌습니다.","애즈베리대학의 공식 역사 기록은 그해 연속적으로 이어진 집회를 144시간으로 정리합니다. 모임이 이어지는 동안 참석자와 졸업생들은 다른 교회와 대학에 그 소식을 전했고, 학생들로 구성된 방문 팀이 여러 학교를 찾았습니다. 당시 참가자들의 회고에는 죄 고백, 용서, 화해와 진로에 대한 새 결심이 반복해서 등장합니다. 집회 시간에 관해서는 기록 간 차이가 있으므로 구체적인 숫자보다 전개 과정과 현장 증언을 중심으로 살펴볼 수 있습니다. 며칠 동안 예배가 이어졌다는 사실 자체보다, 그 경험이 이후의 회개와 화해, 신앙생활에 어떤 지속적인 영향을 남겼는지가 부흥을 평가할 때 더 중요합니다."]},{"id":"wheaton","year":1995,"date":"1995년 3월 19일","century":20,"title":"휘튼대학 부흥","person":"브랜디 맥과이어·제임스 한 및 학생들","place":"미국 일리노이 휘튼대학","topic":"회개와 화해","tags":["청년","화해","회개"],"story":["1995년 초 미국 텍사스의 하워드 페인 대학과 주변 교회에서는 학생들의 기도와 회개 모임이 이어졌습니다. 그 소식은 여러 대학에 알려졌고, 일리노이주 휘튼대학의 학생들도 관심을 갖게 되었습니다. 3월 19일 주일 저녁 휘튼대학 피어스 채플에서 열린 세계기독학생교제(World Christian Fellowship) 모임에는 하워드 페인 대학 학생 브랜디 맥과이어(Brandi Maguire)와 제임스 한(James Hahn)이 초청되었습니다.","두 학생은 자신들의 학교에서 경험한 일을 전했습니다. 간증이 끝나고 잠시 조용한 시간이 흐른 뒤 휘튼대학의 한 졸업반 학생이 앞에 나와 자신의 교만을 고백하고 동료들에게 용서를 구했습니다. 이어 다른 학생들도 오랫동안 숨겨 왔던 잘못을 이야기하며 기도를 요청했습니다. 친구들이 그 곁에 모여 기도하고 위로하는 장면이 반복되었고, 모임은 밤늦게까지 계속되었습니다.","휘튼대학에서는 3월 19일부터 며칠 동안 저녁 모임이 이어졌으며, 집회 장소를 옮겨 더 많은 인원을 수용하기도 했습니다. 학교 관계자들은 당시 학생들의 자발적인 참여와 공개적인 화해의 시도를 기록했습니다. 참가자들의 증언과 대학 문서, 이후 진행된 구술사 인터뷰가 남아 있어 1995년 사건은 현장의 변화와 그에 대한 다양한 평가를 함께 살필 수 있습니다. 공개적인 죄 고백이 화해의 계기가 될 수는 있지만, 모든 사적인 죄를 회중 앞에 말해야 한다는 뜻은 아닙니다. 죄의 성격과 피해 관계를 살피고 당사자의 존엄과 사생활을 보호하는 목회적 분별 또한 필요합니다."]}];

}
const W=Math.ceil(positions[positions.length-1]+98);
stage.style.width=W+'px';
// One compact upper lane and two staggered lower lanes.
// Avoid overlap using each card's actual left/right edge, including wide single-line cards.
const lanes=[{top:4,side:-1},{top:112,side:1},{top:178,side:1}];
let usedRight=lanes.map(()=>-10000);
const ticks=[1650,1700,1750,1800,1850,1900,1950];
const atYear=(y)=>{
  if(y<=EVENTS[0].year)return positions[0];
  if(y>=EVENTS[EVENTS.length-1].year)return positions[positions.length-1];
  for(let i=0;i<EVENTS.length-1;i++)if(EVENTS[i].year<=y&&y<=EVENTS[i+1].year){
    const a=EVENTS[i].year,b=EVENTS[i+1].year;
    return positions[i]+(positions[i+1]-positions[i])*((y-a)/(b-a||1));
  }
  return positions[0];
};
ticks.forEach(t=>{const el=document.createElement('div');el.className='tick';el.style.left=atYear(t)+'px';el.innerHTML='<span>'+t+'</span>';stage.appendChild(el)});
EVENTS.forEach((e,i)=>{
  const isInline=e.id==='kilsyth1742'||e.id==='mukti';
  const cardW=e.id==='mukti'?204:(e.id==='kilsyth1742'?158:CARD_W);
  const cardH=isInline?40:CARD_H;
  const left=positions[i]-cardW/2;
  const preference=isInline?[1,2,0]:(i%2===0?[0,2,1]:[2,0,1]);
  const choice=preference.find(n=>left-usedRight[n]>=8)??preference.reduce((best,n)=>usedRight[n]<usedRight[best]?n:best,preference[0]);
  const lane=lanes[choice];usedRight[choice]=left+cardW;
  const cardTop=lane.top+(isInline?(CARD_H-cardH)/2:0);
  const stem=document.createElement('span');stem.className='stem';stem.setAttribute('aria-hidden','true');stem.style.left=(positions[i]-.75)+'px';stem.style.top=(lane.side<0?cardTop+cardH:AXIS_Y)+'px';stem.style.height=(lane.side<0?AXIS_Y-(cardTop+cardH):cardTop-AXIS_Y)+'px';stage.appendChild(stem);
  const dot=document.createElement('span');dot.className='dot';dot.style.left=positions[i]+'px';dot.setAttribute('aria-hidden','true');stage.appendChild(dot);
  const node=document.createElement('button');node.type='button';node.className='event-node'+(isInline?' event-node-inline':'');node.style.width=cardW+'px';node.style.height=cardH+'px';node.style.left=left+'px';node.style.top=cardTop+'px';node.dataset.id=e.id;node.dataset.century=e.century;
  node.setAttribute('aria-label',e.date+' '+e.title+' 상세 보기');node.setAttribute('aria-pressed','false');
  const year=document.createElement('span');year.className='date';year.textContent=e.date;
  const name=document.createElement('span');name.className='name';name.textContent=e.title;
  node.title=e.topic;
  node.append(year,name);
  node.addEventListener('click',()=>selectEvent(e.id,true));stage.appendChild(node);
  allNodes.push({e,node,dot,stem});
});
function updateStatus(){
 const available=allNodes.filter(x=>!x.node.classList.contains('muted')).length;
 document.getElementById('trackStatus').textContent=available+'개 사건';
 document.getElementById('scrollProgress').style.width=(100*viewport.scrollLeft/(viewport.scrollWidth-viewport.clientWidth||1))+'%';
}
function selectEvent(id,bringDetail){
 const index=EVENTS.findIndex(e=>e.id===id); if(index<0)return;
 selectedId=id;const e=EVENTS[index];
 allNodes.forEach(a=>{const b=a.e.id===id;a.node.classList.toggle('active',b);a.node.setAttribute('aria-pressed',String(b));a.dot.classList.toggle('active',b)});
 document.getElementById('detailCount').textContent=(index+1)+' / '+EVENTS.length;
 document.getElementById('detailTitle').textContent=e.date+' · '+e.title;
 const body=document.getElementById('story');
 body.replaceChildren();
 for(const paragraph of e.story){const p=document.createElement('p');p.textContent=paragraph;body.appendChild(p);}
 if(e.id==='stewarton')addStewartonVideoAndStory(body);
 if(e.id==='korea')addKoreaFullStory(body);
 if(e.id==='raritan')addRaritanFullStory(body);
 if(e.id==='northampton')addNorthamptonFullStory(body);
 if(e.id==='wales'){
   const a=document.createElement('a');
   a.className='story-crosslink';
   a.href='./iain-murray-full-summary.html#chapter-6-section-4-u1';
   a.target='_blank';a.rel='noopener noreferrer';
   a.textContent='이안 머리 『성경적 부흥관 바로 세우기』 — 6.4 웨일즈 부흥 비평 읽기 ↗';
   a.setAttribute('aria-label','이안 머리의 웨일즈 부흥 비평 항목 새 창에서 열기');
   body.appendChild(a);
 }
 document.getElementById('prevBtn').disabled=index===0;
 document.getElementById('nextBtn').disabled=index===EVENTS.length-1;
 const target=positions[index]-viewport.clientWidth/2;
 viewport.scrollTo({left:Math.max(0,target),behavior:'instant'});
 if(bringDetail){
  if(document.documentElement.classList.contains('atlas-home-embedded')){
    window.parent.postMessage({type:'revival-atlas:focus',offset:detail.getBoundingClientRect().top+window.scrollY},window.location.origin);
  }else detail.scrollIntoView({behavior:'smooth',block:'start'});
 }
 updateStatus();
}
document.getElementById('prevBtn').addEventListener('click',()=>{let i=EVENTS.findIndex(e=>e.id===selectedId);if(i>0)selectEvent(EVENTS[i-1].id,false)});
document.getElementById('nextBtn').addEventListener('click',()=>{let i=EVENTS.findIndex(e=>e.id===selectedId);if(i<EVENTS.length-1)selectEvent(EVENTS[i+1].id,false)});
viewport.addEventListener('scroll',updateStatus,{passive:true});
viewport.addEventListener('keydown',e=>{const index=EVENTS.findIndex(v=>v.id===selectedId);if(e.key==='ArrowRight'&&index<EVENTS.length-1){e.preventDefault();selectEvent(EVENTS[index+1].id,false)}if(e.key==='ArrowLeft'&&index>0){e.preventDefault();selectEvent(EVENTS[index-1].id,false)}});
document.querySelectorAll('.tab[data-century]').forEach(tab=>tab.addEventListener('click',()=>{
 const value=tab.dataset.century;
 document.querySelectorAll('.tab[data-century]').forEach(n=>{let a=n===tab;n.classList.toggle('active',a);n.setAttribute('aria-pressed',String(a))});
 search.value='';allNodes.forEach(a=>{a.node.classList.remove('muted');a.dot.classList.remove('muted')});
 const match=EVENTS.find(e=>value==='all'||String(e.century)===value);
 if(match)selectEvent(match.id,false);
 updateStatus();
}));
search.addEventListener('input',()=>{
 const q=search.value.trim().toLocaleLowerCase();let first=null;
 allNodes.forEach(a=>{const s=[a.e.title,a.e.person,a.e.place,a.e.topic,a.e.date,...a.e.tags].join(' ').toLocaleLowerCase();const valid=!q||s.includes(q);a.node.classList.toggle('muted',!valid);a.dot.classList.toggle('muted',!valid);if(valid&&!first)first=a.e});
 if(q&&first)selectEvent(first.id,false);
 updateStatus();
});

/* A shared event link points to the main site; the home page opens the atlas and this event. */
const eventCopyButton=document.getElementById('eventCopyButton');
const eventCopyText=document.getElementById('eventCopyText');
let eventCopyTimer;
async function copyEventUrl(){
  const url=new URL('./revival-atlas-share.html',window.location.href);
  url.searchParams.set('event',selectedId);
  let done=false;
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      await navigator.clipboard.writeText(url.href);done=true;
    }
  }catch(_error){}
  if(!done){
    const tmp=document.createElement('textarea');tmp.value=url.href;tmp.readOnly=true;
    tmp.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(tmp);tmp.select();
    try{done=document.execCommand('copy')}catch(_error){}
    tmp.remove();
  }
  if(done){
    eventCopyText.textContent='복사됨 ✓';clearTimeout(eventCopyTimer);
    eventCopyTimer=setTimeout(()=>eventCopyText.textContent='링크 복사',1800);
  }else window.prompt('아래 주소를 복사하세요.',url.href);
}
eventCopyButton.addEventListener('click',copyEventUrl);
function activateSharedEvent(id,bringDetail=true){
  if(id==='shotts')id='stewarton'; // 16사건 시대의 오래된 쇼츠 공유 URL 유지

  if(!EVENTS.some(e=>e.id===id))return;
  selectEvent(id,false);
  const expanded=document.querySelector('#story [data-story-details]');
  if(expanded)expanded.open=true;
  if(bringDetail){
    if(document.documentElement.classList.contains('atlas-home-embedded')){
      window.parent.postMessage({type:'revival-atlas:focus',offset:detail.getBoundingClientRect().top+window.scrollY},window.location.origin);
    }else detail.scrollIntoView({block:'start',behavior:'auto'});
  }
}
function getInitialSharedEvent(){
  const q=new URLSearchParams(location.search).get('event');
  if(q)return q;
  const m=location.hash.match(/^#revival-event-([a-z0-9_-]+)$/);
  return m?m[1]:null;
}
window.addEventListener('message',function(event){
  if(event.source!==window.parent||event.origin!==location.origin)return;
  const data=event.data;
  if(data&&data.type==='revival-atlas:select'&&typeof data.id==='string'){
    activateSharedEvent(data.id,true);
  }
});
window.addEventListener('hashchange',function(){
  const id=getInitialSharedEvent();if(id)activateSharedEvent(id,true);
});

const initialSharedEvent=getInitialSharedEvent();
if(initialSharedEvent)activateSharedEvent(initialSharedEvent,true);
else selectEvent(EVENTS[0].id,false);
</script>
<script>
/* Parent homepage adjusts the expanded frame height; no nested vertical scrollbars. */
(function(){
 if(!document.documentElement.classList.contains('atlas-home-embedded'))return;
 let previousHeight=0;
 const report=function(){
   const main=document.querySelector('main');
   if(!main)return;
   // The iframe viewport may be taller than its content. Measuring body.scrollHeight
   // would include that viewport and prevent the frame from shrinking afterward.
   const h=Math.ceil(main.getBoundingClientRect().bottom + window.scrollY + 2);
   if(Math.abs(h-previousHeight)>1){
     previousHeight=h;
     window.parent.postMessage({type:'revival-atlas:height',height:h},window.location.origin);
   }
 };
 if('ResizeObserver' in window)new ResizeObserver(report).observe(document.querySelector('main'));
 window.addEventListener('load',report);
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(report);
 report();
})();
</script>
