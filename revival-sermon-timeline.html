const STEWARTON_VIDEO_URL = 'https://youtu.be/tO_GuWzkkz0';
const STEWARTON_FULL_STORY = ["1618년, 스코틀랜드 서부 에어셔의 작은 도시 어바인에 새로운 목사가 부임했습니다. 그의 이름은 데이비드 딕슨이었습니다. 어바인은 주변의 여러 마을과 물품을 거래하는 장터가 있는 곳이었습니다. 도시에서 내륙으로 향하면 스튜어턴이라는 마을이 있었고, 스튜어턴의 물길을 따라 여러 가정과 교구가 이어져 있었습니다.","딕슨은 글래스고에서 태어나 글래스고대학교에서 공부한 사람이었습니다. 그는 그곳에서 철학을 가르치다가 어바인 교회의 부름을 받고 목회자가 되었습니다. 대학에서는 학생들에게 학문을 가르쳤지만, 어바인에서는 매주 교회에 모이는 사람들에게 성경을 전해야 했습니다. 그가 부임한 해, 멀리 퍼스에서는 스코틀랜드 교회의 예배를 둘러싼 중대한 결정이 내려졌습니다.","잉글랜드와 스코틀랜드의 왕관을 함께 쓴 제임스 왕은 스코틀랜드 교회를 감독들의 권위 아래 더 강하게 두려고 했습니다. 1618년 퍼스의 교회 총회에서는 성찬을 받을 때 무릎을 꿇는 일과 특정한 절기를 지키는 일 등을 포함한 다섯 가지 조항이 받아들여졌습니다. 그 조항들은 왕과 감독들의 요구를 반영하고 있었습니다. 스코틀랜드 종교개혁 이후 성경에 따라 예배하고 교회를 다스리고자 했던 많은 목회자에게 이 변화는 받아들이기 어려운 일이었습니다. 1621년에는 그 조항을 법으로 뒷받침하는 결정까지 이어졌습니다.","딕슨도 처음부터 이 문제에 관해 확고한 반대 입장을 세웠던 것은 아니었습니다. 그는 조항들을 자세히 살폈고, 검토할수록 교회의 예배에 그런 요구를 강제로 부과해서는 안 된다고 판단했습니다. 어바인의 설교자가 자신의 입장을 공개적으로 밝히자, 교회를 통제하던 감독들의 시선이 그에게 향했습니다. 그는 이제 교회의 강단뿐 아니라 교회 밖의 법정에서도 자신의 신념을 설명해야 했습니다.","그 무렵 스코틀랜드의 목회자들 가운데는 교회가 처한 상황을 두고 함께 기도하는 이들이 있었습니다. 1621년 에든버러 부근에서 열린 한 기도모임에는 딕슨도 참여했습니다. 그 자리에 함께 있었던 존 리빙스턴은 훗날 딕슨이 약 두 시간 동안 기도한 일을 회고했습니다. 감독들의 압박이 점점 강해지던 시기, 목회자들은 흩어진 교회들과 예배의 자유를 위해 함께 기도하고 있었습니다.","1622년 초, 딕슨에게 에든버러의 고등교회위원회 법정에 나오라는 명령이 내려졌습니다. 그가 법정에 서기 전 주일, 어바인 교회에는 그를 통해 마지막 설교를 들을지도 모르는 회중이 모였습니다. 딕슨은 처음 어바인에서 사역을 시작할 때 고린도후서 5장 11절, 주를 두려워하므로 사람들을 권한다는 말씀으로 설교한 적이 있었습니다. 떠날 가능성을 앞둔 이번 주일에는 그 말씀에 이어지는, 하나님 앞에 드러난 사람이라는 뜻의 구절을 전했습니다. 후대의 전기는 그 이별 설교를 들은 회중이 깊은 감동을 받았다고 전합니다.","이윽고 딕슨은 에든버러의 고등교회위원회에 출석했습니다. 감독들은 그의 항의 문서와 감독들의 권위를 인정하지 않는 태도를 문제 삼았습니다. 딕슨에게는 제출한 문서를 거두라는 요구가 있었고, 법정에서는 거친 비난이 오갔습니다. 후대에 전해 내려오는 심문 기록에는 법정에서 오간 말도 남아 있습니다. 딕슨은 “저는 반역자가 아닙니다. 왕의 신민으로서 법에 따른 대우를 요구할 뿐입니다”라고 답했습니다. 왕에게 순종하겠느냐는 질문에는 “주 안에서 모든 일에 왕에게 순종하겠습니다”라고 했습니다. 감독들은 그가 대답에 단서를 붙인다고 비난했습니다. 그러나 그가 법정에 제출한 입장은 철회되지 않았습니다.","결국 판결이 내려졌습니다. 딕슨은 어바인에서의 목회사역을 박탈당했고, 정해진 기간 안에 북동부의 터리프로 가라는 명령을 받았습니다. 어바인에서 목회한 지 몇 해 되지 않은 그에게 자신의 교회와 교인들을 떠나라는 결정이 내려진 것입니다. 후대 전기에 전해지는 판결문은 그에게 스무 날 안에 터리프로 가라고 명령합니다. 딕슨은 그 자리에서 “주님의 뜻이 이루어지기를 바랍니다. 여러분이 저를 내쳐도 주님은 저를 받아 주실 것입니다”라고 답한 것으로 전해집니다.","딕슨이 바로 북쪽으로 떠난 것은 아니었습니다. 어바인과 가까운 지역의 에글린턴 백작이 그를 돕기 위해 나섰습니다. 백작은 딕슨이 잠시 자신의 영지에 머물면서 설교할 수 있도록 허락을 얻었습니다. 그러자 어바인과 주변 지역의 사람들이 그 설교를 들으러 찾아왔습니다. 사람들이 모인 곳은 귀족의 홀과 그 뜰이었습니다. 마을 교회에서 쫓겨난 목사의 설교가 이번에는 귀족의 영지에서 이어졌습니다. 이 기간은 약 두 달 동안 계속되었습니다.","그곳에도 다시 명령이 내려졌습니다. 딕슨은 더 이상 에글린턴에 머물 수 없었습니다. 그는 스코틀랜드 북동부의 터리프로 향했습니다. 어바인에서 떨어진 곳에 머물게 되었지만 그의 설교는 멈추지 않았습니다. 터리프의 목사 토머스 미첼은 딕슨에게 설교할 기회를 주었습니다. 어바인에서 시작한 목회사역이 뜻하지 않게 다른 지역으로 옮겨진 시간이었습니다.","한편 어바인 교인들과 에글린턴 백작은 딕슨이 돌아올 수 있도록 계속 요청했습니다. 그에게 이전의 항의 문서를 철회한다면 복귀할 수 있다는 제안도 전달되었습니다. 그러나 딕슨은 그 문서를 거두지 않았습니다. 문서를 누군가 대신 가져가는 정도로 문제를 처리할 수 있다는 제안까지 있었지만, 그는 자신의 공개적인 입장을 그렇게 바꾸지 않았습니다. 다시 터리프로 돌아갈 생각으로 길을 나선 일도 전해집니다.","1623년 7월 무렵, 오래 이어진 청원의 결과로 길이 열렸습니다. 딕슨은 항의 문서를 철회하지 않은 채 어바인에 돌아오도록 허락받았습니다. 한때 교회를 떠나야 했던 목사는 다시 자신에게 맡겨진 회중에게 돌아왔습니다. 뒤이어 어바인에서 나타난 일들은 그의 재판보다 훨씬 오랫동안 사람들의 기억에 남았습니다.","어바인에서는 월요일마다 장이 열렸습니다. 주변 마을 사람들이 물건을 팔고 사기 위해 이 도시를 찾았습니다. 딕슨은 이들이 어바인에 오는 날을 설교의 기회로 삼았습니다. 월요일 설교는 장이 본격적으로 시작되기 전에 마칠 수 있도록 마련되었습니다. 사람들은 장터에서 거래를 하기 앞서 교회에서 말씀을 들을 수 있었습니다. 주일이 아닌 날에도 많은 사람이 교회로 모이기 시작했습니다.","그 가운데에는 스튜어턴에서 온 사람들이 있었습니다. 스튜어턴 교회를 맡고 있던 목사 윌리엄 캐슬로는 교인들이 어바인에 가서 딕슨의 설교를 듣도록 격려했습니다. 어떤 이들은 장터에 내놓을 물건을 가지고 길을 나섰지만, 어바인에 오는 중요한 이유 가운데 하나는 이제 설교를 듣는 일이었습니다. 스튜어턴 주민들이 어바인의 월요일 모임에 참석하고, 그들의 소식이 다시 스튜어턴으로 돌아갔습니다. 어바인의 설교와 스튜어턴의 교회생활이 그렇게 연결되었습니다.","월요일마다 설교를 들으러 오는 사람들이 늘어났습니다. 멀리서 찾아온 사람도 있었습니다. 딕슨의 목회사역 가까이에서 지내기 위해 아예 어바인으로 이주한 사람들도 있었다고 전해집니다. 후대 전기들은 월요일 교회에 모인 사람이 주일만큼 많았고 때로는 그보다 더 많았다고 기록했습니다. 장이 서는 날마다 물건을 거래하려는 사람들과 설교를 들으려는 사람들이 같은 도시로 모여드는 일이 반복되었습니다.","사람들이 딕슨을 찾는 시간은 교회의 정규 예배로 끝나지 않았습니다. 주일 저녁이면 설교를 듣고 자신의 신앙 문제로 어려움을 겪는 사람들이 딕슨의 집으로 찾아왔습니다. 죄를 깨닫고 괴로워하는 사람들, 자신에게 구원의 소망이 있는지 확신하지 못하는 사람들, 성경의 약속을 어떻게 이해해야 할지 몰라 도움을 구하는 사람들이었습니다. 딕슨은 그들의 형편을 듣고 답하는 데 한두 시간을 쓰곤 했습니다. 그는 낙심한 사람들을 위로하고, 혼란스러워하는 사람들에게 성경을 따라 길을 설명했습니다.","목사관에는 여러 사람이 모일 수 있는 큰 방이 있었습니다. 딕슨이 교회에서 돌아오기를 기다리는 신자들이 그곳에 수십 명씩 모이기도 했습니다. 어떤 기록에는 한꺼번에 백 명이 넘는 사람이 모였다는 전승도 남아 있습니다. 설교자가 강단에서 내려온 뒤에도 사람들의 이야기는 계속되었습니다. 공개적인 설교를 들었던 이들은 이제 자신의 양심과 믿음, 죄와 용서에 관해 더 구체적으로 이야기하고 있었습니다.","그 설교와 상담의 흐름 속에서 스튜어턴 주민들 사이에 심상치 않은 변화가 나타났습니다. 1625년 무렵부터라고 전해지는 일이었습니다. 교회에 다니는 데 익숙했던 사람들이 자신의 죄를 이전과 달리 깊이 의식하기 시작했습니다. 신앙에 무관심했던 사람들도 설교를 듣고 마음의 평안을 잃었다고 호소했습니다. 어떤 사람은 자신의 지난 생활을 돌아보며 깊이 괴로워했고, 어떤 사람은 하나님 앞에서 자신이 어떤 처지에 있는지 알고자 목회자를 찾았습니다. 이 변화는 스튜어턴 교구에만 머물지 않았습니다.","일부 사람들은 이 낯선 움직임에 별명을 붙였습니다. ‘스튜어턴의 병’이라는 말이었습니다. 사람들은 마치 병이라도 퍼지는 듯 죄를 두려워하고 구원을 걱정하는 이들을 그렇게 불렀습니다. 그것은 실제 의학적인 전염병의 이름이 아니라, 당시의 영적 각성을 조롱하던 사람들 사이에서 생긴 표현이었습니다. 그 별명은 훗날 부흥을 기록한 역사책에까지 남았습니다.","스튜어턴을 지나가는 물길 양쪽의 마을과 가정들에서도 비슷한 변화가 알려졌습니다. 어느 한 날, 한 사람이 모인 사람들을 모두 움직인 사건이 아니었습니다. 주일마다 설교가 이어졌고, 평일에도 사람들이 말씀을 들으러 갔습니다. 그들이 다시 자기 교회와 가정으로 돌아간 뒤에는 다른 사람이 그들의 신앙과 생활의 변화를 보게 되었습니다. 그렇게 부흥의 소식은 가까운 마을을 지나 더 넓은 지역으로 퍼졌습니다.","그 무렵의 설교를 들은 사람 가운데에는 자신의 죄에 대한 두려움 때문에 몸을 가누지 못한 이들도 있었습니다. 일부는 교회 안에서 쓰러져 밖으로 옮겨졌다고 전해집니다. 스튜어턴과 어바인의 부흥을 비교적 이른 시기에 기록한 로버트 플레밍은 그런 일을 겪은 이들 가운데 이후 신앙생활이 견실하게 이어진 사람들이 있었다고 전했습니다. 그러나 모든 사람에게 같은 일이 일어난 것은 아니었습니다. 어떤 사람들은 격한 감정적 반응 없이 죄와 구원에 대해 진지하게 생각하고 생활을 바꾸어 갔습니다.","딕슨과 주변의 다른 목회자들은 예배 중의 강렬한 반응만을 붙잡고 머물지 않았습니다. 그들은 신앙 때문에 괴로워하는 사람들을 만나 말씀을 가르치고, 위로와 권면이 필요한 이들을 돌봤습니다. 동시에 지나친 행동으로 집회와 가정에 혼란을 가져오는 사람들도 있었습니다. 일부 사람들의 행동이 운동 전체를 비난하는 구실이 되자 목회자들은 그러한 행동을 바로잡으려 했습니다. 교회에는 위로가 필요한 이들과 신중히 살펴야 할 이들이 함께 있었습니다.","새롭게 신앙을 고백하는 사람들이 있었다는 소식은 널리 퍼졌습니다. 오랫동안 종교를 가볍게 여기던 사람들 가운데 생활이 바뀌었다는 증언도 나왔습니다. 한 교회에서 시작된 관심이 다른 교구의 예배와 기도모임으로 이어졌습니다. 성찬 예배를 위해 어바인을 찾아오는 신자들도 많아졌습니다. 딕슨의 사역을 들으려고 스코틀랜드의 다른 지역에서 온 사람들은 그곳의 회중과 함께 예배에 참여했습니다. 명성이 퍼졌지만, 딕슨은 자신의 사역을 과장하지 않았습니다. 그는 이전 세대 에어에서 존 웰치가 목회할 때 나타난 변화와 견주어, 어바인의 풍성한 수확도 그때의 남은 이삭에 미치지 못한다는 취지로 말한 적이 있다고 전해집니다.","변화는 지역 귀족들에게도 전해졌습니다. 딕슨이 추방되었을 때 그를 보호한 에글린턴 백작 가문은 여전히 이 움직임에 관심을 두고 있었습니다. 특히 백작부인은 신앙적 각성을 경험한 사람들을 돕고 격려했습니다. 후대에 보존된 이야기에는 백작부인이 남편에게 사냥과 매사냥을 잠시 뒤로하고 그런 사람들을 직접 만나 보도록 권했다는 내용이 나옵니다. 백작은 그들과 대화를 나눈 뒤, 그들이 신앙에 관해 말하는 지혜에 놀라움을 나타냈다고 전해집니다. 이름이 알려지지 않은 지역 주민들의 변화가 귀족 가문 안에서도 이야깃거리가 된 것입니다.","이 시기 스튜어턴에서는 윌리엄 캐슬로가 자기 회중을 계속 돌보고 있었습니다. 부흥의 중심적인 설교자로 이름을 남긴 사람은 어바인의 딕슨이었지만, 스튜어턴 사람들이 참여한 교회 모임과 신앙생활은 그 지역 목회자의 돌봄 아래에서도 계속되었습니다. 어바인과 스튜어턴을 오가며 말씀을 들었던 사람들의 변화가 두 교구의 역사 속에 함께 남았습니다. 그곳에서 처음 일어난 각성이 어떻게 정확히 시작되었는지, 첫 회심자의 이름이 누구인지는 전해지지 않습니다. 남아 있는 것은 몇 사람의 이름보다 훨씬 넓은 지역에서 여러 해 지속된 모임과 변화에 관한 증언입니다.","1620년대가 저물어 가는 동안에도 그 움직임은 계속되었습니다. 후대의 기록은 주일마다 회심의 증거가 나타나는 일이 드물지 않았고, 어바인과 스튜어턴에서 시작된 각성이 주변 지역으로 이어졌다고 전합니다. 멀리서 실제로 어떤 일이 일어나고 있는지 보려고 찾아온 사람들도 있었습니다. 어느 사람에게는 스튜어턴의 소식이 이해하기 어려운 일이었고, 어느 사람에게는 자신의 신앙을 다시 돌아보게 하는 일이었습니다.","그러나 강렬한 반응이 나타난 모든 사람의 삶이 끝까지 달라진 것은 아니었습니다. 당시를 기억하던 한 신자는 나중에 어떤 이들에게는 참된 회심으로 이어진 변화가 있었지만, 다른 이들에게는 시간이 지나면서 그 열심이 사라지고 이전 생활로 돌아가는 모습도 있었다고 증언했습니다. 그 회고는 여러 사람을 거쳐 1727년 로버트 워드로의 기록에 남았습니다. 그 때문에 스튜어턴의 이야기는 모든 사람이 한순간에 똑같이 변했다는 이야기로 남지 않았습니다. 오래 신앙을 지킨 사람들과 한때의 감동에 머문 사람들이 모두 그 시대에 있었습니다.","1630년 무렵, 스코틀랜드 서부의 이 부흥은 이미 여러 해 동안 이어진 역사로 기억되고 있었습니다. 딕슨은 여전히 어바인에서 성경을 전하고, 성찬 예배를 인도하고, 자신의 영혼에 대해 고민하는 사람들을 돌보고 있었습니다. 감독들의 압박도 완전히 사라지지 않았습니다. 그가 법정의 명령으로 어바인을 떠나야 했던 일이 있었지만, 돌아온 뒤에는 같은 강단에서 오랫동안 목회할 수 있었습니다.","스튜어턴에서 여러 해 동안 영적 각성이 이어지던 시기, 젊은 설교자 존 리빙스턴도 스코틀랜드 여러 교구의 성찬모임을 다니며 성경을 전했습니다. 그는 당시 교회의 예배 문제를 둘러싼 갈등 속에서 정식 목사 안수를 받지 못한 상태였습니다. 훗날 그의 회고에는 스튜어턴에서 신앙의 변화를 경험한 신자들과 교제한 경험도 등장합니다. 그렇다고 스튜어턴에서 일어난 일이 그대로 다른 교구에 옮겨졌다고 단정할 수는 없습니다. 사람들과 말씀 사역이 연결된 것은 사실이지만 각 교구의 모임에는 저마다의 과정이 있었습니다.","1630년 6월 20일, 스코틀랜드 라나크셔 쇼츠 교구에서는 성찬예배가 거행되었습니다. 리빙스턴은 이전에도 그곳에 초청받아 설교한 일이 있었고, 이번 성찬모임에도 참석했습니다. 그날 밤 신자들 가운데 일부는 함께 모여 기도하고 신앙에 관한 대화를 이어 갔습니다. 리빙스턴은 다른 인물 회고에서 엘리자베스 멜빌, 곧 컬로스 부인이 이튿날 아침 오래 기도한 일도 전했습니다. 그녀가 기도하던 방으로 사람들이 모여들었고, 리빙스턴의 기록에는 기도가 세 시간가량 이어졌다고 적혀 있습니다. 이는 그 모임에 여러 사람의 기도와 참여가 있었음을 보여 줍니다.","이튿날인 6월 21일 월요일 아침, 리빙스턴은 여러 목회자와 신자들 앞에서 설교해야 한다는 생각에 마음이 무거웠습니다. 그는 자신의 약함과 부족함을 생각하며 설교를 피하고 싶었다고 훗날 기록했습니다. 그러나 마침내 쇼츠 교회 묘역에 모인 회중 앞에 서서 에스겔 36장 25절과 26절을 본문으로 설교했습니다. 하나님께서 더러운 것을 씻으시고 새 마음을 주시겠다는 말씀이었습니다. 그 자신의 회고에 따르면 준비한 내용을 약 한 시간 반 동안 전했고, 이어 회중에게 권면과 경고를 전하는 데 약 한 시간을 더 사용했습니다.","리빙스턴은 그날을 평생의 설교 가운데 특별히 기억했습니다. 하지만 그가 날마다 같은 경험을 한 것은 아니었습니다. 그는 그 주 목요일 킬마녹에서도 설교했지만, 다음 월요일 어바인에서는 미리 준비한 말씀을 제대로 전하지 못해 크게 낙심했다고 적었습니다. 한동안 그곳에서 설교를 쉬려고 하자 어바인의 데이비드 딕슨이 그를 그냥 보내지 않았습니다. 딕슨의 권면에 따라 리빙스턴은 다음 주일 다시 강단에 섰습니다. 쇼츠의 설교자 리빙스턴과 어바인의 목회자 딕슨은 이 사건에서 직접 만나게 됩니다.","1637년, 스코틀랜드 교회의 예배를 둘러싼 갈등이 다시 크게 일어났습니다. 딕슨은 어바인 노회의 목회자들과 함께 강제로 도입하려는 예배서의 시행을 중단해 달라고 청원하는 일에 참여했습니다. 1638년에는 스코틀랜드 교회의 총회에서도 활동했습니다. 그는 예배와 교회의 다스림을 둘러싸고 자신의 입장을 밝히며 여러 목회자들과 함께 일했습니다. 어바인에서 한때 설교할 권리를 빼앗겼던 목사가 다시 스코틀랜드 교회의 중요한 논의에 참여하게 된 것입니다.","그 후 딕슨은 글래스고에서 목회자를 양성하는 일을 맡았습니다. 젊은 시절 대학에서 철학을 가르쳤고, 어바인에서 오랫동안 설교하고 목회했던 그는 다시 학생들을 가르치는 자리로 옮겨 갔습니다. 그러나 스튜어턴의 이름은 그가 다른 일을 맡은 뒤에도 사라지지 않았습니다. 1669년 로버트 플레밍은 이 부흥을 기록하면서 당시를 기억하고 있던 목회자들과 신자들의 증언을 전했습니다. 그는 그 움직임이 짧은 기간에 끝나지 않고 여러 해 동안 지역에서 지역으로 퍼졌다고 남겼습니다.","그 후 스코틀랜드 목회자 로버트 플레밍은 쇼츠에서 설교를 들었던 사람들 가운데 약 오백 명이 회심하거나 이전의 신앙을 새롭게 굳게 하였다는 증언을 전했습니다. 이는 그날 새 회심자만 직접 세어 만든 통계가 아니며, 모든 참석자의 이후 삶이 똑같이 확인되었다는 뜻도 아닙니다. 스튜어턴에서는 여러 해 동안 지역 교회와 주민들의 변화가 기록되었고, 쇼츠에서는 성찬모임 뒤에 행한 한 차례의 설교가 특별히 기억되었습니다. 두 사건은 서로 다른 장소와 양상으로 전개되었지만, 17세기 스코틀랜드에서 기도와 말씀을 통해 일어난 영적 각성을 함께 살펴볼 만한 인접한 역사입니다.","어바인에는 월요일마다 장이 서던 날들이 있었습니다. 스튜어턴 사람들은 그날 거래할 물건과 함께 어바인을 찾았고, 장이 시작되기 전에는 설교를 들었습니다. 주일 저녁에는 딕슨을 기다리며 목사관에 사람들이 모였습니다. 스튜어턴의 교회와 가정에서는 죄와 용서, 회심과 믿음에 관한 이야기들이 이어졌습니다. 어떤 사람은 오래도록 달라진 생활을 이어 갔고, 어떤 사람은 이전의 모습으로 돌아갔습니다. 여러 해가 지나 사람들의 이름과 개별적인 사연이 대부분 잊힌 뒤에도, 어바인의 설교와 스튜어턴의 부흥을 함께 기억하는 기록은 남았습니다."];
const STEWARTON_SOURCES = [["John Howie","Biographia Scoticana (Scots Worthies), “The Life of Mr. David Dickson”","https://biblehub.com/library/howie/biographia_scoticana_scots_worthies/the_life_of_mr_david_3.htm"],["Robert Fleming","The Fulfilling of the Scripture (1669) — 이안 머리 The Puritan Hope 수록·인용","https://revival-library.org/histories/1600-revival-the-puritan-hope/"],["Robert Chambers","Domestic Annals of Scotland, vol. II — 워드로가 수집한 전승 포함","https://www.gutenberg.org/cache/epub/73695/pg73695-images.html"],["T. F. Henderson","Dictionary of National Biography (1888), “Dickson, David”","https://en.wikisource.org/wiki/Dictionary_of_National_Biography,_1885-1900/Dickson,_David_(1583%3F-1663)"],["John Livingstone","A Brief Historical Relation / Select Biographies, vol. 1, pp. 138–139 — 쇼츠 설교 및 어바인에서 딕슨의 권면","https://www.iment.com/maida/familytree/henry/bios/jl/jl-lifeofjohnlivingstone-p138-139.htm"],["John Livingstone","Memorable Characteristics, Elizabeth Melville (Lady Culross) — 쇼츠 성찬모임과 기도에 대한 당사자 기록","https://www.stranraerrpcs.org/news/2021/8/10/livingstone-lady-culross-amp-the-kirk-of-shotts-revival"],["John Howie","Biographia Scoticana, The Life of Mr John Livingston — 쇼츠와 딕슨의 연관 및 후대 증언","https://biblehub.com/library/howie/biographia_scoticana_scots_worthies/the_life_of_mr_john_8.htm"]];
function addStewartonVideoAndStory(body){
  const videoBox=document.createElement('div');
  videoBox.className='stewarton-film';
  const raw=STEWARTON_VIDEO_URL.trim();
  if(raw){
    try{
      const u=new URL(raw,window.location.href);
      let youtubeId='';
      const host=u.hostname.toLowerCase();
      if(host==='youtu.be')youtubeId=u.pathname.split('/')[1]||'';
      if(host==='youtube.com'||host==='www.youtube.com'||host==='m.youtube.com'||host==='www.youtube-nocookie.com'){
        youtubeId=u.searchParams.get('v')||(u.pathname.match(/^\/(?:embed|shorts|live)\/([a-zA-Z0-9_-]{11})/)||[])[1]||'';
      }
      if(/^[a-zA-Z0-9_-]{11}$/.test(youtubeId)){
        const iframe=document.createElement('iframe');
        iframe.className='stewarton-player';
        iframe.src='https://www.youtube-nocookie.com/embed/'+youtubeId;
        iframe.title='스튜어턴·어바인 부흥 이야기 영상';
        iframe.loading='lazy'; iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share'; iframe.allowFullscreen=true;
        videoBox.appendChild(iframe);
      }else if(/\.(mp4|webm)(?:$|[?#])/i.test(u.href)){
        const v=document.createElement('video');
        v.className='stewarton-player';v.src=u.href;v.controls=true;v.playsInline=true;v.preload='metadata';
        v.setAttribute('aria-label','스튜어턴·어바인 부흥 이야기 영상');videoBox.appendChild(v);
      }else{
        const a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';
        a.textContent='스튜어턴·어바인 부흥 영상 보기 ↗';videoBox.appendChild(a);
      }
    }catch(_){
      const p=document.createElement('div');p.className='stewarton-video-pending';
      p.textContent='영상 연결 주소를 확인해 주세요.';videoBox.appendChild(p);
    }
  }else{
    const p=document.createElement('div');p.className='stewarton-video-pending';
    p.textContent='이야기 영상은 링크를 등록하면 이곳에서 바로 재생됩니다.';videoBox.appendChild(p);
  }
  body.appendChild(videoBox);
  const details=document.createElement('details');details.className='revival-story-expand';details.setAttribute('data-story-details','stewarton');
  const summary=document.createElement('summary');summary.textContent='이야기 자세히 읽기';
  details.appendChild(summary);
  const full=document.createElement('div');full.className='revival-story-fulltext';
  for(const line of STEWARTON_FULL_STORY){const p=document.createElement('p');p.textContent=line;full.appendChild(p);}
  const sources=document.createElement('section');sources.className='revival-story-sources';
  const h=document.createElement('h4');h.textContent='주요 출처';sources.appendChild(h);
  const ul=document.createElement('ul');
  for(const [author,work,link] of STEWARTON_SOURCES){
    const li=document.createElement('li');li.append(document.createTextNode(author+', '));
    const a=document.createElement('a');a.href=link;a.target='_blank';a.rel='noopener noreferrer';a.textContent=work;
    li.appendChild(a);ul.appendChild(li);
  }
  sources.appendChild(ul);
  const note=document.createElement('p');
  note.textContent='스튜어턴의 일부 발언과 쇼츠 부흥의 회심자 수에는 후대 기록과 전승이 포함됩니다. 1630년 쇼츠는 스튜어턴과 동일한 사건이 아니라 연관된 별도 성찬모임으로, 기존 스튜어턴 영상에는 쇼츠 장면이 포함되어 있지 않습니다.';
  sources.appendChild(note);
  full.appendChild(sources);addStoryCloseButton(full,details,summary);details.appendChild(full);body.appendChild(details);
}

const KOREA_FULL_STORY = ["1903년 여름, 조선 동해안의 항구도시 원산에는 서로 다른 선교회에 속한 여성 선교사들이 있었습니다. 캐나다 장로교의 루이스 매컬리와 남감리교의 메리 화이트도 그 가운데 있었습니다. 두 사람은 함께 사역하는 선교사들이 하나님을 더욱 의지하며 일하게 해 달라고 모여 기도해 왔습니다. 두 사람으로 시작된 기도는 다른 여성 선교사들에게 이어졌습니다. 같은 교단 출신만 모인 기도회가 아니었습니다. 원산의 여러 선교회에서 일하던 사람들이 함께 성경을 읽고 기도할 자리를 마련했습니다.","그들이 한 주 동안 연합으로 모이기로 한 날짜는 1903년 8월 24일부터 30일까지였습니다. 기도회를 준비하면서 여성 선교사들은 원산에서 의료 선교와 복음 전도에 힘쓰던 로버트 하디에게 기도에 관해 세 차례 말씀을 전해 달라고 부탁했습니다. 하디는 그 부탁을 받아 성경을 살피기 시작했습니다. 그는 조선에 온 지 십 년이 넘은 의사이자 선교사였습니다. 환자를 돌보고 여러 지역을 다니며 복음을 전했지만, 그의 사역에는 오래도록 마음을 무겁게 하는 문제가 있었습니다.","원산에서 강원도 통천 일대로 이어진 선교 활동은 그가 기대한 결실을 거두지 못하고 있었습니다. 그는 누구보다 열심히 일했다고 생각했지만, 몇 해가 지나도 뚜렷한 변화를 보지 못했습니다. 훗날 작성한 보고서에서 하디는 강원도 지경대에서 삼 년 동안 힘써 일했으며, 그곳에서 겪은 실패가 자신에게 깊은 절망을 안겨 주었다고 털어놓았습니다. 처음에는 그가 실패의 이유를 똑바로 이해하지 못했습니다. 그러나 기도에 관한 강의를 준비하면서 그의 시선은 다른 곳으로 옮겨 갔습니다.","그가 읽은 말씀 가운데 누가복음 11장 13절이 있었습니다. 하나님 아버지께서 구하는 자에게 성령을 주신다는 말씀이었습니다. 하디는 선교사로서 가진 지식과 훈련, 자신의 능력을 의지하는 동안 하나님을 충분히 신뢰하지 않았다는 사실을 돌아보게 되었습니다. 조선 사람들을 대할 때 품었던 교만과 그들의 형편을 낮게 보았던 태도도 외면할 수 없었습니다. 그는 자신의 사역을 막고 있던 문제가 단순히 외부 환경에만 있는 것이 아니라고 고백하게 되었습니다.","8월 마지막 주, 원산의 연합 기도회가 시작되었습니다. 하디는 그리스도를 믿는 믿음과 그리스도 안에 거하는 삶, 성령의 역사를 주제로 말씀을 전했습니다. 그리고 오랫동안 함께 사역한 동료 선교사들 앞에서 자기의 실패와 그 원인이 된 잘못을 인정했습니다. 이후 하디는 그 시간을 돌이켜보며 자신에게 가장 먼저 요구된 일이 동료들 앞에 실패와 그 원인을 시인하는 것이었으며, 그것은 고통스럽고 굴욕적인 경험이었다고 썼습니다. 사람들에게 회개를 말해 왔던 선교사가 이제 자신이 무엇을 회개해야 하는지 사람들 앞에서 드러낸 것입니다.","그 고백은 선교사들 사이에서만 끝나지 않았습니다. 하디는 이어진 주일 오전예배에서 원산의 한국인 회중 앞에 섰습니다. 자신을 바라보는 사람들 앞에서 그는 선교사라는 지위 뒤에 숨지 않았습니다. 교만과 마음의 완고함, 믿음의 부족을 고백했습니다. 훗날 그는 자신이 부끄럽고 당황한 얼굴로 그 죄들을 인정했을 때, 회중이 죄를 깨닫고 회개한다는 것이 무엇인지 새롭게 이해하기 시작했다고 회고했습니다. 이제 회중은 선교사의 강단에서 남을 꾸짖는 말만 듣는 것이 아니라, 설교자 자신이 자신의 죄를 인정하는 모습을 보았습니다.","원산에서는 다른 사람들의 고백도 뒤따랐습니다. 한글을 가르치던 진천수는 주일 예배가 끝난 뒤 사람들 앞에 나서서 감추었던 죄를 눈물로 고백했습니다. 지역 교회 안에서는 신앙을 돌아보고 잘못된 일을 바로잡으려는 움직임이 이어졌습니다. 하디는 전과 같이 복음을 전했지만, 이전과 같은 사람으로 머물지는 않았다고 가까이 지낸 동료들이 기록했습니다. 그 뒤로 원산의 여러 교회에서 일어난 변화의 소식이 다른 지역으로 전해지기 시작했습니다.","1904년과 1905년에도 교회마다 성경을 배우는 사경회와 기도모임이 이어졌습니다. 원산에서 일어난 일을 들은 선교사들이 다른 도시를 방문했고, 신자들은 집회에서 들은 말씀과 회개의 경험을 이웃에게 전했습니다. 모든 지역에서 같은 일이 한꺼번에 일어난 것은 아니었습니다. 그러나 원산에서 시작된 움직임은 더 이상 한 도시의 일로만 남아 있지 않았습니다.","1906년 8월, 하디는 평양을 찾았습니다. 그곳에는 이미 수많은 한국인 신자들이 예배하던 장대현교회가 있었고, 성경을 가르치는 학교와 선교사들의 사역도 이어지고 있었습니다. 하디는 평양의 선교사들을 위한 사경회에서 말씀을 전했습니다. 원산에서 자신의 실패와 교만을 공개적으로 고백했던 그 선교사의 이야기를 평양의 선교사들이 직접 듣게 되었습니다. 그들 가운데에는 장대현교회를 돌보던 그레함 리 선교사도 있었습니다.","같은 해 가을, 평양에서는 다른 방문 설교자의 이야기도 들려왔습니다. 하워드 존스턴은 웨일스와 인도에서 일어난 부흥의 소식을 전했습니다. 10월 장대현교회에서 열린 집회에서 그가 성령의 충만을 사모하는 사람이 누구인지 묻자, 당시 장로였던 길선주가 손을 들고 일어섰다는 기록이 남아 있습니다. 그 이후 평양의 선교사들과 한국인 신자들은 함께 기도하는 일을 더욱 중요하게 여기게 되었습니다. 일부는 매일 한 시간씩 기도하기로 약속했습니다. 장대현교회와 평양의 여러 교회에서 사경회와 기도가 계속되었습니다.","1907년 1월 2일, 평양에서는 겨울 남자 사경회가 시작되었습니다. 여러 교회의 신자들이 성경을 배우기 위해 장대현교회로 모였습니다. 6일부터는 저녁마다 별도의 집회도 열렸습니다. 낮에는 말씀을 배우고, 저녁에는 선교사들과 한국인 지도자들의 설교를 들었습니다. 그레함 리, 윌리엄 헌트, 윌리엄 블레어와 길선주 등이 집회를 맡았습니다. 저녁 모임에는 사경회에 등록한 사람들만이 아니라 평양의 다른 신자들도 모였습니다. 기록에 따라 참석 인원은 다르게 전해지지만, 예배당을 가득 채울 만큼 많은 사람이 모였다는 점은 여러 증언에 공통으로 나타납니다.","1월 6일과 7일 저녁에도 기도가 이어졌습니다. 7일 저녁, 헌트가 설교한 뒤 그레함 리가 말했습니다. “우리 다 같이 기도합시다.” 곧 회중 곳곳에서 소리를 내어 기도하기 시작했습니다. 서로 다른 사람들이 한자리에서 자기 말로 하나님께 기도했습니다. 그 자리에 있었던 조지 매큔은 훗날 그 광경을 편지에 기록했습니다. 사람들 가운데는 자기의 죄를 구체적으로 고백하는 이들이 있었고, 성령의 도우심을 구하는 이들도 있었습니다. 집회는 하루로 끝나지 않았습니다.","1월 12일 토요일 저녁, 윌리엄 블레어는 고린도전서 12장의 말씀을 전했습니다. 교회는 그리스도의 몸이며 신자들은 그 몸에 속한 지체라는 말씀이었습니다. 블레어에게는 청중 앞에 보여 줄 자신의 상처가 있었습니다. 과거 사냥 중 총에 맞아 손가락 끝을 다친 일이 있었던 것입니다. 그는 손가락 하나가 상했을 때 머리와 온몸이 함께 고통스러웠던 일을 들려주었습니다. 교회 안에서 한 사람이 다른 사람을 미워하면 그 미움은 그 두 사람에게만 머무르지 않는다고 전했습니다. 그날 말씀을 들은 사람들 가운데는 다른 신자들과 선교사들에게 품었던 나쁜 감정을 인정하는 이들이 있었습니다.","그러나 그다음 날인 1월 13일 주일 저녁에는 분위기가 달랐습니다. 장대현교회에는 다시 많은 사람이 모였습니다. 길선주가 설교했고 기도의 시간도 있었습니다. 하지만 전날과 같은 변화는 나타나지 않았습니다. 사람들은 기도하기를 주저했고, 간증은 형식적으로 이어졌습니다. 길선주는 회중이 마치 죽어 있는 것처럼 반응한다고 답답해할 정도였습니다. 그날 밤을 기억한 블레어는 집회가 생명 없는 형식처럼 느껴졌다고 남겼습니다. 기대를 품고 모였던 사람들은 무거운 마음으로 돌아갔습니다.","월요일인 1월 14일 정오, 선교사들은 다시 모여 기도했습니다. 그날 저녁에는 사경회의 끝이 가까워지고 있었습니다. 장대현교회 안에는 사람들이 모여들었습니다. 짧은 설교가 끝난 뒤 그레함 리가 회중에게 함께 기도하자고 요청했습니다. 사람들은 각자의 목소리로 기도했습니다. 한동안 기도가 이어진 뒤에는 집으로 돌아갈 사람은 돌아가도 좋다는 안내가 있었습니다. 많은 사람이 예배당을 떠났지만, 약 오백 명에서 육백 명이 남아 더 기도했습니다.","남은 사람들 사이에서 자신의 죄를 고백하는 이들이 하나씩 일어났습니다. 오랫동안 숨겨 온 잘못을 말하는 사람도 있었고, 다른 사람을 미워했던 일을 인정하는 사람도 있었습니다. 그레함 리는 자신이 고용했던 요리사가 바닥에 쓰러져 자신을 향해 외쳤다고 기록했습니다. “목사님, 나에게도 희망이 있는지요?” 그 사람은 눈물을 흘리며 자신의 죄를 괴로워했습니다. 사람들의 고백과 기도는 늦은 밤까지 이어졌습니다. 그 현장에 있던 선교사들은 그 밤의 집회가 이튿날 새벽까지 계속되었다고 보고했습니다.","그날 밤 교회에서 일하던 강유문도 사람들 앞에 나왔습니다. 그는 장대현교회 김 장로를 마음속으로 미워해 왔다는 사실을 인정하고 용서를 구했습니다. 그러나 김 장로는 그날 끝내 입을 열지 않았습니다. 다른 사람들이 죄를 고백하고 밤이 깊어 가는 동안에도 그는 자신의 잘못을 공개적으로 털어놓지 않았습니다. 그를 아는 선교사들은 그와 강유문 사이에 오래된 미움이 있다는 사실을 알고 있었습니다.","1월 15일 화요일 아침, 전날의 소식은 평양의 선교사들 사이로 전해졌습니다. 여러 선교사가 다시 모여 기도했습니다. 그날 밤은 남자 사경회의 마지막 저녁 집회였습니다. 길선주 장로가 강단에 서서 설교했습니다. 그의 설교가 끝난 뒤에는 전날처럼 집으로 돌아갈 사람들을 먼저 보냈습니다. 약 육백 명이 예배당에 남았습니다. 전날 밤의 일을 겪었던 이들 가운데는 다시 자신의 죄를 고백하는 사람들이 있었습니다.","김 장로는 그때까지도 강단 뒤쪽에 앉아 있었습니다. 방위량이라고도 불리던 윌리엄 블레어 선교사는 그를 알고 있었습니다. 김 장로는 교회에서 책임을 맡은 사람이었고, 블레어가 지도하던 청년 단체에서도 활동했습니다. 그러나 두 사람 사이에도 마음의 상처가 있었습니다. 블레어가 운동장 사용 문제로 김 장로를 재촉했던 일이 그의 마음에 오래 남아 있었습니다. 블레어는 김 장로가 자신을 미워하고 있다는 사실을 알지 못했습니다.","그날 김 장로가 강단 앞으로 나왔습니다. 그는 강단을 붙잡고 자신의 잘못을 고백했습니다. “나는 하나님을 거슬러 싸운 죄인입니다.” 그는 교회의 장로인 자신이 강유문뿐 아니라 방 목사까지 미워해 왔다고 인정했습니다. 그의 말을 듣고서야 블레어는 김 장로가 자신을 향해 품었던 미움을 알았습니다. 선교사는 고개를 숙이고 그 곁에서 울며 기도했습니다. 자신이 함께 일해 온 교회 지도자가 그토록 큰 미움을 품고 있었다는 사실이 그에게도 깊은 충격이었습니다.","김 장로가 고백을 마친 뒤 강유문이 그에게 다가갔습니다. 전날 자신도 김 장로를 미워했다고 고백했던 바로 그 사람이었습니다. 두 사람은 서로 팔을 벌려 끌어안고 함께 울었습니다. 그렇게 한동안 서로를 미워하던 교회 지도자들이 사람들 앞에서 화해했습니다. 김 장로는 다시 블레어 선교사를 향했습니다. “나를 용서할 수 있습니까?” 그리고 자신을 위해 기도해 달라고 부탁했습니다. 블레어는 곧바로 긴 대답을 하지 못했습니다. 그가 거듭 부른 말은 “아버지, 아버지……”였습니다.","예배당 안에서는 다른 사람들의 고백도 이어졌습니다. 교회의 지도자들이 숨겨 왔던 미움과 잘못을 인정했고, 그들을 보던 사람들도 자신의 죄를 돌아보았습니다. 그날의 집회에 참석했던 선교사들은 나중에 이틀 동안 있었던 일을 편지와 보고서에 남겼습니다. 그들이 기억한 것은 수많은 사람이 동시에 기도하던 소리만이 아니었습니다. 서로를 미워하던 사람들이 그 자리에서 잘못을 인정하고 용서를 구하던 모습도 남아 있었습니다.","장대현교회의 집회가 끝났다고 평양의 모임이 모두 끝난 것은 아니었습니다. 1월 16일 수요일에도 같은 교회에서 기도회가 열렸습니다. 그날에는 또 다른 교회 지도자가 자신이 감추어 온 심각한 잘못을 고백했습니다. 17일에는 여학교에서도 기도와 죄의 고백이 이어졌습니다. 남자 사경회 때 장대현교회에 함께 모일 수 없었던 여성 신자들을 위한 집회도 17일부터 열렸습니다. 19일 토요일 저녁에는 그들 가운데서도 깊은 회개의 움직임이 나타났다는 기록이 남아 있습니다.","평양에서 일어난 변화는 예배당 문을 나서는 순간 끝나지 않았습니다. 당시 집회를 지켜본 윌리엄 블레어는 사람들이 전에 훔친 물건과 돈을 돌려주고, 잘못을 저지른 이웃을 찾아가 용서를 구했다고 기록했습니다. 교인이 아닌 사람들에게도 마찬가지였습니다. 한 중국인 상인은 한 신자가 찾아와 여러 해 전 부당하게 얻은 돈을 갚자 크게 놀랐습니다. 교회에서는 술을 끊고 축첩 같은 관습을 버리라는 가르침도 강조되었습니다. 성경을 배우는 사경회와 교회학교도 성장하면서 여성과 아이들이 공부하고 한글을 익힐 기회가 넓어졌습니다. 1908년 장로교와 감리교 계열 학교에 다니던 학생은 전국적으로 만 칠천 명이 넘었습니다. 물론 이런 교육의 변화가 모두 1907년 평양의 집회에서 새로 시작된 것은 아니었습니다. 그러나 자신의 죄를 고백하던 사람들이 이제 이웃에게 진 빚을 갚고 가정과 일터에서의 삶을 바로잡으려 했다는 것은 분명했습니다. 원산에서 시작해 평양으로 이어진 부흥은 그렇게 예배당 밖의 사람들과 사회에도 영향을 남겼습니다."];
const KOREA_SOURCES = [["박용규","『평양대부흥운동』, 하디·원산 부흥과 1907년 장대현교회 사경회 관련 부분"],["R. A. Hardie","남감리교 한국선교회 연례 보고(1903·1904) 및 회고 ‘God’s Touch in the Great Revival’ (1914) — 박용규 인용"],["Graham Lee","‘How the Spirit Came to Pyeng Yang’, The Korea Mission Field (1907년 3월) — 박용규 인용"],["W. L. Swallen","1907년 1월 18일 미국 선교부에 보낸 서신 — 박용규 인용"],["William N. Blair","Gold in Korea (1946), 당시의 기도회와 화해에 관한 회고 — 박용규 인용"],["George S. McCune","1907년 1월 15일 선교부 서신 — 박용규 인용"]];
function addStoryCloseButton(full,details,summary){
  const btn=document.createElement('button');
  btn.type='button';btn.className='revival-close-button';btn.textContent='↑ 다시 접기';
  btn.addEventListener('click',function(){
    details.open=false;
    summary.focus({preventScroll:true});
    // Return to the actual chronology, so the visitor can select another event.
    const track=document.getElementById('timelineViewport');
    const target=track.closest('.panel')||track;
    // Wait for <details> to finish closing and the layout to settle.
    window.requestAnimationFrame(function(){
      if(document.documentElement.classList.contains('atlas-home-embedded')){
        const offset=target.getBoundingClientRect().top+window.scrollY;
        window.parent.postMessage({type:'revival-atlas:focus',offset:offset},window.location.origin);
      }else{
        target.scrollIntoView({block:'start',behavior:'smooth'});
      }
    });
  });
  full.appendChild(btn);
}
function addKoreaFullStory(body){
  // 1903–1907년 원산–평양 부흥: 영상은 상세 대본 바로 위에 표시.
  const film=document.createElement('div');
  film.className='korea-film';
  const player=document.createElement('iframe');
  player.className='korea-player';
  player.src='https://www.youtube-nocookie.com/embed/Ydt79Pe0iz4';
  player.title='원산–평양 대부흥 이야기 영상';
  player.loading='lazy';
  player.referrerPolicy='strict-origin-when-cross-origin';
  player.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  player.allowFullscreen=true;
  film.appendChild(player);
  const link=document.createElement('a');
  link.className='korea-watch-link';
  link.href='https://youtu.be/Ydt79Pe0iz4';
  link.target='_blank';link.rel='noopener noreferrer';
  link.textContent='YouTube에서 영상 보기 ↗';
  film.appendChild(link);
  body.appendChild(film);
  const details=document.createElement('details');
  details.className='revival-story-expand';
  details.setAttribute('data-story-details','korea');
  const summary=document.createElement('summary');
  summary.textContent='이야기 자세히 읽기';
  details.appendChild(summary);
  const full=document.createElement('div');
  full.className='revival-story-fulltext';
  for(const text of KOREA_FULL_STORY){
    const p=document.createElement('p');p.textContent=text;full.appendChild(p);
  }
  const sources=document.createElement('section');
  sources.className='revival-story-sources';
  const h=document.createElement('h4');h.textContent='주요 출처';sources.appendChild(h);
  const ul=document.createElement('ul');
  for(const [author,work] of KOREA_SOURCES){
    const li=document.createElement('li');li.textContent=author+', '+work;ul.appendChild(li);
  }
  sources.appendChild(ul);
  const note=document.createElement('p');
  note.textContent='대본 속 대화는 당시 기록에 전하는 발언을 한국어로 옮긴 것입니다. 정확한 발화 그대로의 녹취록은 아니며, 서신·회고의 시점도 서로 다를 수 있습니다.';
  sources.appendChild(note);
  full.appendChild(sources);
  addStoryCloseButton(full,details,summary);
  details.appendChild(full);body.appendChild(details);
}


const RARITAN_FULL_STORY = ["1720년 1월, 북아메리카 뉴저지의 래리턴 계곡에 새로운 목회자가 도착했습니다. 이름은 테오도루스 야코부스 프릴링하이젠이었습니다. 독일에서 태어나 네덜란드 개혁교회의 목회자로 훈련받은 그는 바다를 건너 여러 교회의 청빙을 받아들였습니다. 래리턴강을 따라 농장과 마을이 흩어져 있었고, 그 가운데 네덜란드계 주민들이 세운 교회들이 있었습니다. 그는 한 교회에만 머무는 목사가 아니라 여러 회중을 오가며 설교하고 신자들을 돌보아야 하는 사람이 되었습니다.","이 지역 사람들은 오래전부터 교회 예배에 참석하고 자녀에게 교리문답을 가르쳤습니다. 그러나 훗날 그의 설교를 영어로 옮긴 사람의 기록에는 신앙생활을 관습처럼 대하는 풍조와 경마, 도박, 무절제한 생활에 관한 비판도 남아 있습니다. 그 증언이 모든 주민에게 해당하는 것은 아니었습니다. 신앙을 진지하게 지켜 온 가정들도 있었고, 평범한 일상 속에서 교회 공동체를 유지한 사람들도 있었습니다. 프릴링하이젠은 그들에게 익숙한 교회의 언어로, 그러나 익숙하다고 지나쳐서는 안 될 문제를 설교하기 시작했습니다.","1월 31일, 그가 처음 전한 설교의 본문은 고린도후서 5장 20절이었습니다. 하나님과 화목하라는 사도의 권면이었습니다. 그는 목사가 단지 예배 순서를 맡고 교회 의식을 집례하는 사람이 아니라 그리스도의 복음을 전해야 하는 사람이라고 믿었습니다. 교회의 이름을 알고 신앙고백의 문장을 외우는 것과 하나님 앞에서 자기 죄를 인정하고 예수 그리스도를 의지하는 것은 구별되어야 한다는 것이었습니다. 사람들의 삶을 변화시키는 것은 종교적 관습 자체가 아니라 말씀을 통해 역사하시는 하나님의 은혜라는 확신이 그의 설교에 담겼습니다.","그가 거듭 강조한 내용은 중생과 회개였습니다. 그는 선행을 쌓아서 하나님께 받아들여지는 사람이 되는 것이 아니라고 가르쳤습니다. 죄인은 그리스도의 의와 자비를 의지해 하나님께 나아가며, 참된 믿음은 그 뒤의 삶에서 열매를 맺는다고 설교했습니다. 그 말을 듣는 회중 가운데는 자기 신앙을 다시 살피는 사람들이 생겨났습니다. 훗날 다른 목회자들이 이들을 만나 확인했다고 남긴 변화는 한순간의 격한 감정보다 성경에 대한 이해와 죄에 대한 태도, 일상생활의 경건함에 관한 것이었습니다.","1721년에는 프릴링하이젠의 설교 세 편이 인쇄되었습니다. 첫 설교의 본문은 이사야 66장 2절, 곧 마음이 가난하고 말씀 앞에 떠는 사람을 하나님이 돌아보신다는 말씀이었습니다. 그는 사람이 자신의 죄를 보게 되면 더 이상 자신의 의로움을 내세우지 못하고, 그리스도 안에서 베푸시는 은혜를 찾게 된다고 설명했습니다. 그 설교는 회중 가운데 누가 남보다 신앙심이 강한지를 가리는 이야기가 아니었습니다. 하나님 앞에서 아무 공로도 내세울 수 없는 사람이 어디에서 용서와 새로운 삶을 얻을 수 있는가를 묻는 말씀이었습니다.","그러나 그의 설교는 성찬에 관한 문제에서 큰 충돌을 일으켰습니다. 그는 교회에 등록되어 있거나 이전에도 성찬에 참여했다는 사실만으로 누구나 아무런 성찰 없이 성찬상에 나아가서는 안 된다고 경고했습니다. 어떤 사람들에게는 이 말이 평생 익숙하게 여겨 온 신앙을 진지하게 돌아보게 하는 계기가 되었습니다. 다른 사람들에게는 목사가 자신의 마음을 함부로 판단하고 교회의 질서를 깨뜨리는 것처럼 들렸습니다. 진실한 믿음과 교회의 권위에 관한 질문이 같은 예배당 안에서 서로 다른 반응을 낳았습니다.","1723년 3월 12일, 교인 세 사람이 롱아일랜드 플랫부시의 목사 베르나르두스 프리먼을 찾아갔습니다. 피터르 뒤몽, 시몬 와이코프, 헨드릭 브룸이었습니다. 그들은 프릴링하이젠의 설교와 교회 운영에 문제가 있다고 주장했습니다. 프리먼은 고발하는 사람들에게 성급한 판단을 경계하라고 권했습니다. 그렇다고 지역 교회에 아무 문제가 없다는 뜻은 아니었습니다. 실제로 프릴링하이젠과 치리회는 일부 교인을 징계했고, 징계를 받은 사람들은 절차가 부당하다고 반발했습니다.","이후 몇 해 동안 분쟁은 바다 건너 네덜란드의 교회 당국에까지 전달되었습니다. 1725년에는 반대자들의 긴 고발문이 인쇄되었고, 이를 반박하는 서신들도 이어졌습니다. 목사의 설교를 통해 신앙이 변화되었다고 말하는 사람들과 목사에게 부당하게 판단받았다고 호소하는 사람들이 같은 지역에 살고 있었습니다. 프릴링하이젠에게 우호적이던 몇몇 목회자들조차 그의 교리를 인정하면서도 지나치게 거칠고 판단적인 말투를 경계했습니다. 이 부흥의 역사를 기록한 문서에는 처음부터 감사와 갈등이 함께 남아 있었습니다.","그렇지만 교회 안의 분쟁이 그의 설교에서 일어난 변화를 모두 설명해 주지는 못합니다. 1726년은 여러 교회가 새로운 신앙고백자들을 받아들인 해로 기록되었습니다. 훗날 래리턴 교회 기록을 조사한 목회자 에이브러햄 메슬러는 이 해에 프릴링하이젠이 돌보던 교회들에 신앙고백으로 가입한 사람이 서른여덟 명이었다고 정리했습니다. 그 수치는 당일 집회에서 실제로 회심한 사람을 모두 세었다는 뜻이 아니었습니다. 교회에 이름을 올리고 자신의 믿음을 공적으로 고백한 사람들의 기록이었습니다. 그러나 단지 감격했다는 소문이 아니라, 새로운 신자들이 공동체에 참여했다는 구체적인 흔적이 남아 있었습니다.","같은 해 뉴브런즈윅에는 길버트 테넌트라는 젊은 장로교 목사가 부임했습니다. 그는 프릴링하이젠과 달리 주로 영어를 사용하는 회중을 맡았습니다. 두 사람의 교단과 언어는 달랐지만, 테넌트는 이웃 네덜란드 개혁교회에서 일어난 일에 관심을 가졌습니다. 그는 프릴링하이젠의 설교를 듣고 변화되었다는 사람들을 실제로 만나 대화했습니다. 훗날 테넌트는 그들에게서 바른 교리에 관한 이해뿐 아니라 자신이 경험한 신앙을 설명하는 말과 경건한 생활의 증거를 보았다고 기록했습니다. 그가 만난 사람들이 모두 같은 날 같은 감정을 경험한 것은 아니었습니다. 각자의 삶을 이야기하는 가운데 목회자가 확인할 수 있는 변화가 있었다는 것입니다.","프릴링하이젠은 테넌트에게 편지도 보냈습니다. 성경 말씀을 듣는 사람의 형편에 맞게 바르게 나누어 전해야 한다는 권면이었습니다. 테넌트는 자신이 뉴브런즈윅에 온 뒤 한동안 뚜렷한 회심의 열매를 보지 못했다고 생각하고 있었습니다. 그는 다른 목회자의 회중에서 나타난 변화를 확인하면서 자신의 설교와 목회를 돌아보게 되었다고 회고했습니다. 신자들에게 무엇을 믿느냐고 묻는 데서 멈추지 않고, 그 소망을 어디에 두고 있으며 실제 생활에서 무엇이 달라졌는지 살피게 되었습니다.","테넌트에게도 힘든 시간이 찾아왔습니다. 그는 심한 병을 앓으며 죽음과 영원에 관해 깊이 생각하게 되었다고 기록했습니다. 회복한 뒤에는 이전보다 더 진지하게 죄와 회개, 중생의 필요성을 설교했습니다. 한때 자신은 목회에 실패하고 있다고 여겼지만, 이후에는 여러 곳에서 조금씩 변화를 목격했습니다. 훗날 그가 설명한 뉴브런즈윅의 각성은 어느 하루 갑자기 수백 명이 몰려든 사건이 아니었습니다. 이곳저곳에서 몇 사람씩 믿음에 관해 진지하게 생각하고 돌이키는 일이 이어졌고, 그런 작은 변화들이 여러 해에 걸쳐 쌓였습니다.","프릴링하이젠이 돌보던 회중 가운데에는 이름과 경험을 후대에 직접 남긴 사람도 있었습니다. 아프리카에서 태어난 우카우사우 그론니오소였습니다. 그는 고향을 떠나게 된 뒤 여러 사람에게 팔려 다녔고, 마침내 뉴욕과 뉴저지에서 노예로 살아가고 있었습니다. 그가 훗날 들려준 이야기에는 전 주인의 집에서 저주하는 말을 듣고 그것이 옳지 않다고 생각했던 경험도 나옵니다. 이를 전해 들은 프릴링하이젠은 관심을 보였고, 돈을 주고 그를 사들였습니다. 그론니오소가 목사의 집에 들어오게 된 정확한 연도는 확인되지 않습니다.","그 집에서 그론니오소는 아침저녁의 기도를 접하고 성경에 관해 배웠습니다. 프릴링하이젠의 아내는 그가 글을 배우도록 학교에 보냈습니다. 그의 교사는 그론니오소의 회고에 바노스도어라는 이름으로 나옵니다. 처음에는 학교에 다니는 일이 편하지 않았지만 그는 점차 읽는 법을 익혔습니다. 글을 배운 뒤에는 다른 사람이 읽어 주는 말씀을 듣기만 하는 데서 더 나아가 스스로 책을 펼쳐 볼 수 있었습니다. 그러나 그는 여전히 자유인이 아니었습니다. 그에게 신앙을 가르친 목회자는 동시에 그를 소유한 사람이었습니다.","어느 주일, 그론니오소는 프릴링하이젠이 요한계시록 1장 7절을 설교하는 것을 들었습니다. 그리스도께서 다시 오시며 모든 눈이 그분을 볼 것이라는 말씀이었습니다. 그는 훗날 그 말씀을 마치 자신에게만 하시는 경고처럼 들었다고 회고했습니다. 주변 사람들은 평소처럼 앉아 있는 것처럼 보였지만 그 자신은 두려움에서 벗어나기 어려웠습니다. 이어 히브리서 12장 14절, 곧 거룩함이 없이는 아무도 주님을 보지 못하리라는 설교를 들었을 때에는 자기 죄에 관한 고민이 더욱 깊어졌다고 했습니다. 목사가 실제로 그만을 바라보며 설교했는지는 알 수 없습니다. 중요한 것은 그론니오소가 그 말씀을 그렇게 받아들였다고 기록한 사실입니다.","그는 마음의 괴로움을 곧바로 다른 사람에게 털어놓지 못했습니다. 자신의 회고에 따르면 그 고통은 몸이 아플 만큼 커졌고, 한동안 마구간의 짚 위에 누워 지냈던 때도 있었습니다. 그러던 중 그의 마음에 하나님의 어린양을 보라는 성경 말씀이 떠올랐습니다. 그는 위로를 받기 시작했고, 날이 밝자 그 말씀을 성경에서 확인하고 싶어 했습니다. 학교에서 자신을 가르치던 바노스도어를 찾아가 마음에 있었던 일을 털어놓았을 때, 교사는 함께 기도하며 그를 격려했습니다. 그론니오소가 신앙의 고민을 나누기 위해 스스로 찾아간 사람은 목회자만이 아니었습니다.","그론니오소는 나무를 베는 일을 하러 가던 숲속의 큰 참나무도 기억했습니다. 그곳에서 혼자 기도하고, 자신의 죄와 두려움과 슬픔을 하나님께 아뢰었다고 했습니다. 리처드 백스터의 책을 읽으며 회개에 관한 말씀을 생각했고, 이전보다 기도하는 시간이 소중해졌다고 전했습니다. 그는 나중에 하나님의 용서를 믿으며 큰 위로와 기쁨을 경험했다고 회고했습니다. 이것은 어떤 신앙 변화가 실제 한 사람의 기도와 독서, 일상적인 노동 속에서 어떻게 이어졌는지를 보여 주는 기록입니다. 동시에 수십 년 후 구술된 개인의 기억이므로, 모든 감정과 경험의 순서를 당시의 일기처럼 확정할 수는 없습니다.","그론니오소의 이야기에서 중요한 것은 잠깐 격해진 감정만이 아니었습니다. 성경을 읽는 법을 배우고, 자기가 들은 말씀을 다시 찾아보고, 신앙의 고민을 믿을 만한 사람과 이야기하고, 혼자 기도하는 생활을 계속했다는 사실입니다. 다만 그가 주인의 집에서 그러한 경험을 했다고 해서 노예로 살아야 했던 현실이 정당해지는 것은 아니었습니다. 회심을 강조하던 목회자가 다른 사람의 자유를 빼앗는 제도 안에 참여하고 있었다는 사실도 그의 사역과 함께 기억되어야 합니다.","한편 프릴링하이젠과 테넌트의 교제는 두 회중의 예배에도 영향을 주었습니다. 당시 반대자들이 남긴 문서에는 두 사람이 네덜란드어와 영어를 함께 사용하는 예배를 인도했다는 항의가 기록되어 있습니다. 프릴링하이젠이 설교하고 테넌트가 기도하거나 세례를 집례하며, 함께 성찬을 인도했다는 내용도 나옵니다. 반대자들에게는 교회의 전통적인 질서를 위협하는 일이었지만, 두 목회자에게는 언어와 교단이 다른 사람들에게도 동일한 복음을 전할 수 있다는 협력의 기회였습니다. 그들의 협력은 뉴저지의 영적 각성이 한 교회의 울타리 안에만 머물지 않았음을 보여 주었습니다.","1729년에도 프릴링하이젠의 설교가 인쇄되었습니다. 그는 베드로전서 4장 18절을 통해 구원의 문제를 다시 다루었습니다. 사람이 자신의 행실로 구원을 얻을 수 있다는 뜻이 아니었습니다. 구원은 그리스도의 은혜와 그분의 의를 믿음으로 받는 것이지만, 그 믿음을 가졌다고 말하는 사람의 삶에서 아무런 변화가 나타나지 않는다면 스스로를 살펴야 한다는 것이었습니다. 여러 해 동안 그가 반복한 말씀의 중심에는 죄인의 회심과 하나님께서 베푸시는 은혜가 있었습니다. 그해에도 교회에 새롭게 신앙을 고백한 사람들이 있었다는 기록이 후대의 교회사 연구에 남아 있습니다.","그러나 목회자의 열정이 그의 모든 판단을 옳게 만들어 주지는 않았습니다. 분쟁은 계속되었고 1731년 암스테르담 노회는 반대자들에게 내려졌던 출교 처분을 무효로 했습니다. 이 결정은 프릴링하이젠의 설교를 듣고 변화된 사람들의 증언을 없애는 판결이 아니었습니다. 동시에 그가 다른 신자들을 징계할 때 취했던 조치가 언제나 옳았다는 주장도 받아들이지 않은 것이었습니다. 교회 당국은 양편에 화해를 권했고, 반대자들에게도 그 결정을 상대방을 조롱하는 데 이용하지 말라고 당부했습니다.","1733년에는 오랫동안 다투어 온 교회들이 평화를 위한 조항들을 마련했습니다. 그 조항들은 이듬해 예배당에서 읽혔습니다. 프릴링하이젠과 그의 치리회는 반대자들을 용서한다는 뜻을 밝혔고, 상대편도 그의 교리적 정통성을 인정하는 방향으로 나아갔습니다. 그러나 문서에 합의문이 적혔다고 모든 사람의 원망이 곧바로 사라진 것은 아니었습니다. 일부 반대는 여전히 계속되었습니다. 교회를 새롭게 하려는 설교와 상처받은 신자들을 돌보는 일은 함께 감당해야 할 과제로 남았습니다.","1730년대가 깊어지면서 래리턴 계곡의 각성은 다른 지역 목회자들의 관심도 받았습니다. 프릴링하이젠은 자신이 직접 설교하는 데 그치지 않고 다른 사람이 말씀을 가르치고 신자들을 돌볼 수 있도록 훈련했습니다. 평신도들이 참여하는 신앙모임도 이어졌습니다. 그 가운데 헨드릭 피셔르는 그의 설교를 배우고 전하는 사람으로 알려졌습니다. 한 목회자의 목소리에만 의존하지 않고, 말씀을 배우고 함께 기도하는 모임과 사역자들이 형성되기 시작한 것입니다. 다만 이 모임에 참여한 모든 사람의 이름과 구체적인 변화를 확인할 수 있는 것은 아닙니다.","1734년에도 새롭게 신앙을 고백하는 사람들이 교회에 들어왔다는 기록이 남아 있습니다. 래리턴의 각성을 전하는 후대 교회사학자들은 여러 해에 걸쳐 반복적으로 신앙고백과 교회 가입이 이루어졌다는 점을 주목했습니다. 한 번의 집회에서 몇 명이 울었는지를 기록한 이야기가 아니라, 몇 년이 지나도 회중 안에 새로운 신자들이 계속 나타났다는 기록이었습니다. 물론 교회에 등록하거나 성찬에 참여하게 된 사실만으로 그 사람의 마음까지 완전히 알 수는 없었습니다. 그러나 신앙의 변화가 공적인 고백과 공동체 생활로 이어졌다는 자료는 분명히 남았습니다.","같은 시기 뉴잉글랜드의 노샘프턴에서는 조나단 에드워즈가 자기 지역의 신앙적 각성을 기록하고 있었습니다. 그는 뉴욕을 다녀오는 동안 뉴저지에서 일어난 부흥의 소식도 들었습니다. 윌리엄 테넌트 등에게서 들은 이야기를 전하면서, 길버트 테넌트의 사역과 한 네덜란드 목회자의 사역을 함께 언급했습니다. 그 네덜란드 목회자는 프릴링하이젠이었습니다. 에드워즈가 래리턴의 예배를 직접 관찰했다는 뜻은 아니었습니다. 그러나 북쪽의 목회자가 자기 지역 밖에서 일어난 각성을 알게 될 만큼 뉴저지의 소식이 퍼지고 있었습니다.","1739년에는 영국에서 온 순회설교자 조지 휘필드가 뉴브런즈윅에 도착했습니다. 11월 20일 그는 그곳에서 여러 차례 설교했고, 이미 사역하고 있던 목회자들도 그의 말씀을 들으러 왔습니다. 프릴링하이젠도 그 가운데 있었습니다. 휘필드는 자신의 일기에 그를 예수 그리스도의 노련한 군사라고 적었습니다. 또 자신이 이제 목격하는 이 지역의 큰 역사가 시작될 때 프릴링하이젠이 중요한 역할을 했다고 평가했습니다. 이는 휘필드가 모든 사건을 처음부터 지켜보았기 때문이 아니라, 도착한 지역에서 이미 이루어진 말씀 사역의 영향을 발견했기 때문이었습니다.","프릴링하이젠이 돌보던 교회들의 기록에는 1739년에도 새롭게 신앙고백한 사람들이 상당수 있었다는 자료가 전해집니다. 이어 1741년 무렵까지 교회 가입 기록을 살펴보면 변화는 한두 해의 일로 끝나지 않았습니다. 19세기 목회자 에이브러햄 메슬러가 당시 교회 장부를 조사한 결과를 바탕으로 한 연구에서는, 1726년 무렵 성찬에 참여하는 교인이 스무 명 정도였던 래리턴 회중에 1741년까지 신앙고백으로 들어온 새 교인이 백스무 명에 이르렀다고 정리했습니다. 뉴브런즈윅 교회에서도 프릴링하이젠의 목회기간 중 성찬에 참여한 새 교인 약 예순 명이 기록되었다고 합니다. 이들은 18세기 현장에서 직접 집계한 '회심자 총수'가 아니라 남아 있던 교회 장부를 훗날 연구자가 정리한 수치입니다. 그래도 비교적 작은 교회들에서 여러 해 동안 새로운 신앙고백과 교회 참여가 이어졌다는 사실을 보여 줍니다.","그 무렵 뉴저지와 펜실베이니아의 장로교회들에서도 테넌트와 동료 목회자들의 설교가 이어지고 있었습니다. 이들은 죄와 은혜, 중생과 믿음의 열매를 강조했습니다. 프릴링하이젠의 영향을 받았던 테넌트는 다른 지역으로 사역을 넓혔고, 휘필드와 함께 식민지 여러 곳에서 전개된 대각성운동에 참여했습니다. 뉴저지의 모든 부흥이 프릴링하이젠 한 사람에게서 시작된 것은 아니었습니다. 그러나 일찍부터 회심을 강조한 그의 사역이 테넌트의 목회에 영향을 주었고, 두 사람이 함께 전한 말씀이 더 넓은 부흥운동과 연결되었다는 사실은 당사자의 회고와 동시대 기록에 남아 있습니다.","1744년, 길버트 테넌트는 보스턴의 토머스 프린스에게 편지를 보냈습니다. 그는 여러 해 전 뉴브런즈윅에 처음 왔을 때 프릴링하이젠의 사역에서 나타난 열매를 보았다고 회고했습니다. 자신이 직접 대화했던 사람들에게서 바른 신앙의 내용과 신앙 경험, 경건한 생활이 함께 나타났으며, 그들이 프릴링하이젠의 설교를 변화의 계기로 이야기했다고 썼습니다. 테넌트 자신의 사역도 처음부터 큰 무리의 회심으로 시작된 것이 아니었습니다. 그는 곳곳에서 조금씩 사람이 변화되는 일이 자주 있었고, 그것들이 모여 상당한 수가 되었다고 기록했습니다. 그의 글은 한 설교자의 명성만을 칭찬하는 말이 아니라, 시간이 흐른 뒤에도 사람들의 신앙과 생활을 살펴본 목회자의 증언이었습니다.","래리턴에서 시작된 신앙모임들은 이후에도 계속되었습니다. 후대 교회사 연구는 프릴링하이젠이 회심한 신자들의 믿음을 돌보기 위해 작은 경건모임을 장려했고, 이러한 모임이 점차 더 넓은 사람들에게 개방되었다고 전합니다. 평신도들이 기도하고 말씀을 가르치는 일에도 참여했습니다. 교회의 변화는 더 많은 사람이 예배당으로 들어온 데서만 드러나지 않았습니다. 말씀을 듣던 사람이 다른 사람을 위하여 기도하고, 배우던 사람이 또 다른 사람을 가르치며, 회중을 돌보는 일을 함께 맡는 데서도 나타났습니다.","오랜 시간이 흐른 1772년, 영국에서는 우카우사우 그론니오소의 삶을 담은 책이 출판되었습니다. 그는 여러 곳을 거쳐 그곳에 이르렀고, 자신의 이야기를 다른 사람에게 구술했습니다. 수십 년 전 뉴저지의 예배당에서 들었던 설교, 학교 교사와 나눈 대화, 숲속의 참나무 아래에서 드렸던 기도를 잊지 않고 이야기했습니다. 노예였던 그의 삶을 신앙의 체험만으로 설명할 수는 없었지만, 그는 고난 가운데 그리스도 안에서 얻었다고 믿는 위로를 자기 인생의 중요한 사건으로 남겼습니다. 뉴저지 래리턴의 여러 회중 가운데 이름조차 남지 않은 신자들이 많지만, 그의 이야기는 그 설교를 들었던 한 사람의 삶을 따라갈 수 있게 해 줍니다.","래리턴 계곡에서 일어난 일은 단 한 번의 설교나 한순간의 놀라운 반응으로 끝나지 않았습니다. 회심을 강조하는 말씀이 전해졌고, 어떤 사람들은 죄를 돌아보며 신앙을 새롭게 고백했습니다. 교회 장부에는 해를 거듭해 새로 들어온 신자들의 기록이 남았고, 어떤 사람은 성경을 배우고 기도하는 습관을 자기 삶의 일부로 삼았습니다. 다른 목회자는 이 사람들을 직접 만나 변화의 증거를 살폈으며, 그 경험을 자신의 설교와 돌봄에 반영했습니다. 그 과정에는 교회 분쟁과 부당한 징계, 노예제도라는 심각한 그림자도 함께 있었습니다. 그럼에도 사람들의 삶과 교회 공동체에 남은 변화의 흔적은, 래리턴에서 시작된 말씀 사역의 영향이 한 사람의 강단을 넘어 여러 해 동안 이어졌음을 증언하고 있습니다."];

function addRaritanFullStory(body){

  player.className='raritan-player';
  player.src='https://www.youtube-nocookie.com/embed/'+new URL(RARITAN_VIDEO_URL).pathname.slice(1);
  player.title='뉴저지 래리턴 부흥 이야기 영상';
  player.loading='lazy';
  player.referrerPolicy='strict-origin-when-cross-origin';
  player.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  player.allowFullscreen=true;
  film.appendChild(player);
  body.appendChild(film);
  const details=document.createElement('details');details.className='revival-story-expand';
  details.setAttribute('data-story-details','raritan');
  const summary=document.createElement('summary');summary.textContent='이야기 자세히 읽기';details.appendChild(summary);
  const full=document.createElement('div');full.className='revival-story-fulltext';
  for(const paragraph of RARITAN_FULL_STORY){const p=document.createElement('p');p.textContent=paragraph;full.appendChild(p);}
  const sources=document.createElement('section');sources.className='revival-story-sources';
  const heading=document.createElement('h4');heading.textContent='주요 출처';sources.appendChild(heading);
  const ul=document.createElement('ul');
  for(const [author,work,link] of RARITAN_SOURCES){
    const li=document.createElement('li');li.append(document.createTextNode(author+', '));
    const a=document.createElement('a');a.href=link;a.textContent=work;a.target='_blank';a.rel='noopener noreferrer';li.appendChild(a);ul.appendChild(li);
  }
  sources.appendChild(ul);
  const note=document.createElement('p');note.textContent='그론니오소의 신앙 경험은 1772년 구술·편집된 회고를 바탕으로 합니다. 교회 장부에 기록된 가입자 수는 회심자 전체를 집계한 통계가 아닙니다. 교회 징계와 노예 소유의 역사적 문제도 별도로 살펴야 합니다.';
  sources.appendChild(note);full.appendChild(sources);
  addStoryCloseButton(full,details,summary);details.appendChild(full);body.appendChild(details);

const NORTHAMPTON_FULL_STORY = ["1729년, 북아메리카 매사추세츠의 노샘프턴에서는 거의 육십 년 동안 마을 교회를 이끌어 온 솔로몬 스토다드 목사가 세상을 떠났습니다. 그의 손자 조나단 에드워즈는 이미 이곳에서 할아버지와 함께 설교하고 있었고, 이제 교회를 홀로 맡아야 했습니다. 코네티컷강을 따라 농장과 집들이 자리한 노샘프턴은 약 이백 가구가 모여 사는 마을이었습니다. 주민들은 오래전부터 성경과 예배에 익숙했지만, 마을 전체가 같은 신앙적 관심을 가지고 있는 것은 아니었습니다.","에드워즈가 돌아본 당시의 노샘프턴에는 서로를 경계하는 두 편의 갈등이 오래 남아 있었습니다. 적지 않은 청년들은 밤늦게까지 무리를 지어 놀거나 술집에 드나들었고, 예배에 참석해서도 경건하지 못한 태도를 보이곤 했습니다. 가정에서 자녀를 이끄는 일도 이전만큼 잘 이루어지지 않았습니다. 에드워즈는 여러 해 동안 신앙에 무관심한 모습이 사람들 사이에 퍼졌다고 기록했습니다. 오래된 교회와 익숙한 예배가 마을 사람들 모두의 마음을 바꾸어 놓지는 못했던 것입니다.","그러나 변화는 1734년 겨울 어느 날 갑자기 시작된 것만은 아니었습니다. 1731년에서 1732년 사이 청년들의 행동이 조금씩 달라지기 시작했고, 1733년 말에는 그 변화가 더욱 뚜렷해졌습니다. 에드워즈는 주일 저녁과 평일 설교가 있는 날 저녁마다 밤늦게까지 모여 노는 풍습을 멈추도록 권했습니다. 여러 동네의 어른들은 자녀들을 어떻게 지도할지 의논했지만, 막상 청년들은 설교에서 들은 권면을 스스로 받아들이겠다고 말했습니다. 에드워즈는 그 뒤로 그런 모임과 거기에서 비롯된 무질서가 눈에 띄게 줄어들었다고 회고했습니다.","그 무렵 노샘프턴 중심 마을에서 조금 떨어진 파스코머크에서도 몇몇 가정에 변화가 나타나기 시작했습니다. 작은 마을 사람들 가운데 자신의 죄와 구원에 깊은 관심을 보이는 이들이 생겼습니다. 그 소식이 퍼지던 1734년 4월, 노샘프턴의 한 젊은 남자가 갑자기 병에 걸려 이틀가량 만에 세상을 떠났습니다. 그를 아는 젊은이들은 죽음이 먼 훗날의 일만은 아니라는 사실을 마주했습니다. 그 일을 계기로 전해진 설교도 여러 사람의 마음에 남았습니다.","얼마 후에는 젊은 기혼 여성 한 사람이 병중에 세상을 떠났습니다. 그는 병들기 전부터 자신의 구원 문제로 고민했고, 아픈 동안에도 크게 괴로워했습니다. 그러나 죽음을 앞두고 하나님의 자비에 대한 위로를 얻었다고 주변 사람들에게 말했으며, 다른 이들에게 자신의 영혼을 돌아보라고 간절히 권했습니다. 에드워즈는 이 두 사람의 죽음과 그 무렵의 말씀 사역이 특히 청년들에게 깊은 영향을 주었다고 기록했습니다. 마을에서는 이전과 달리 삶과 죽음, 죄와 구원에 관한 대화가 이어지기 시작했습니다.","1734년 가을, 에드워즈는 청년들이 설교를 들은 뒤 함께 모여 신앙에 관해 이야기하고 기도하도록 제안했습니다. 청년들은 여러 무리로 나뉘어 마을 곳곳에서 모였고, 그런 모임은 이어졌습니다. 나이 든 사람들도 이를 본받아 모이기 시작했습니다. 교회에서 듣는 설교와 가정에서 나누는 대화가 서로 멀리 떨어진 일이 아니게 되었습니다. 그렇다고 주민 모두가 한마음이 된 것은 아니었습니다. 마을 주변에서는 하나님께서 죄인을 어떻게 의롭게 받아들이시는지를 두고 교리적 논쟁이 일어나고 있었습니다.","논쟁의 중심에는 사람이 하나님의 인정을 받기 위해 무엇을 해야 하는가 하는 문제가 있었습니다. 당시 일부 사람들은 인간의 의지와 행위가 구원에 어떤 몫을 가지는지 새롭게 주장했고, 다른 이들은 그것이 하나님께서 거저 주시는 은혜를 흐리게 할까 염려했습니다. 에드워즈는 그 문제를 외면하지 않았습니다. 그는 로마서 4장 5절을 본문으로, 죄인이 하나님 앞에서 의롭다 하심을 받는 것은 자기의 선행이나 공로 때문이 아니라 그리스도의 의를 믿음으로 받기 때문이라고 설교했습니다.","에드워즈의 설명을 듣는 사람들이 모두 즉시 동의한 것은 아니었습니다. 마을 밖에서는 젊은 목회자가 논쟁적인 교리를 강단에 올렸다는 비판도 나왔습니다. 하지만 노샘프턴에서는 오랫동안 자신의 행실을 살피던 사람들이 이제 하나님의 은혜가 무엇인지 새롭게 생각했습니다. 좋은 일을 많이 해야만 하나님께 가까이 갈 수 있다고 여기던 사람들도 자신이 의지해 온 근거를 돌아보게 되었습니다. 에드워즈는 훗날 이 설교가 마을 사람들에게 특별히 중요한 전환점이 되었다고 회고했습니다.","1734년 12월 하순, 몇몇 사람의 신앙 경험이 연달아 마을에 알려졌습니다. 에드워즈가 특히 놀란 사람은 예전부터 친구들과 어울리며 시간을 보내기로 유명했던 한 젊은 여성이었습니다. 목사는 그가 신앙 문제를 진지하게 생각하게 되었다는 말조차 듣지 못하고 있었는데, 어느 날 그 여성이 찾아와 자신에게 일어난 변화를 이야기했습니다. 에드워즈는 그의 말을 듣고 깊은 인상을 받았습니다. 이후에도 계속 그와 교제하면서 그 변화가 일시적인 흥분에 그치지 않는다고 판단했습니다.","에드워즈는 처음에 그 젊은 여성의 변화가 오히려 다른 사람들에게 비웃음거리가 되지 않을까 걱정했습니다. 그러나 예상과 달리, 그의 소식을 들은 청년들은 직접 그를 찾아가 무슨 일이 있었는지 물었습니다. 평소 신앙에 관심이 없던 사람들도 진지하게 귀를 기울였습니다. 한 사람에게 일어난 변화가 다른 사람의 이야기로 이어졌고, 사람들은 자신이 이제껏 당연하게 여기던 삶을 다시 돌아보게 되었습니다. 그 일을 계기로 노샘프턴 전역에 신앙에 대한 관심이 빠르게 확산되었습니다.","그 소식에 마음이 움직인 사람 가운데 아비가일 허친슨이라는 젊은 여성이 있었습니다. 아비가일은 오랫동안 몸이 약했고, 이웃들이 보기에는 조용하고 성실한 사람이었습니다. 그는 자기 형제에게서 참된 중생을 구해야 한다는 말을 들었고, 앞서 회심했다고 알려진 젊은 여성의 소식도 접했습니다. 처음에는 자신보다 경건하지 못해 보이던 사람이 먼저 은혜를 받았다는 생각에 시기심까지 느꼈습니다. 그러다가 자신도 성경을 더 깊이 읽어야겠다고 결심했고, 창세기부터 성경을 읽기 시작했습니다.","아비가일은 며칠 뒤 자신이 생각했던 것보다 죄가 깊다는 사실에 큰 충격을 받았습니다. 다른 사람들에게는 온순하고 효성스러워 보였지만, 그는 마음속 불평과 부모를 향한 태도까지 돌아보았습니다. 성경을 읽고 기도할수록 자신이 하나님의 자비를 얻을 자격이 없다는 생각이 깊어졌습니다. 한때는 기도를 많이 하고 말씀을 열심히 읽는 자기 노력이 구원에 도움이 되리라 기대했지만, 이제 그 행위들 자체를 의지할 수 없다고 느꼈습니다. 그는 형제에게 자신의 고민을 털어놓으며 어떻게 해야 할지 물었습니다.","어느 월요일 이른 아침, 아비가일은 전에 경험하지 못한 평안함을 느끼며 잠에서 깨어났습니다. 그리스도의 피가 죄를 깨끗하게 한다는 성경의 말씀이 마음에 떠올랐고, 그는 자신의 죄보다 그리스도의 구원이 충분하다는 사실에서 위로를 얻었다고 가족에게 이야기했습니다. 이후 며칠 동안 그는 그리스도의 성품과 하나님의 신실하심에 관해 말했습니다. 에드워즈는 그의 경험을 기록하면서, 그가 자기 능력을 과시하기보다 오히려 겸손해지고 가르침을 구했다고 전했습니다.","아비가일이 새롭게 관심을 기울인 대상은 자기 마음만이 아니었습니다. 그는 아직 신앙에 무관심한 이웃들을 걱정했고, 그들을 찾아가 하나님에 관해 이야기하고 싶어 했습니다. 한 형제는 그가 생각한 방문 방식이 적절하지 않을 수 있다고 조언했습니다. 아비가일은 한편으로 자연과 들판을 보면서 창조주에 대해 생각하기를 즐겼다고 합니다. 몸은 여전히 약했지만, 가족과 이웃들은 고통 가운데서도 다른 사람을 사랑하고 하나님께 순종하려는 그의 태도를 기억했습니다.","1735년 겨울이 깊어지자, 노샘프턴에는 신앙 상담을 청하는 사람들이 계속 찾아왔습니다. 에드워즈를 찾아와 신앙 문제를 상담하는 이들이 늘었고, 주민들은 여러 가정에 모여 성경을 읽고 기도했습니다. 오랫동안 이어지던 다툼이 누그러지고, 서로를 헐뜯는 말도 줄어드는 모습을 목사는 기록했습니다. 기도와 성경 읽기, 예배와 개인적인 상담을 생활의 중요한 일로 삼는 사람들도 늘어났습니다. 에드워즈는 그곳 사람들이 일상의 생업을 완전히 버렸다는 외지의 소문은 사실이 아니라고 바로잡았습니다. 대부분은 평소 하던 일을 계속하면서 신앙을 더욱 중요하게 여기고 있었습니다.","그동안 형식적으로 예배에 참석하던 이들은 설교를 이전과 다르게 들었습니다. 예배당에서 성경 말씀이 전해지면 죄를 생각하며 우는 사람도 있었고, 그리스도의 용서를 생각하며 기뻐하는 사람도 있었습니다. 함께 시편을 노래하는 시간도 달라졌다고 에드워즈는 기록했습니다. 그가 관찰한 가장 큰 변화는 예배 때의 감정 표현만이 아니었습니다. 청년들이 모여 이야기하는 주제가 달라졌고, 여러 가정에서는 서로의 신앙을 위해 기도하기 시작했습니다. 한때 분쟁으로 갈라졌던 사람들 사이에서도 적대적인 말과 다툼을 줄이려는 움직임이 나타났습니다.","1735년 봄, 에드워즈는 부모가 자녀의 신앙적 변화를 기뻐하고, 남편과 아내가 서로의 변화를 이야기하는 가정들이 생겼다고 전했습니다. 기존 교인들 가운데에도 새로운 힘을 얻었다고 말하는 사람들이 있었습니다. 사람들은 대개 신앙 문제를 각자 혼자 처리하지 않았습니다. 가족과 이웃의 말을 듣고, 목회자에게 찾아가 질문하고, 작은 모임에서 함께 기도했습니다. 신앙을 이야기하는 장소가 예배당에서 집으로, 다시 이웃의 집으로 넓어졌습니다.","그해 3월과 4월에는 목회자의 눈에도 그 변화가 절정에 이르렀습니다. 에드워즈는 어느 성찬식 전에 약 백 명을 새롭게 교회의 성찬 교제에 받아들였고, 다음 성찬식 전에도 약 예순 명을 받아들였다고 기록했습니다. 한 번에는 여든 명이 함께 신앙을 공개적으로 고백한 일도 있었습니다. 그는 반년 동안 노샘프턴에서 삼백 명이 넘는 사람이 구원의 은혜를 경험했기를 바란다고 썼지만, 그 숫자를 자신이 확실하게 판정한 회심자 통계라고 주장하지는 않았습니다. 교회에 새로 받아들인 사람의 수와 실제 회심자의 수는 그에게도 동일한 것이 아니었습니다.","변화는 청년에게만 나타나지 않았습니다. 에드워즈는 마흔 살이 넘은 사람들과 일흔 살이 넘은 사람들 가운데도 자신의 신앙이 달라졌다고 말하는 이들이 있었다고 기록했습니다. 어린이들도 부모나 형제의 말을 듣고 기도하거나 성경을 배우는 모임을 만들었습니다. 마을에 살던 흑인 주민들 가운데에서도 신앙의 변화를 보인 사람이 있었다는 기록이 남아 있습니다. 하지만 그들의 이름과 목소리는 에드워즈의 서술에 상세히 전해지지 않습니다. 그의 기록은 부흥의 범위가 넓었다는 사실을 보여 주면서도, 오늘날 우리가 복원할 수 있는 개인의 이야기가 제한되어 있음을 함께 드러냅니다.","노샘프턴에 온 외지 사람들의 반응도 달라졌습니다. 이 부흥을 헛소문이나 지나친 흥분으로 여기던 사람 가운데는 직접 와서 주민들을 만나 본 뒤 생각을 바꾼 이들이 있었습니다. 다른 지역 목회자들도 노샘프턴의 소식을 듣고 방문하거나 편지를 보냈습니다. 어떤 사람은 이곳에서 들은 이야기를 자기 교회에 돌아가 전했습니다. 그 사이 코네티컷강을 따라 남쪽의 사우스해들리에서 신앙적 관심이 커졌고, 서필드와 선덜랜드, 디어필드, 해트필드에서도 비슷한 변화가 보고되었습니다.","특히 사우스해들리에서는 1735년 3월부터 주민들이 자신의 구원 문제를 진지하게 이야기하기 시작했다고 에드워즈는 적었습니다. 해트필드에서는 4월 둘째 주 무렵 그런 관심이 마을 전반으로 빠르게 퍼졌다는 소식이 전해졌습니다. 조금 떨어진 코네티컷의 교회들에서도 각성이 보고되었습니다. 어떤 지역은 노샘프턴의 소식을 듣고 영향을 받았지만, 또 다른 지역에서는 서로의 형편을 알기도 전에 비슷한 움직임이 시작되었습니다. 에드워즈 자신도 모든 사건이 노샘프턴에서 일직선으로 전파되었다고 쓰지는 않았습니다.","코네티컷의 프레스턴에서 사역하던 목사와 그 동료 목회자는 서로 다른 이야기를 듣고 직접 노샘프턴을 찾아왔습니다. 이들은 여러 주민과 대화한 뒤 자신들이 전해 들은 소문과 실제 상황을 비교했습니다. 고향으로 돌아간 목회자는 자기가 만난 사람들의 신앙 이야기를 회중에게 전했고, 그곳에서도 신앙에 대한 새로운 관심이 커졌다고 에드워즈에게 알렸습니다. 소식은 편지와 설교, 사람들의 여행과 방문을 따라 지역의 교회들을 연결했습니다.","그런데 노샘프턴의 부흥에는 밝은 장면만 있었던 것이 아니었습니다. 사람들 가운데는 오랫동안 불안과 절망으로 괴로워하는 이들도 있었습니다. 같은 성경 말씀을 듣고 위로를 얻는 사람이 있는가 하면, 자기의 구원을 확신하지 못해 극심한 두려움에 사로잡히는 사람도 있었습니다. 에드워즈는 모든 사람의 신앙 경험이 같은 순서와 같은 강도로 나타나는 것은 아니라고 기록했습니다. 어떤 사람은 오랜 고민 끝에 평안을 찾았고, 어떤 사람은 비교적 빠르게 신앙의 변화를 경험했다고 말했습니다.","1735년 5월 말, 에드워즈는 부흥의 열기가 차츰 약해지고 있다고 느꼈습니다. 6월 1일에는 마을에서 존경받던 한 남성이 극심한 우울과 절망 속에서 스스로 생을 마감하는 비극이 일어났습니다. 후대 자료에서 조지프 홀리로 확인되는 인물입니다. 그는 오랫동안 자신의 신앙 상태를 걱정하고 잠을 제대로 이루지 못했으며, 마지막에는 주변 사람의 조언도 받아들이기 어려울 만큼 상태가 나빠져 있었습니다. 그 일을 접한 마을 사람들은 큰 충격을 받았습니다. 에드워즈는 당시의 신학적 언어로 그 일을 해석했지만, 그의 기록에도 그 사람이 심각한 정신적 고통을 겪었다는 내용이 분명히 남아 있습니다.","이 사건 뒤로 마을과 인근 지역에는 불안과 혼란이 퍼졌습니다. 에드워즈는 사람들이 비슷한 두려움을 호소했다고 전했습니다. 더불어 스프링필드의 목회자 청빙을 둘러싼 다툼도 여러 교회를 갈라놓았습니다. 부흥을 두고 일어난 평판과 반대의 목소리, 사람들의 지친 마음이 함께 드러났습니다. 에드워즈는 자신이 경험한 기쁨과 변화만을 기록하지 않았습니다. 깊은 고통과 공동체의 갈등, 부흥이 약해진 사실도 뒤에 남긴 서술에서 숨기지 않았습니다.","이 사건 뒤로 노샘프턴과 인근 지역에서는 심한 불안에 시달리는 사람들에 관한 보고가 이어졌습니다. 에드워즈는 스스로를 해치고 싶은 충동을 호소한 사람들이 있었고, 다른 두 지역에서는 자신의 생각을 하나님의 특별한 지시로 오해한 사람들도 있었다고 기록했습니다. 그는 이런 혼란을 당시의 신학적 언어로 해석했지만, 그의 기록에는 극심한 정신적 고통을 겪는 사람들의 모습도 남아 있습니다. 부흥의 기쁨과 열매만 골라 기록한 것은 아니었습니다.","그해 여름, 마을에는 또 다른 작고 구체적인 이야기가 이어지고 있었습니다. 윌리엄 바틀릿의 딸 페베는 1731년 3월에 태어난 네 살 아이였습니다. 그는 앞서 신앙에 관심을 갖게 된 열한 살가량의 오빠가 전해 준 말을 듣고 예전보다 부모의 권면에 귀 기울이기 시작했습니다. 부모는 딸이 너무 어리다고 생각하여 처음부터 그 아이에게 특별히 신앙의 문제를 설명하지는 않았습니다. 하지만 아이는 스스로 조용한 곳에 물러가 기도하는 일이 잦아졌습니다.","7월 마지막 목요일, 아이의 어머니는 페베가 혼자 기도하면서 구원과 죄의 용서를 간절히 구하는 말을 들었습니다. 기도를 마친 페베는 어머니 곁에서 한동안 울다가 이내 얼굴을 펴고 기뻐했습니다. 어머니의 말에 따르면, 그는 천국이 자기에게 왔다고 이야기했고 하나님을 사랑한다고 말했습니다. 에드워즈는 이 장면을 직접 보았다고 하지 않았습니다. 그는 아이의 부모가 들려준 이야기를 기록했습니다. 그 뒤 페베가 실제로 어떤 생활을 했는지도 부모의 관찰을 통해 확인하려 했습니다.","페베는 예배에 가는 날을 기다리며 며칠이 남았는지 자주 물었고, 집에서 기도하거나 교리문답을 배우는 일에 관심을 보였습니다. 그러나 에드워즈가 기록한 것은 아이의 종교적인 말만이 아니었습니다. 어느 날 페베는 다른 아이들과 함께 이웃의 자두를 가져왔다가 허락 없이 남의 것을 가져가서는 안 된다는 말을 들었습니다. 아이는 자두를 먹지 않겠다고 하며 자신의 행동을 부끄러워했습니다. 나중에 이웃에게 허락을 얻을 수 있다는 말을 듣고도, 처음에 잘못한 일을 마음에 두었다고 부모는 전했습니다.","또 하루는 살림에 꼭 필요했던 소 한 마리를 잃어 어려워진 가난한 사람이 페베의 집을 찾아왔습니다. 아이는 그가 겪는 곤란을 듣고 아버지에게 집에 있는 소 한 마리를 그 사람에게 주면 좋겠다고 부탁했습니다. 아버지가 형편상 그럴 수 없다고 하자, 이번에는 그 가족이 자기 집에 와서 살 수 없느냐고 물었습니다. 에드워즈가 전한 이 일화에서 두드러지는 것은 어린아이가 특별한 종교적 감정을 느꼈다는 사실보다 어려움에 처한 이웃을 불쌍히 여기고 도우려 했다는 행동이었습니다.","1735년 여름이 지나면서 부흥 초기의 강렬했던 관심은 점차 약해졌습니다. 그해에는 스프링필드 교회의 새 목회자 청빙과 안수를 둘러싸고 지역 교회들 사이에 논쟁도 일어났습니다. 의견이 엇갈린 교회들이 서로를 비판했고, 에드워즈는 훗날 이 갈등이 부흥의 확산을 가로막았다고 평가했습니다. 그 뒤에도 노샘프턴에서는 예배와 기도 모임이 이어졌지만, 목사는 신앙을 고백했던 사람들을 모두 참된 신자로 확정할 수 없다고 인정했습니다. 감격과 위로가 처음처럼 지속되지 않을 때에도, 주민들이 실제 삶에서 어떻게 살아가는지는 계속 살펴야 할 문제로 남았습니다.","1736년, 에드워즈는 보스턴의 목사 벤저민 콜먼에게 노샘프턴과 인근 마을에서 일어났던 일을 자세히 적어 보냈습니다. 그는 과장된 소문과 적대적인 평가가 퍼지고 있었기 때문에 가능한 한 구체적으로 기록하려 했습니다. 어떤 이들의 신앙이 어떻게 달라졌는지, 가정과 마을의 생활에 어떤 변화가 있었는지, 회심이라고 판단한 이유는 무엇인지, 또 어떤 어려움이 나타났는지를 함께 서술했습니다. 긴 편지는 1736년 11월 6일 자로 마무리되었습니다.","그 기록은 대서양을 건너 영국에 전해졌습니다. 런던에서 사역하던 아이작 와츠와 존 가이즈도 노샘프턴의 소식에 관심을 보였고, 1737년에는 에드워즈의 글이 『하나님의 놀라운 역사에 관한 신실한 이야기』라는 책으로 출판되었습니다. 코네티컷강 곁의 한 마을에서 일어난 일이 다른 나라의 교회들에도 알려졌습니다. 이 책을 읽는 사람들은 대규모 집회 이야기뿐 아니라 한 젊은 여성의 성경 읽기, 어린아이의 이웃 사랑, 마을 사람들의 다툼과 화해, 목회자가 겪은 기쁨과 고통까지 접하게 되었습니다.","몇 해가 지난 1743년, 에드워즈는 그때를 다시 돌아보았습니다. 그는 첫 부흥 당시의 강렬한 감정과 열심은 눈에 띄게 약해졌다고 인정했습니다. 그러면서도 젊은이들의 밤늦은 방탕한 모임, 부도덕한 대화와 노래, 술집 출입에는 여러 해에 걸쳐 뚜렷한 변화가 남았다고 기록했습니다. 가난한 사람을 돌아보려는 마음도 전보다 커졌지만, 그것 역시 복음의 가르침에 비추면 아직 부족하다고 덧붙였습니다. 부흥을 경험했다는 말만으로 자신들의 모습을 완전하다고 선언하지는 않았습니다.","노샘프턴의 이야기는 수백 명이 회심했다는 추산이나 집회에서 흘린 눈물만으로 끝나지 않았습니다. 처음에는 이름이 알려지지 않은 한 젊은 여성의 변화가 다른 청년들을 움직였고, 아비가일 허친슨은 병중에도 그리스도를 향한 믿음과 이웃을 위한 염려를 표현했다고 전해졌습니다. 네 살 페베 바틀릿은 소를 잃은 가난한 이웃을 도와 달라고 아버지에게 부탁했습니다. 그러나 그 마을에는 끝내 깊은 절망을 이기지 못한 사람도 있었습니다. 에드워즈는 자신이 사람의 마음을 모두 안다고 주장하지 않았습니다. 오히려 사람들이 고백한 믿음에 합당한 열매를 맺도록 계속 기도해 달라고 부탁했습니다. 그의 기록에는 부흥의 영광뿐 아니라 그 후의 삶을 살펴야 한다는 물음도 남아 있습니다."];
const NORTHAMPTON_SOURCES = [["Jonathan Edwards","A Faithful Narrative of the Surprising Work of God (1736년 11월 6일 작성, 1737년 영국 초판) — 당사자의 부흥 보고","https://www.jonathan-edwards.org/Narrative.html"],["Jonathan Edwards","1737년 초판 서지 기록, Bridwell Library, Southern Methodist University","https://bridwell.omeka.net/items/show/1035"],["Jonathan Edwards","1743년 12월 12일 노샘프턴 부흥 회고 편지 — 후속 평가","https://www.webrevival.net/jonathan_edwards/remarkable_revival_1734_1735.php"],["Jonathan Edwards (전기 편집)","Works, Vol. 1, Memoir, Chapter VII — 1735년 스프링필드 교회 분쟁의 연대와 배경","https://www.ccel.org/ccel/Edwards/works1.i.vii.html"],["Encyclopedic and documentary study","Joseph Hawley 관련 당시 일기 증언과 후대 인물 연구 (1735년 6월 1일 사건 교차확인)","https://dokumen.pub/joseph-ha-wley-colonial-radical-9780231885072.html"],["조나단 에드워즈·백금산 역","『놀라운 부흥과 회심 이야기』, 부흥과개혁사 (프로젝트 보유 한국어판; 외부 링크 대신 도서 서지로 표기)",""]];
function addNorthamptonFullStory(body){
  const details=document.createElement('details');
  details.className='revival-story-expand';
  details.setAttribute('data-story-details','northampton');
  const summary=document.createElement('summary');summary.textContent='이야기 자세히 읽기';
  details.appendChild(summary);
  const full=document.createElement('div');full.className='revival-story-fulltext';
  for(const paragraph of NORTHAMPTON_FULL_STORY){
    const p=document.createElement('p');p.textContent=paragraph;full.appendChild(p);
  }
  const sources=document.createElement('section');sources.className='revival-story-sources';
  const heading=document.createElement('h4');heading.textContent='주요 출처';sources.appendChild(heading);
  const ul=document.createElement('ul');
  for(const [author,work,url] of NORTHAMPTON_SOURCES){
    const li=document.createElement('li');
    if(url){
      const a=document.createElement('a');a.href=url;
      a.target='_blank';a.rel='noopener noreferrer';
      a.textContent=author+', '+work;li.appendChild(a);
    } else {li.textContent=author+', '+work;}
    ul.appendChild(li);
  }
  sources.appendChild(ul);
  const note=document.createElement('p');
  note.textContent='1734–1735년 노샘프턴의 회심 수치는 에드워즈의 추산이며, 애비게일·페베의 일부 경험은 가족과 이웃의 증언을 기록한 것입니다. 조지프 홀리의 이름과 6월 1일 날짜는 후대 연구 및 동시대 일기에서 대조했습니다. 1743년의 평가는 부흥 수년 후의 회고입니다.';
  sources.appendChild(note);full.appendChild(sources);
  addStoryCloseButton(full,details,summary);
  details.appendChild(full);body.appendChild(details);
}

const EVENTS=[{"id":"stewarton","year":1625,"date":"1625–1630년","century":17,"title":"스튜어턴 부흥","person":"데이비드 딕슨·존 리빙스턴","place":"스코틀랜드 어바인·스튜어턴·쇼츠","topic":"말씀과 회심","tags":["장로교","설교","회심","성찬","기도"],"end":1630,"story":["1618년 어바인에 부임한 데이비드 딕슨은 예배 문제로 추방되었다가 1623년 돌아왔습니다. 그는 장이 서는 월요일마다 주변 마을에서 온 사람들에게 설교했고, 주일 저녁에는 죄와 구원 문제로 고민하는 신자들을 상담했습니다. 1625년 무렵 스튜어턴과 에어셔 일대에서는 여러 해에 걸쳐 회개와 신앙의 변화를 구하는 움직임이 이어졌습니다.","1630년 인근 쇼츠의 성찬모임에서는 젊은 설교자 존 리빙스턴이 에스겔 36장 25–26절을 설교했습니다. 이후 어바인에서 크게 낙심한 리빙스턴을 딕슨이 다시 설교하도록 권면한 기록도 남아 있습니다. 두 부흥은 동일한 사건은 아니지만, 당시 스코틀랜드 여러 교구의 말씀 사역과 기도가 연결되었던 모습을 보여 줍니다."]},{"id":"raritan","year":1720,"date":"1720년대","century":18,"title":"뉴저지 개혁교회 부흥","person":"테오도루스 프릴링하이젠","place":"미국 뉴저지 래리턴","topic":"형식주의와 참된 믿음","tags":["개혁교회","칭의","회심"],"story":["1720년 뉴저지 래리턴 계곡의 네덜란드 개혁교회에 부임한 프릴링하이젠은 형식적인 신앙에 만족하지 말고 참된 회개와 중생, 그리스도를 믿는 믿음을 구하라고 설교했습니다. 말씀을 듣고 신앙을 새롭게 고백한 이들이 나타났지만, 성찬 참여와 교회 징계를 둘러싼 갈등도 깊어졌습니다.","그의 설교를 들었던 아프리카 출신 그론니오소는 훗날 자신의 회심 경험을 기록했습니다. 교회 가입 기록과 길버트 테넌트의 증언도 신자들의 변화를 보여 줍니다. 이 각성은 이후 북미 대각성운동에 영향을 미쳤지만, 당시 성찬 분쟁과 목회자의 노예 소유 문제도 역사적 사실로 남아 있습니다."]},{"id":"northampton","year":1734,"date":"1734–1735년","century":18,"title":"노샘프턴 부흥","person":"조나단 에드워즈","place":"미국 매사추세츠 노샘프턴","topic":"참된 부흥의 열매","tags":["회심","분별","성화"],"end":1735,"story":["1734년 매사추세츠 노샘프턴에서는 청년들의 생활이 달라지기 시작했고, 두 사람의 갑작스러운 죽음으로 죄와 구원의 문제가 새롭게 주목받았습니다. 조나단 에드워즈가 믿음으로 말미암는 칭의를 설교한 뒤 그해 12월부터 개인의 회심 이야기가 퍼져 나갔습니다.","1735년 봄에는 예배와 가정 기도 모임이 활발해졌고, 그 소식은 코네티컷강 계곡의 여러 마을로 전해졌습니다. 에드워즈는 회심자를 300명 이상으로 추산했지만 확정 통계는 아니었습니다. 그는 아비가일 허친슨과 네 살 페베 바틀릿의 경험, 부흥을 흔든 비극과 혼란까지 함께 기록했습니다."]},{"id":"awakening","year":1740,"date":"1740–1742년","century":18,"title":"제1차 대각성운동의 확산","person":"조지 휫필드·조나단 에드워즈","place":"북미 여러 지역","topic":"주권적 은혜와 전도","tags":["전도","설교","주권"],"end":1742,"story":["1730년대에 북미 여러 지역에서 독립적으로 시작된 영적 각성은 1740년 무렵 더 넓은 연결망을 이루었습니다. 영국에서 활동하던 조지 휫필드(George Whitefield)는 대서양을 건너 조지아, 필라델피아, 뉴욕, 보스턴과 뉴잉글랜드 여러 곳을 순회하며 설교했습니다. 그의 이동과 설교 소식은 신문, 일기, 편지, 설교 인쇄물을 통해 광범위하게 전해졌습니다.","1740년 10월 휫필드는 조나단 에드워즈가 목회하던 노샘프턴에 들러 며칠 동안 설교했습니다. 휫필드는 에드워즈의 가정에 머물며 회중을 만났고, 설교 중 사람들이 크게 감동했다는 사실을 자신의 일기에 남겼습니다. 같은 시기 길버트 테넌트 등 다른 설교자들의 순회사역도 여러 교회에 영향을 미쳤습니다. 지역 교회의 기존 목회와 이동 설교자의 활동이 때로 협력했고, 때로는 교회의 질서와 회심을 판별하는 방식을 둘러싼 논쟁도 낳았습니다.","1740–1742년의 움직임은 오늘날 흔히 북미 제1차 대각성운동의 확산기로 불립니다. 그러나 단일한 집회나 한 지도자의 사역으로 이루어진 사건은 아니었습니다. 서로 다른 교회와 지역에서 나타난 변화가 설교, 출판, 여행을 통해 연결되었습니다. 일부 지역에서는 회심과 교회 성장의 보고가 이어졌으나, 다른 곳에서는 과열된 감정적 반응과 교회 분열, 설교자의 자격을 둘러싼 갈등도 나타났습니다. 에드워즈를 비롯한 당시 목회자들은 이 과정에서 진정한 회심과 일시적인 흥분을 어떻게 구별할 것인지 논의했습니다. 광범한 종교적 열정이 곧 참된 회심을 뜻하지는 않기에 신앙고백 이후의 삶과 교회 공동체의 열매도 살펴야 한다는 과제를 남겼습니다."]},{"id":"cambuslang","year":1742,"date":"1742년 2월","century":18,"title":"캠버슬랭 부흥","person":"윌리엄 맥컬록","place":"스코틀랜드 캠버슬랭","topic":"그리스도의 의","tags":["칭의","설교","성례"],"story":["18세기 스코틀랜드 글래스고 남동쪽의 캠버슬랭(Cambuslang)은 장로교회가 지역 주민의 신앙생활에 중심 역할을 하던 교구였습니다. 목사 윌리엄 맥컬록(William McCulloch)은 여러 해 동안 주민들에게 성경을 가르쳤고, 교회 안에서는 기도모임이 이어졌습니다. 그는 신앙적 관심이 생긴 사람들의 말을 직접 듣고 기록했으며, 당시 남긴 상담·관찰 원고 일부가 오늘날까지 전해집니다.","1742년 2월 18일 맥컬록은 예레미야 23장 6절을 본문으로 설교했습니다. 집회가 끝난 뒤 자신의 죄와 구원 문제로 마음이 무거운 사람들이 목회자의 도움을 구했고, 그날 밤 목사관에는 약 50명이 찾아왔다는 증언이 남아 있습니다. 이후 성경 설교와 상담, 기도모임이 잇따랐고, 다른 지역의 목회자들이 지원하러 왔습니다.","그해 여름에는 대규모 설교집회와 성찬 모임이 진행되었습니다. 7월 휫필드도 이 지역을 방문했고, 8월에는 인근 지역의 참석자와 여러 목회자가 함께하는 성찬 모임이 열렸습니다. 신앙적 각성을 경험했다고 말하는 사람들의 수에 대해서는 서로 다른 보고가 있지만, 사건의 중요한 특징은 목회자가 개별 참석자를 면담하고 그 뒤의 변화를 계속 살피려 했다는 점입니다. 당시 상담 기록과 후대 연구는 집회에서 있었던 강한 반응에 그치지 않고 그 후의 신앙생활과 목양을 어떻게 이어 갔는지 보여 줍니다."]},{"id":"kilsyth1742","year":1742,"date":"1742년 5월","century":18,"title":"킬싯 부흥 (1742)","person":"제임스 로브","place":"스코틀랜드 킬싯","topic":"성령의 새 창조","tags":["중생","성례","설교"],"story":["1742년 스코틀랜드 킬싯(Kilsyth)의 목사 제임스 로브(James Robe)는 마을 교회에서 죄와 중생, 그리스도의 구원에 관한 설교를 계속하고 있었습니다. 비슷한 시기 인근 캠버슬랭에서 신앙적 각성이 일어났다는 소식이 전해졌고, 킬싯에서도 말씀을 듣는 사람들의 반응과 상담 요청이 달라지기 시작했습니다.","1742년 5월 로브는 설교 후 양심의 괴로움과 구원 문제를 호소하는 사람들이 늘어났다고 적었습니다. 그는 그달 28일 자신이 파악한 사례를 정리하여 보고했고, 교구 안팎의 참석자들을 면담했습니다. 신앙 상담과 정규 예배가 이어지는 가운데 사람들의 관심은 기도와 성경 공부, 성찬을 중심으로 모였습니다.","6월에는 휫필드가 킬싯을 방문해 많은 군중에게 설교했습니다. 그해 가을에는 여러 목회자가 함께 성찬을 준비하고 말씀을 전하는 집회가 진행되었고, 이러한 움직임은 인근 교구로도 알려졌습니다. 로브는 사건을 문서로 남겨 다른 교회에 알렸습니다. 킬싯에서는 약 한 세기 뒤인 1839년에도 또 다른 부흥이 있었으므로 두 사건은 연도와 담당 목회자가 서로 다른 역사로 구분해야 합니다."]},{"id":"yale","year":1802,"date":"1802년","century":19,"title":"예일대학 부흥","person":"티모시 드와이트","place":"미국 코네티컷 예일대학","topic":"성경의 권위와 회심","tags":["청년","성경","회심"],"story":["18세기 말 예일대학에서는 계몽주의와 프랑스 혁명 이후 확산된 사상의 영향 아래 학생들의 신앙과 대학 예배를 둘러싼 논쟁이 많았습니다. 조나단 에드워즈의 외손자인 티모시 드와이트(Timothy Dwight)는 1795년 총장에 취임해 교육과 예배를 함께 지도했습니다. 그는 일부 학생들이 성경의 권위에 회의적이라는 사실을 알고, 채플에서 성경이 하나님의 말씀인가를 논증하는 설교를 여러 달에 걸쳐 전했습니다.","드와이트의 설교와 학생들의 토론, 신앙 모임은 수년 동안 계속되었습니다. 1802년 봄에는 졸업을 앞둔 두 학생이 공개적으로 그리스도인임을 고백한 뒤 다른 학생들에게도 신앙적 관심이 확산되었습니다. 당시 대학의 인원과 회심자에 관한 수치는 학교 기록과 후대 교회사에 남아 있으며, 박용규는 약 63명의 학생이 회심을 경험했다고 기술합니다.","1802년의 각성운동은 갑작스러운 한 번의 집회만으로 설명되지 않습니다. 몇 년에 걸친 성경 설교, 학생들의 지적 질문, 신앙고백과 상담이 함께 작용했습니다. 이후에도 예일에서는 시기마다 각성운동이 반복되었고, 일부 학생들은 목회와 선교의 길로 나아갔습니다. 당시 학생들의 일기와 대학의 문서들은 캠퍼스 안에서 이러한 변화가 어떻게 받아들여졌는지 살피는 데 도움을 줍니다."]},{"id":"dundee","year":1839,"date":"1839년 7–8월","century":19,"title":"킬싯·던디 부흥 (1839)","person":"윌리엄 찰머스 번즈·로버트 머리 맥체인","place":"스코틀랜드 킬싯·던디","topic":"말씀과 설교자의 도구성","tags":["장로교","목회","설교"],"story":["1830년대 스코틀랜드 던디의 성베드로교회는 젊은 목사 로버트 머리 맥체인(Robert Murray M’Cheyne)의 목회 아래 성장하고 있었습니다. 맥체인은 성경 설교, 성도들의 신앙 상담, 지역 주민에 대한 전도에 힘썼습니다. 1839년 그는 선교 상황을 조사하기 위한 팔레스타인 방문길에 올랐고, 그동안 젊은 설교자 윌리엄 찰머스 번즈(William Chalmers Burns)가 던디의 강단을 맡았습니다.","번즈는 1839년 7월 고향인 킬싯에 머물며 아버지의 교회 사역을 도왔습니다. 7월 23일 설교를 계기로 신앙적 각성이 일어났다는 소식이 퍼졌습니다. 8월 8일 번즈가 던디로 돌아왔을 때 사람들은 킬싯에서 있었던 일을 듣기 원했습니다. 그는 예배 뒤 관심 있는 이들에게 남으라고 했고, 약 100명이 자리를 지켰습니다. 그 모임에서도 기도와 죄의 자각, 신앙 상담이 시작되었다고 기록됩니다.","이후 수 주 동안 던디에서는 저녁집회와 개인 상담이 계속되었고, 다른 교회 목회자들도 참여했습니다. 맥체인이 11월 돌아왔을 때 그는 자신이 직접 이끌지 않은 기간에 교회와 지역에 나타난 변화를 목격했습니다. 번즈는 뒤에 다른 스코틀랜드 지역과 중국에서도 사역했습니다. 1742년 제임스 로브가 관련된 킬싯 부흥과 1839년 번즈가 관련된 킬싯 부흥은 반드시 구분해서 보아야 합니다."]},{"id":"fulton","year":1857,"date":"1857년 9월 23일","century":19,"title":"뉴욕 정오기도 부흥","person":"제레마이아 란피어","place":"미국 뉴욕 풀턴가","topic":"지속적인 기도","tags":["기도","평신도","회심"],"story":["1850년대 뉴욕은 금융업과 상업 활동이 빠르게 성장하던 도시였습니다. 북화란개혁교회에서 평신도 선교사역을 맡았던 제레마이아 란피어(Jeremiah Lanphier)는 분주한 상인과 직장인들이 일터 근처에서 잠시라도 기도할 시간을 마련하고자 했습니다. 그는 점심시간인 정오부터 한 시간 동안 기도회를 열겠다는 전단을 만들어 거리와 사무실에 배포했습니다. 시간이 부족한 사람은 5분이나 10분만 참여해도 된다고 안내했습니다.","1857년 9월 23일 수요일 정오, 란피어는 풀턴가의 교회 건물 3층 강의실 문을 열고 참석자를 기다렸습니다. 처음에는 혼자 기도하다가 모임이 끝나기 전 여섯 사람이 합류했습니다. 다음 주에는 약 20명, 세 번째 모임에는 30–40명, 네 번째 모임에는 약 100명이 모였다고 전해집니다. 참석자가 늘어나자 주간 기도회는 매일 기도하는 모임으로 바뀌었습니다.","뉴욕의 금융 불안과 경기 침체가 겹친 시기에 여러 계층의 사람들이 기도회에 참여했습니다. 정오기도회는 뉴욕의 다른 장소로 퍼져 나갔고, 곧 필라델피아와 보스턴을 비롯한 여러 도시에서도 유사한 모임이 생겨났습니다. 교회 지도자뿐 아니라 일상적인 직업을 가진 평신도들이 시간을 쪼개 참여했다는 점이 기록에 두드러집니다. 당시 발표된 광범위한 회심 통계는 추정치로 구별해서 읽어야 합니다. 이 운동은 기도의 중요성을 생생하게 보여 주지만, 작은 기도회 하나가 정해진 순서대로 대규모 부흥을 일으킨다는 공식으로 해석할 수는 없습니다. 경제적 위기와 기존 교회들의 사역이 함께 있었고, 기도에 대한 응답의 시기와 방식은 인간이 결정할 수 없기 때문입니다."]},{"id":"ulster","year":1859,"date":"1857년 시작 · 1859년 확산","century":19,"title":"얼스터 부흥","person":"제임스 맥퀼킨 외 세 청년","place":"아일랜드 얼스터","topic":"기도와 교회의 갱신","tags":["기도","교회","장로교"],"story":["1850년대 아일랜드 북부 얼스터에서는 산업화와 사회적 긴장 속에 교회들의 신앙생활을 새롭게 하려는 관심이 커지고 있었습니다. 제임스 맥퀼킨(James McQuilkin)은 콜빌 부인의 전도적 대화를 들은 뒤 자기 신앙을 진지하게 돌아보게 되었다고 기록됩니다. 1857년 9월 그는 존 월리스, 로버트 칼라일, 제러마이아 미닐리 등 세 청년과 함께 앤트림주 켈스의 작은 학교에서 정기 기도회를 시작했습니다.","처음 네 명으로 시작한 모임에는 점차 다른 사람들이 합류했습니다. 기도모임은 코너와 인근 마을로 확산되어 1858년 말에는 약 100개 모임이 있었다는 보고가 전해집니다. 미국의 정오기도회 소식도 아일랜드에 전달되었고, 장로교 지도자들이 현지를 방문하고 돌아와 그 경험을 전했습니다. 국내에서 이어진 기도와 해외 소식이 서로 영향을 주고받았습니다.","1859년 봄에는 아호힐과 밸리메나 등 여러 지역에서 대규모 집회와 죄의 고백, 회심의 경험이 보고되었습니다. 학교와 교회는 물론 야외에서도 기도모임이 이어졌고, 당시 목회자 윌리엄 깁슨은 그 경험을 『은혜의 해』(The Year of Grace)에 정리했습니다. 기록에는 강한 감정적 반응과 신체적 현상도 포함되지만, 그것이 모든 회심자에게 나타나야 하는 표지는 아닙니다. 여러 지역의 교회가 기도와 말씀 교육, 방문과 상담을 통해 참여한 역사적 흐름과 이후의 신앙생활을 함께 살펴야 합니다."]},{"id":"korea","year":1903,"date":"1903–1907년","century":20,"title":"원산–평양 대부흥","person":"메리 화이트·루이스 맥컬리·로버트 하디·길선주 등","place":"한국 원산 → 평양","topic":"기도·사경회·회개","tags":["한국","기도","회개"],"end":1907,"story":["1903년 원산에서 루이스 매컬리와 메리 화이트 등이 함께 기도하던 모임이 연합 사경회로 이어졌습니다. 의료 선교사 로버트 하디는 자신의 교만과 믿음의 부족을 동료 선교사들과 한국인 회중 앞에서 고백했습니다. 이후 회개와 기도의 움직임은 여러 지역의 교회와 사경회로 이어졌습니다.","1907년 1월 평양 장대현교회의 겨울 사경회에서는 말씀과 통성기도 가운데 죄를 고백하는 사람들이 나타났습니다. 특히 서로 미워하던 교회 지도자들이 잘못을 인정하고 용서를 구하며 화해했습니다. 당시 선교사들의 편지와 보고서에는 그 밤의 장면과 이후 평양의 교회·학교로 확산된 변화가 남아 있습니다."]},{"id":"wales","year":1904,"date":"1904–1905년","century":20,"title":"웨일스 부흥","person":"이반 로버츠 및 지역 교회 성도들","place":"영국 웨일스","topic":"기도와 삶의 변화","tags":["청년","회개","기도"],"end":1905,"story":["1904년 웨일스는 탄광과 산업도시를 중심으로 큰 사회 변화를 겪고 있었습니다. 교회에서는 오래전부터 기도회와 성경 공부가 진행되었고, 일부 지역에서 신앙적 각성이 시작되었다는 소식이 오갔습니다. 젊은이 이반 로버츠(Evan Roberts)는 이러한 분위기 속에 기도와 회개를 강조하며 지역 교회 모임에 참여했습니다.","1904년 10월 31일 월요일 저녁 러퍼(Loughor)의 모리아 예배당에서 정규 기도회가 끝나자 로버츠는 남아 있던 청년들을 대상으로 모임을 이어 갔습니다. 후대 기록은 당시 어린이 한 명을 포함한 17명이 남았다고 전합니다. 그는 그리스도에 대한 믿음과 기도, 자신의 신앙을 드러내는 고백을 권면했습니다. 이후 노래와 기도가 이어지는 집회 소식은 주변 교회로 빠르게 퍼졌습니다.","1904년 말부터 1905년에 이르기까지 웨일스 여러 지역 교회에서 집회가 이어졌고, 회심과 삶의 변화에 관한 증언이 교회 간행물과 신문을 통해 확산되었습니다. 이 운동은 다른 나라의 교회에도 알려져 기도운동과 영적 각성에 대한 관심을 높였습니다. 그러나 개별 인물이나 극적인 집회 장면만으로 전체 부흥을 설명하기는 어렵습니다. 이안 머리는 당시의 실제 회심과 교회 갱신을 인정하면서도, 이반 로버츠의 역할을 지나치게 부각하거나 개인의 충동에 집회 진행을 맡겨 말씀 설교와 질서 있는 목회적 지도력이 약해진 현상을 비판했습니다. 그에게는 부흥의 열매와 부흥 과정의 무분별한 행동을 구별하는 일이 중요했습니다."]},{"id":"mukti","year":1905,"date":"1905–1906년","century":20,"title":"인도 묵티 부흥","person":"판디타 라마바이","place":"인도 케드가온 묵티 공동체","topic":"성경교육과 전도","tags":["성경","기도","선교"],"end":1906,"story":["19세기 말 인도에서는 여성과 어린이, 어린 나이에 과부가 된 이들의 교육과 생계를 돕는 일이 중요한 사회적 과제였습니다. 판디타 라마바이(Pandita Ramabai)는 마하라슈트라주 케드가온(Kedgaon)에 묵티(Mukti) 공동체를 세워 소녀와 여성들에게 숙식, 교육, 직업훈련과 성경 교육을 제공했습니다. 대규모 기근을 겪은 뒤 보호가 필요한 여성들이 모였고, 공동체의 규모도 커졌습니다.","라마바이는 해외 부흥 소식을 접한 뒤 공동체 안에 정기 기도모임을 장려했습니다. 1905년에는 여성들과 소녀들이 공동체를 위해 기도하고, 주변 마을에 성경의 내용을 전하는 활동에 참여했습니다. 6월 30일 라마바이가 요한복음 8장을 가르치던 자리에서 여러 사람이 자신의 죄를 고백하고 오랜 시간 기도했다는 보고가 남아 있습니다. 관련 문헌에는 당시의 특별한 체험에 관한 다양한 증언도 있으나, 그 성격과 해석은 자료마다 차이가 있습니다.","이후 공동체 안에서는 기도와 신앙 상담이 이어졌고, 일부 여성들은 다른 지역으로 나가 전도와 봉사에 참여했습니다. 묵티의 이야기는 하나의 집회뿐 아니라 여성 교육, 보호 시설 운영, 성경교육과 지역사회 봉사가 함께 있었던 역사로 이해할 필요가 있습니다. 당시 기록은 대부분 참여자와 후원단체의 증언이므로 집회의 규모와 특별한 현상에 대한 숫자·평가는 그 기록의 성격을 감안해 읽어야 합니다. 특히 일부 증언에 등장하는 방언과 환상은 확인 가능한 교육·구호·전도 사역의 역사와 구별해야 하며, 그런 경험을 참된 신앙의 필수 조건으로 일반화할 근거는 없습니다."]},{"id":"asbury","year":1970,"date":"1970년 2월 3일","century":20,"title":"애즈베리 대학 부흥","person":"커스터 레이놀즈와 학생들","place":"미국 켄터키 애즈베리대학","topic":"회개와 간증","tags":["청년","회개","공동체"],"story":["미국 켄터키주 윌모어의 애즈베리대학은 20세기 동안 여러 차례 학생들의 기도와 신앙 갱신 운동을 경험한 학교였습니다. 1970년 2월 3일 화요일 오전 10시 정규 채플에서는 예정된 설교 대신 신앙에 관한 증언을 나누는 시간이 마련되었습니다. 당시 학교 책임자가 출장 중이어서 학감 커스터 레이놀즈(Custer Reynolds)가 예배를 인도했습니다.","레이놀즈는 학생들에게 자신의 신앙 경험을 이야기할 기회를 주었습니다. 처음 한 학생이 앞에 나왔고, 이어 다른 학생들도 죄를 인정하거나 기도 제목과 삶의 변화를 이야기했습니다. 채플이 정해진 시간에 끝나지 않자 학생들과 교수 일부가 계속 남아 찬송하고 기도했습니다. 학교는 정규 수업을 한동안 중단했고, 강당에는 학생들의 증언과 기도모임이 밤낮으로 이어졌습니다.","애즈베리대학의 공식 역사 기록은 그해 연속적으로 이어진 집회를 144시간으로 정리합니다. 모임이 이어지는 동안 참석자와 졸업생들은 다른 교회와 대학에 그 소식을 전했고, 학생들로 구성된 방문 팀이 여러 학교를 찾았습니다. 당시 참가자들의 회고에는 죄 고백, 용서, 화해와 진로에 대한 새 결심이 반복해서 등장합니다. 집회 시간에 관해서는 기록 간 차이가 있으므로 구체적인 숫자보다 전개 과정과 현장 증언을 중심으로 살펴볼 수 있습니다. 며칠 동안 예배가 이어졌다는 사실 자체보다, 그 경험이 이후의 회개와 화해, 신앙생활에 어떤 지속적인 영향을 남겼는지가 부흥을 평가할 때 더 중요합니다."]},{"id":"wheaton","year":1995,"date":"1995년 3월 19일","century":20,"title":"휘튼대학 부흥","person":"브랜디 맥과이어·제임스 한 및 학생들","place":"미국 일리노이 휘튼대학","topic":"회개와 화해","tags":["청년","화해","회개"],"story":["1995년 초 미국 텍사스의 하워드 페인 대학과 주변 교회에서는 학생들의 기도와 회개 모임이 이어졌습니다. 그 소식은 여러 대학에 알려졌고, 일리노이주 휘튼대학의 학생들도 관심을 갖게 되었습니다. 3월 19일 주일 저녁 휘튼대학 피어스 채플에서 열린 세계기독학생교제(World Christian Fellowship) 모임에는 하워드 페인 대학 학생 브랜디 맥과이어(Brandi Maguire)와 제임스 한(James Hahn)이 초청되었습니다.","두 학생은 자신들의 학교에서 경험한 일을 전했습니다. 간증이 끝나고 잠시 조용한 시간이 흐른 뒤 휘튼대학의 한 졸업반 학생이 앞에 나와 자신의 교만을 고백하고 동료들에게 용서를 구했습니다. 이어 다른 학생들도 오랫동안 숨겨 왔던 잘못을 이야기하며 기도를 요청했습니다. 친구들이 그 곁에 모여 기도하고 위로하는 장면이 반복되었고, 모임은 밤늦게까지 계속되었습니다.","휘튼대학에서는 3월 19일부터 며칠 동안 저녁 모임이 이어졌으며, 집회 장소를 옮겨 더 많은 인원을 수용하기도 했습니다. 학교 관계자들은 당시 학생들의 자발적인 참여와 공개적인 화해의 시도를 기록했습니다. 참가자들의 증언과 대학 문서, 이후 진행된 구술사 인터뷰가 남아 있어 1995년 사건은 현장의 변화와 그에 대한 다양한 평가를 함께 살필 수 있습니다. 공개적인 죄 고백이 화해의 계기가 될 수는 있지만, 모든 사적인 죄를 회중 앞에 말해야 한다는 뜻은 아닙니다. 죄의 성격과 피해 관계를 살피고 당사자의 존엄과 사생활을 보호하는 목회적 분별 또한 필요합니다."]}];

const detail=document.getElementById('detail');
const AXIS_Y=75,CARD_W=144,CARD_H=58;
let selectedId=EVENTS[0].id;
const search=document.getElementById('search');
const allNodes=[];
const positions=[];
let x=92;
for(let i=0;i<EVENTS.length;i++){
  if(i>0){const gap=EVENTS[i].year-EVENTS[i-1].year;
    // Event-dense periods receive space; vacant historical periods are compressed.
    x+=Math.max(65,Math.min(145,53+17*Math.log2(gap+1)));
  }
  positions.push(x);
}
const W=Math.ceil(positions[positions.length-1]+98);
stage.style.width=W+'px';
// One compact upper lane and two staggered lower lanes.
// Avoid overlap using each card's actual left/right edge, including wide single-line cards.
const lanes=[{top:4,side:-1},{top:112,side:1},{top:178,side:1}];
let usedRight=lanes.map(()=>-10000);
const ticks=[1650,1700,1750,1800,1850,1900,1950];
const atYear=(y)=>{
  if(y<=EVENTS[0].year)return positions[0];
  if(y>=EVENTS[EVENTS.length-1].year)return positions[positions.length-1];
  for(let i=0;i<EVENTS.length-1;i++)if(EVENTS[i].year<=y&&y<=EVENTS[i+1].year){
    const a=EVENTS[i].year,b=EVENTS[i+1].year;
    return positions[i]+(positions[i+1]-positions[i])*((y-a)/(b-a||1));
  }
  return positions[0];
};
ticks.forEach(t=>{const el=document.createElement('div');el.className='tick';el.style.left=atYear(t)+'px';el.innerHTML='<span>'+t+'</span>';stage.appendChild(el)});
EVENTS.forEach((e,i)=>{
  const isInline=e.id==='kilsyth1742'||e.id==='mukti';
  const cardW=e.id==='mukti'?204:(e.id==='kilsyth1742'?158:CARD_W);
  const cardH=isInline?40:CARD_H;
  const left=positions[i]-cardW/2;
  const preference=isInline?[1,2,0]:(i%2===0?[0,2,1]:[2,0,1]);
  const choice=preference.find(n=>left-usedRight[n]>=8)??preference.reduce((best,n)=>usedRight[n]<usedRight[best]?n:best,preference[0]);
  const lane=lanes[choice];usedRight[choice]=left+cardW;
  const cardTop=lane.top+(isInline?(CARD_H-cardH)/2:0);
  const stem=document.createElement('span');stem.className='stem';stem.setAttribute('aria-hidden','true');stem.style.left=(positions[i]-.75)+'px';stem.style.top=(lane.side<0?cardTop+cardH:AXIS_Y)+'px';stem.style.height=(lane.side<0?AXIS_Y-(cardTop+cardH):cardTop-AXIS_Y)+'px';stage.appendChild(stem);
  const dot=document.createElement('span');dot.className='dot';dot.style.left=positions[i]+'px';dot.setAttribute('aria-hidden','true');stage.appendChild(dot);
  const node=document.createElement('button');node.type='button';node.className='event-node'+(isInline?' event-node-inline':'');node.style.width=cardW+'px';node.style.height=cardH+'px';node.style.left=left+'px';node.style.top=cardTop+'px';node.dataset.id=e.id;node.dataset.century=e.century;
  node.setAttribute('aria-label',e.date+' '+e.title+' 상세 보기');node.setAttribute('aria-pressed','false');
  const year=document.createElement('span');year.className='date';year.textContent=e.date;
  const name=document.createElement('span');name.className='name';name.textContent=e.title;
  node.title=e.topic;
  node.append(year,name);
  node.addEventListener('click',()=>selectEvent(e.id,true));stage.appendChild(node);
  allNodes.push({e,node,dot,stem});
});
function updateStatus(){
 const available=allNodes.filter(x=>!x.node.classList.contains('muted')).length;
 document.getElementById('trackStatus').textContent=available+'개 사건';
 document.getElementById('scrollProgress').style.width=(100*viewport.scrollLeft/(viewport.scrollWidth-viewport.clientWidth||1))+'%';
}
function selectEvent(id,bringDetail){
 const index=EVENTS.findIndex(e=>e.id===id); if(index<0)return;
 selectedId=id;const e=EVENTS[index];
 allNodes.forEach(a=>{const b=a.e.id===id;a.node.classList.toggle('active',b);a.node.setAttribute('aria-pressed',String(b));a.dot.classList.toggle('active',b)});
 document.getElementById('detailCount').textContent=(index+1)+' / '+EVENTS.length;
 document.getElementById('detailTitle').textContent=e.date+' · '+e.title;
 const body=document.getElementById('story');
 body.replaceChildren();
 for(const paragraph of e.story){const p=document.createElement('p');p.textContent=paragraph;body.appendChild(p);}
 if(e.id==='stewarton')addStewartonVideoAndStory(body);
 if(e.id==='korea')addKoreaFullStory(body);
 if(e.id==='raritan')addRaritanFullStory(body);
 if(e.id==='northampton')addNorthamptonFullStory(body);
 if(e.id==='wales'){
   const a=document.createElement('a');
   a.className='story-crosslink';
   a.href='./iain-murray-full-summary.html#chapter-6-section-4-u1';
   a.target='_blank';a.rel='noopener noreferrer';
   a.textContent='이안 머리 『성경적 부흥관 바로 세우기』 — 6.4 웨일즈 부흥 비평 읽기 ↗';
   a.setAttribute('aria-label','이안 머리의 웨일즈 부흥 비평 항목 새 창에서 열기');
   body.appendChild(a);
 }
 document.getElementById('prevBtn').disabled=index===0;
 document.getElementById('nextBtn').disabled=index===EVENTS.length-1;
 const target=positions[index]-viewport.clientWidth/2;
 viewport.scrollTo({left:Math.max(0,target),behavior:'instant'});
 if(bringDetail){
  if(document.documentElement.classList.contains('atlas-home-embedded')){
    window.parent.postMessage({type:'revival-atlas:focus',offset:detail.getBoundingClientRect().top+window.scrollY},window.location.origin);
  }else detail.scrollIntoView({behavior:'smooth',block:'start'});
 }
 updateStatus();
}
document.getElementById('prevBtn').addEventListener('click',()=>{let i=EVENTS.findIndex(e=>e.id===selectedId);if(i>0)selectEvent(EVENTS[i-1].id,false)});
document.getElementById('nextBtn').addEventListener('click',()=>{let i=EVENTS.findIndex(e=>e.id===selectedId);if(i<EVENTS.length-1)selectEvent(EVENTS[i+1].id,false)});
viewport.addEventListener('scroll',updateStatus,{passive:true});
viewport.addEventListener('keydown',e=>{const index=EVENTS.findIndex(v=>v.id===selectedId);if(e.key==='ArrowRight'&&index<EVENTS.length-1){e.preventDefault();selectEvent(EVENTS[index+1].id,false)}if(e.key==='ArrowLeft'&&index>0){e.preventDefault();selectEvent(EVENTS[index-1].id,false)}});
document.querySelectorAll('.tab[data-century]').forEach(tab=>tab.addEventListener('click',()=>{
 const value=tab.dataset.century;
 document.querySelectorAll('.tab[data-century]').forEach(n=>{let a=n===tab;n.classList.toggle('active',a);n.setAttribute('aria-pressed',String(a))});
 search.value='';allNodes.forEach(a=>{a.node.classList.remove('muted');a.dot.classList.remove('muted')});
 const match=EVENTS.find(e=>value==='all'||String(e.century)===value);
 if(match)selectEvent(match.id,false);
 updateStatus();
}));
search.addEventListener('input',()=>{
 const q=search.value.trim().toLocaleLowerCase();let first=null;
 allNodes.forEach(a=>{const s=[a.e.title,a.e.person,a.e.place,a.e.topic,a.e.date,...a.e.tags].join(' ').toLocaleLowerCase();const valid=!q||s.includes(q);a.node.classList.toggle('muted',!valid);a.dot.classList.toggle('muted',!valid);if(valid&&!first)first=a.e});
 if(q&&first)selectEvent(first.id,false);
 updateStatus();
});

/* A shared event link points to the main site; the home page opens the atlas and this event. */
const eventCopyButton=document.getElementById('eventCopyButton');
const eventCopyText=document.getElementById('eventCopyText');
let eventCopyTimer;
async function copyEventUrl(){
  const url=new URL('./revival-atlas-share.html',window.location.href);
  url.searchParams.set('event',selectedId);
  let done=false;
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      await navigator.clipboard.writeText(url.href);done=true;
    }
  }catch(_error){}
  if(!done){
    const tmp=document.createElement('textarea');tmp.value=url.href;tmp.readOnly=true;
    tmp.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(tmp);tmp.select();
    try{done=document.execCommand('copy')}catch(_error){}
    tmp.remove();
  }
  if(done){
    eventCopyText.textContent='복사됨 ✓';clearTimeout(eventCopyTimer);
    eventCopyTimer=setTimeout(()=>eventCopyText.textContent='링크 복사',1800);
  }else window.prompt('아래 주소를 복사하세요.',url.href);
}
eventCopyButton.addEventListener('click',copyEventUrl);
function activateSharedEvent(id,bringDetail=true){
  if(id==='shotts')id='stewarton'; // 16사건 시대의 오래된 쇼츠 공유 URL 유지

  if(!EVENTS.some(e=>e.id===id))return;
  selectEvent(id,false);
  const expanded=document.querySelector('#story [data-story-details]');
  if(expanded)expanded.open=true;
  if(bringDetail){
    if(document.documentElement.classList.contains('atlas-home-embedded')){
      window.parent.postMessage({type:'revival-atlas:focus',offset:detail.getBoundingClientRect().top+window.scrollY},window.location.origin);
    }else detail.scrollIntoView({block:'start',behavior:'auto'});
  }
}
function getInitialSharedEvent(){
  const q=new URLSearchParams(location.search).get('event');
  if(q)return q;
  const m=location.hash.match(/^#revival-event-([a-z0-9_-]+)$/);
  return m?m[1]:null;
}
window.addEventListener('message',function(event){
  if(event.source!==window.parent||event.origin!==location.origin)return;
  const data=event.data;
  if(data&&data.type==='revival-atlas:select'&&typeof data.id==='string'){
    activateSharedEvent(data.id,true);
  }
});
window.addEventListener('hashchange',function(){
  const id=getInitialSharedEvent();if(id)activateSharedEvent(id,true);
});

const initialSharedEvent=getInitialSharedEvent();
if(initialSharedEvent)activateSharedEvent(initialSharedEvent,true);
else selectEvent(EVENTS[0].id,false);
</script>
<script>
/* Parent homepage adjusts the expanded frame height; no nested vertical scrollbars. */
(function(){
 if(!document.documentElement.classList.contains('atlas-home-embedded'))return;
 let previousHeight=0;
 const report=function(){
   const main=document.querySelector('main');
   if(!main)return;
   // The iframe viewport may be taller than its content. Measuring body.scrollHeight
   // would include that viewport and prevent the frame from shrinking afterward.
   const h=Math.ceil(main.getBoundingClientRect().bottom + window.scrollY + 2);
   if(Math.abs(h-previousHeight)>1){
     previousHeight=h;
     window.parent.postMessage({type:'revival-atlas:height',height:h},window.location.origin);
   }
 };
 if('ResizeObserver' in window)new ResizeObserver(report).observe(document.querySelector('main'));
 window.addEventListener('load',report);
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(report);
 report();
})();
</script>
