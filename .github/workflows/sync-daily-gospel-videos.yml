name: Daily gospel YouTube video sync

'on':
  schedule:
    # Every day at 03:00 in Thailand (Asia/Bangkok, UTC+7).
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-gospel-video-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync public videos from YouTube Data API
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/sync_daily_gospel_videos.py

      - name: Commit updated video links
        run: |
          if git diff --quiet -- data/daily-gospel-video-map.json; then
            echo "Video links are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-gospel-video-map.json
          git commit -m "Auto-sync daily gospel YouTube video links"
          git pull --rebase origin main
          git push origin HEAD:main
