
name: Daily gospel YouTube video sync

'on':
  schedule:
    # Thailand 03:00 = UTC previous day 20:00
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-gospel-video-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync YouTube videos
        run: python3 scripts/sync_daily_gospel_videos.py

      - name: Commit updated video links
        run: |
          if git diff --quiet -- data/daily-gospel-video-map.json; then
            echo "No new videos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-gospel-video-map.json
          git commit -m "Auto-sync daily gospel YouTube video links"
          git push
