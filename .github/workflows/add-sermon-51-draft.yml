          #!/usr/bin/env python3
          """Apply draft sermon 51 in a checked-out revival-project repository.
          Invoked by GitHub Actions after user uploads the three files.
          """
          from pathlib import Path
          import sys
          
          root=Path(sys.argv[1]).resolve() if len(sys.argv)>1 else Path.cwd()
          required=['index.html','sermon-detail.html','data/sermon-series-ui.js','data/sermon-detail-ui.js','data/sermon-series-data.js']
          missing=[f for f in required if not (root/f).is_file()]
          if missing: raise SystemExit('기존 revival-project 경로가 아닙니다. 누락: '+', '.join(missing))
          target=root/'data'/'sermon-51-draft.js'
          if not target.is_file():
              raise SystemExit('중단: 제51회 설교 데이터 파일이 없습니다.')
          
          def edit(relative, actions):
              path=root/relative
              text=path.read_text(encoding='utf-8')
              original=text
              for old,new in actions:
                  if new in text:
                      continue # idempotent on a repeated run
                  n=text.count(old)
                  if n!=1: raise SystemExit(f'중단: {relative}에서 대상 문자열을 {n}개 발견 (1개 필요): {old[:90]!r}')
                  text=text.replace(old,new,1)
              if text!=original:
                  path.write_text(text,encoding='utf-8')
                  print('수정:',relative)
              else:print('변경 없음:',relative)
          
          index_css='''
          /* 추가 특별 설교 제51회: 눈에 띄는 초안 표기 및 바로가기 */
          #sermon .sermon-draft-badge {display:inline-block;background:#f2c07b;color:#4e2909;border:1px solid #ffd79e;border-radius:5px;padding:3px 10px;margin-top:13px;font-size:13px;font-weight:900;letter-spacing:.08em}
          #sermon .sermon-51-quicklink {display:inline-block;margin:7px 0 17px;padding:9px 15px;border:1px solid #bc9360;border-radius:7px;background:#fff4e6;color:#68390b;font-weight:850;font-size:13px;text-decoration:none}
          #sermon .sermon-51-quicklink:hover,#sermon .sermon-51-quicklink:focus-visible {background:#fce6c8;border-color:#875a29}
          '''
          detail_css='''
          /* 특별 제51회: 초안이 확정 설교로 오인되지 않도록 제목 상단에 명시 */
          .document-header .sermon-draft-banner {display:block;width:max-content;max-width:100%;margin:15px 0 4px;padding:7px 16px;border-radius:7px;border:2px solid #ffd69b;background:#f9c477;color:#442408;font:900 16px/1.5 "Noto Sans KR",sans-serif;letter-spacing:.04em}
          .document-header .sermon-draft-caption {color:#fff0d1;font-weight:800}
          @media(max-width:700px) {.document-header .sermon-draft-banner{font-size:15px;padding:7px 12px}}
          '''
          edit('index.html',[
           ('</style>',index_css+'</style>'),
           ('<script src="data/sermon-bible.js"></script>', '<script src="data/sermon-51-draft.js?v=20261030-draft-v1"></script>\n<script src="data/sermon-bible.js"></script>'),
           ('<div aria-label="50편 설교 카드" class="sermon-board"','<p><a class="sermon-51-quicklink" href="sermon-detail.html?sermon=51">제51회 특별 설교 · 초안 바로 보기</a></p><div aria-label="51편 설교 카드 (제51회는 초안)" class="sermon-board"'),
          ])
          edit('sermon-detail.html',[
           ('</style>',detail_css+'</style>'),
           ('<script src="data/sermon-detail-ui.js?v=20261019-refgrid-v3"></script>', '<script src="data/sermon-51-draft.js?v=20261030-draft-v1"></script><script src="data/sermon-detail-ui.js?v=20261030-sermon51-draft-v1"></script>'),
           ('aria-label="이어지는 설교 49편 목록"','aria-label="이어지는 설교 목록"'),
          ])
          edit('data/sermon-series-ui.js',[
           (' workState.textContent=`전체 ${all.length}편 중 ${completed}편 원고 확정`;',
            '  const drafts=all.filter(s=>s.draft===true).length;\n  workState.textContent=drafts?`기존 ${all.length-drafts}편 + 특별 ${drafts}편 초안 · ${completed}편 원고 확정`:`전체 ${all.length}편 중 ${completed}편 원고 확정`;'),
           ("   +'<span class=\"sermon-single-number\">SERMON '+String(s.order).padStart(2,'0')+'</span>'",
            "   +'<span class=\"sermon-single-number\">SERMON '+String(s.order).padStart(2,'0')+'</span>'\n   +(s.draft===true?'<span class=\"sermon-draft-badge\">초안 · 검토 전</span>':'')"),
          ])
          edit('data/sermon-detail-ui.js',[
           ('sermon.manuscriptFinalized&&sermon.detailedOutlineHtml?',
            '(sermon.manuscriptFinalized||sermon.draft===true)&&sermon.detailedOutlineHtml?'),
           ('<h2>강단용 상세 아웃라인</h2>',
            '<h2>강단용 상세 아웃라인${sermon.draft===true?\' · 초안\':\'\'}</h2>'),
           ('sermon.manuscriptFinalized&&sermon.manuscriptHtml?',
            '(sermon.manuscriptFinalized||sermon.draft===true)&&sermon.manuscriptHtml?'),
           ('>원고전체 읽기</button><div class="sermon-manuscript"',
            ">원고전체 읽기${sermon.draft===true?' · 초안':''}</button><div class=\"sermon-manuscript\""),
           ('</small><h1>${safe(sermon.title)}</h1>',
            "</small>${sermon.draft===true?'<div class=\"sermon-draft-banner\" role=\"status\">초안 · 검토 및 확정 전</div>':''}<h1>${safe(sermon.title)}</h1>"),
           ("${sermon.manuscriptFinalized?'설교 원고 확정 · 강단용 상세 아웃라인 제공':'설교원고 준비중'}",
            "${sermon.draft===true?'초안 · 주해 및 주석 검토 전 · 강단용 아웃라인과 단락형 원고 임시 제공':sermon.manuscriptFinalized?'설교 원고 확정 · 강단용 상세 아웃라인 제공':'설교원고 준비중'}"),
           ("<h2>${sermon.manuscriptFinalized?'보조 성경구절':'보조·후보 성경구절'}</h2>",
            "<h2>${sermon.manuscriptFinalized||sermon.draft===true?'보조 성경구절':'보조·후보 성경구절'}</h2>"),
           ("readToggle.textContent=open?'원고 접기':'원고전체 읽기';",
            "readToggle.textContent=open?'원고 접기':(sermon.draft===true?'원고전체 읽기 · 초안':'원고전체 읽기');"),
          ])
          print('확인:',target.relative_to(root))
          print('완료: 기존 1–50회 설교 데이터는 수정하지 않았습니다. 적용 후 화면과 스크립트 기능을 확인해 주세요.')
          PYBUILD
      - name: Commit draft content and four modified pages
        run: |
          git add data/sermon-51-draft.js index.html sermon-detail.html data/sermon-series-ui.js data/sermon-detail-ui.js
          if git diff --cached --quiet; then
            echo 'Sermon 51 is already applied.'
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Publish draft sermon 51 and detailed outline'
            git push
          fi
