name: Apply bibliography correction
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-bibliography.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct cards
        run: |
 python3 -c 'import json;from pathlib import Path;p=Path("data/site-data.js");s=p.read_text(encoding="utf-8");h="window.REVIVAL_SITE = ";d=json.loads(s[len(h):].strip().rstrip(";"));b=d["books"];assert len([x for x in b if x["author"]=="리처드 러블레이스"])==2;assert len([x for x in b if x["category"]=="추가 확보 예정" and x["author"]=="이안 머레이" and x["title"]=="부흥"])==1;d["books"]=[{"category":"영적 갱신 · 부흥신학","title":"온전한 영성","author":"리처드 러블레이스","note":"원제 Renewal as a Way of Life(1985), 한국어판 2008. Dynamics of Spiritual Life(1979)는 별도의 저서입니다."}]+[x for x in b if x["author"]!="리처드 러블레이스" and not(x["category"]=="추가 확보 예정" and x["author"]=="이안 머레이" and x["title"]=="부흥")];assert len(d["books"])==6;p.write_text(h+json.dumps(d,ensure_ascii=False,indent=2)+";\n",encoding="utf-8")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.js
          git commit -m "Correct Lovelace bibliography cards"
          git push
