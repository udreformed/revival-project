name: Correct books safely
on:
  push:
    branches: [main]
    paths: [.github/workflows/correct-books-final.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct books
        run: python3 -c 'import json;from pathlib import Path;p=Path("data/site-data.js");s=p.read_text(encoding="utf-8");h="window.REVIVAL_SITE = ";d=json.loads(s[len(h):].strip().rstrip(";"));b=d["books"];assert len([x for x in b if x["author"]=="리처드 러블레이스"])==2;assert len([x for x in b if x["category"]=="추가 확보 예정" and x["author"]=="이안 머레이" and x["title"]=="부흥"])==1;d["books"]=[{"category":"영적 갱신 · 부흥신학","title":"온전한 영성","author":"리처드 러블레이스","note":"원제 Renewal as a Way of Life(1985), 한국어판 2008. Dynamics of Spiritual Life(1979)는 별도의 저서입니다."}]+[x for x in b if x["author"]!="리처드 러블레이스" and not(x["category"]=="추가 확보 예정" and x["author"]=="이안 머레이" and x["title"]=="부흥")];assert len(d["books"])==6;p.write_text(h+json.dumps(d,ensure_ascii=False,indent=2)+";\n",encoding="utf-8")'
      - name: Commit changes
        run: git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -am "Fix bibliography cards"
      - name: Push changes
        run: git push
