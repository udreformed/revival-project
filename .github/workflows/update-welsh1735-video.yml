name: '4번 웨일스 칼빈주의 부흥 영상 교체'

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-welsh1735-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-video:
    name: '1735년 웨일스 영상만 변경'
    runs-on: ubuntu-latest
    steps:
      - name: '최신 데이터 가져오기'
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: '정확한 4번 사건의 영상 2필드만 교체'
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          import json

          path = Path('data/revival-atlas-30.js')
          original = path.read_text(encoding='utf-8')
          marker = 'window.REVIVAL_ATLAS_30='
          if marker not in original:
              raise RuntimeError('연대표 데이터 선언을 찾을 수 없습니다.')

          key = '"id":"welsh1735"'
          if original.count(key) != 1:
              raise RuntimeError('4번 웨일스 칼빈주의 부흥 항목이 정확히 하나가 아닙니다.')
          start = original.index(key, original.index(marker))
          end = original.find(',"body":', start)
          if end < 0:
              raise RuntimeError('본문 시작 위치를 찾을 수 없습니다.')
          event_head = original[start:end]
          if '"title":"웨일스 칼빈주의 부흥"' not in event_head or '"year":1735' not in event_head:
              raise RuntimeError('정확히 1735년 웨일스 칼빈주의 부흥 항목인지 확인할 수 없습니다.')

          pattern = r'"videoId":(?:null|"[^"]*"),"videoUrl":(?:null|"[^"]*")'
          replacement = '"videoId":"I2dVA6cTjeE","videoUrl":"https://youtu.be/I2dVA6cTjeE"'
          updated_head, number = re.subn(pattern, replacement, event_head)
          if number != 1:
              raise RuntimeError(f'영상 필드 교체 지점이 {number}개입니다. 안전을 위해 중단합니다.')

          updated = original[:start] + updated_head + original[end:]
          data_start = updated.index('[', updated.index(marker))
          data_end = updated.rindex(']')
          records = json.loads(updated[data_start:data_end+1])
          if len(records) != 30:
              raise RuntimeError(f'30편 중 {len(records)}편만 찾았습니다.')
          fourth = records[3]
          if fourth['id'] != 'welsh1735' or fourth['videoId'] != 'I2dVA6cTjeE':
              raise RuntimeError('4번 영상이 올바르게 바뀌었는지 확인할 수 없습니다.')
          modern = next(item for item in records if item['id'] == 'wales')
          if modern['videoId'] != 'pJhZBPgyVgs':
              print('주의: 19번 영상은 변경하지 않았으나 현재 ID가 예상과 다릅니다:', modern['videoId'])
          if updated == original:
              print('이미 새 영상으로 연결되어 있습니다. 변경할 내용이 없습니다.')
          else:
              path.write_text(updated, encoding='utf-8')
              print('교체 완료: 4번 1735년 웨일스 칼빈주의 부흥 영상 → I2dVA6cTjeE')
              print('나머지 29편, 기존 글·출처·주석은 그대로 유지됩니다.')
          PYCODE

      - name: '수정된 한 파일만 저장'
        shell: bash
        run: |
          if git diff --quiet -- data/revival-atlas-30.js; then
            echo '이미 수정되어 있거나 변경 사항이 없습니다.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/revival-atlas-30.js
          git commit -m '영상 교체: 4번 웨일스 칼빈주의 부흥 I2dVA6cTjeE'
          git push origin HEAD:main
