name: Publish revival project logo
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-logo.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image dependencies
        run: python3 -m pip install --quiet pillow cairosvg
      - name: Apply logo and social metadata
        run: python3 -c "import base64,gzip;exec(gzip.decompress(base64.b64decode('')))"
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets index.html
          git diff --cached --quiet || (git commit -m "Publish logo, favicon, and social preview" && git push origin HEAD:main)
