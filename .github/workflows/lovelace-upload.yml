name: Link Lovelace full summary on upload
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lovelace-upload.yml
      - books/lovelace/index.html
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare folder and link detail page
        run: |
          mkdir -p books/lovelace
          if [ -f books/lovelace/index.html ]; then
            python3 - &lt;&lt;'PY'
            from pathlib import Path
            p=Path("index.html")
            s=p.read_text(encoding="utf-8")
            tag='data-detail-lovelace'
            if tag not in s:
                js=''';(function(){const c=[...document.querySelectorAll(".book")].find(x=>x.querySelector("h3")?.textContent==="온전한 영성");if(c){const a=document.createElement("a");a.href="/books/lovelace/";a.className="detail-link";a.setAttribute("data-detail-lovelace","1");a.textContent="상세 요약 보기 →";a.style.cssText="display:inline-block;margin-top:14px;color:#216f69;font-weight:800;font-size:13px";c.appendChild(a)}})();'''
                old="&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"
                assert old in s
                p.write_text(s.replace(old,js+old,1),encoding="utf-8")
            PY
          else
            touch books/lovelace/.gitkeep
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Prepare Lovelace book page and card link"
            git push
          fi
