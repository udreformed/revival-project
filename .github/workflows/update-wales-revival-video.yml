name: '웨일스 부흥 1904 영상 교체 (한 번만 적용)'

on:
  push:
    paths:
      - '.github/workflows/update-wales-revival-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-wales-video:
    name: '웨일스 부흥 영상만 교체'
    runs-on: ubuntu-latest
    steps:
      - name: '저장소 최신 파일 가져오기'
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: '1904 웨일스 부흥 영상만 교체 및 30편 검증'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          target = Path('data/revival-atlas-30.js')
          source = target.read_text(encoding='utf-8')
          marker = 'window.REVIVAL_ATLAS_30='
          if marker not in source:
              raise RuntimeError('연대표 데이터 선언을 찾을 수 없습니다.')

          key = '"id":"wales"'
          if source.count(key) != 1:
              raise RuntimeError('1904년 웨일스 부흥 기록이 정확히 하나가 아닙니다.')

          start = source.index(key, source.index(marker))
          end = source.find(',"body":', start)
          if end == -1:
              raise RuntimeError('웨일스 부흥 기록 구조가 예상과 다릅니다.')

          original = source[start:end]
          if '"title":"웨일스 부흥"' not in original or '"year":1904' not in original:
              raise RuntimeError('1904–1905년 웨일스 부흥 기록인지 확인할 수 없습니다.')

          rx = r'"videoId":(?:null|"[^"]*"),"videoUrl":(?:null|"[^"]*")'
          replacement = '"videoId":"pJhZBPgyVgs","videoUrl":"https://youtu.be/pJhZBPgyVgs"'
          changed, count = re.subn(rx, replacement, original)
          if count != 1:
              raise RuntimeError(f'교체 대상 영상 필드를 정확히 찾지 못했습니다. 일치: {count}')

          result = source[:start] + changed + source[end:]
          content = result[result.index('[', result.index(marker)):result.rindex(']') + 1]
          items = json.loads(content)
          assert len(items) == 30, '연대표 30편이 아닙니다.'
          assert next(e for e in items if e['id'] == 'wales')['videoId'] == 'pJhZBPgyVgs'
          assert next(e for e in items if e['id'] == 'welsh1735')['videoId'] != 'pJhZBPgyVgs'

          if result == source:
              print('이미 최신 영상이 연결되어 있어 수정할 내용이 없습니다.')
          else:
              target.write_text(result, encoding='utf-8')
              print('검증 완료: 1904년 웨일스 부흥 영상만 교체했습니다.')
          PY

      - name: '변경된 JS 파일만 GitHub에 저장'
        shell: bash
        run: |
          if git diff --quiet -- data/revival-atlas-30.js; then
            echo '변경 사항이 없으므로 커밋하지 않습니다.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/revival-atlas-30.js
          git commit -m '웨일스 부흥 1904 영상 pJhZBPgyVgs 교체'
          git push origin HEAD:main
