name: "부흥 이야기 2번 · 뉴저지 래리턴 각성 영상 교체"

on:
  push:
    paths:
      - ".github/workflows/update-revival-video-02-raritan.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-video:
    name: "2번 영상만 교체하고 30편 전체 검증"
    runs-on: ubuntu-latest
    steps:
      - name: "GitHub 최신 원본 읽기"
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: "래리턴 각성 영상 주소만 정확히 교체"
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('data/revival-atlas-30.js')
          before = path.read_text(encoding='utf-8')
          marker = 'window.REVIVAL_ATLAS_30='
          if marker not in before:
              raise SystemExit('연대표 데이터 선언이 없습니다. 변경을 중단합니다.')

          def parse(source):
              start = source.index('[', source.index(marker))
              end = source.rindex(']') + 1
              data = json.loads(source[start:end])
              if len(data) != 30:
                  raise SystemExit(f'30개 기록 검증 실패: {len(data)}개')
              if data[1]['id'] != 'raritan' or data[1]['year'] != 1720:
                  raise SystemExit('2번 사건이 래리턴 각성이 아닙니다. 변경을 중단합니다.')
              return data

          records_before = parse(before)
          target_key = '"id":"raritan"'
          if before.count(target_key) != 1:
              raise SystemExit('래리턴 사건 ID가 정확히 한 번 나타나지 않습니다.')

          start = before.index(target_key, before.index(marker))
          end = before.find(',"body":', start)
          if end < start:
              raise SystemExit('래리턴 사건의 본문 경계를 확인할 수 없습니다.')
          part = before[start:end]
          if '"title":"뉴저지 래리턴 각성"' not in part or '"year":1720' not in part:
              raise SystemExit('대상 사건 이름/연도가 맞지 않습니다.')

          field_pattern = r'"videoId":(?:null|"[^"]*"),"videoUrl":(?:null|"[^"]*")'
          new_fields = '"videoId":"gduD4WWG6rc","videoUrl":"https://youtu.be/gduD4WWG6rc"'
          changed_part, count = re.subn(field_pattern, new_fields, part)
          if count != 1:
              raise SystemExit(f'영상 필드 발견 횟수가 1회가 아닙니다: {count}')

          after = before[:start] + changed_part + before[end:]
          records_after = parse(after)
          assert records_after[1]['videoId'] == 'gduD4WWG6rc'
          assert records_after[1]['videoUrl'] == 'https://youtu.be/gduD4WWG6rc'
          assert records_after[1]['body'] == records_before[1]['body']
          assert records_after[1]['annotations'] == records_before[1]['annotations']
          assert records_after[1]['sources'] == records_before[1]['sources']
          assert all(records_before[i] == records_after[i] for i in range(30) if i != 1), '다른 사건이 변경되었습니다.'
          if after == before:
              print('2번 영상이 이미 교체되어 있습니다.')
          else:
              path.write_text(after, encoding='utf-8')
              print('검증 성공: 2번 뉴저지 래리턴 각성 영상 주소만 교체했습니다.')
          PY

      - name: "변경된 원본 파일만 main에 반영"
        shell: bash
        run: |
          if git diff --quiet -- data/revival-atlas-30.js; then
            echo "변경 없음: 이미 교체된 상태입니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/revival-atlas-30.js
          git commit -m "Replace revival story 2 video with gduD4WWG6rc"
          git push origin HEAD:main
